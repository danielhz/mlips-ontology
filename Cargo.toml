[package]
name = "onto-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
oxigraph = "0.5"
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
html-escape = "0.2"
