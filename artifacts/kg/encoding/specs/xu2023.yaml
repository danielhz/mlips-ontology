methods:
  DeePMD:
    hp: [cutoffRadius, learningRate]
    algorithm: "DeepPot-SE (se_a) with smoothing from 5.8 A; embedding layers 25, 50, 100; learning rate 1e-3 decaying by 0.95 every 5000 steps; 2000 K and 3000 K data combined"
    impl: {lib: DeePMDkit}
    sims: [MolecularDynamics]
runs:
