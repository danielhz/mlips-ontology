  s-t-macemp0l: {label: "CACE-LES student for TiO2-water distilled from MACE-MP-0(L)", method: CACE-LES, dataset: t-macemp0l, settings: {cutoffRadius: {v: 5.5, loc: "Methods"}, numRadialBasis: {v: 6, loc: "Methods"}, numLayers: {v: 0, loc: "Methods (T = 0)"}}, model: "CACE-LES TiO2-water student (MACE-MP-0(L))", base_model: {label: "MACE-MP-0(L)", relation: distilled, location: "Results"}}
  s-t-macemh1omat: {label: "CACE-LES student for TiO2-water distilled from MACE-MH-1(OMat)", method: CACE-LES, dataset: t-macemh1omat, settings: {cutoffRadius: {v: 5.5, loc: "Methods"}, numRadialBasis: {v: 6, loc: "Methods"}, numLayers: {v: 0, loc: "Methods (T = 0)"}}, model: "CACE-LES TiO2-water student (MACE-MH-1(OMat))", base_model: {label: "MACE-MH-1(OMat)", relation: distilled, location: "Results"}}
  s-t-gemnetoc22: {label: "CACE-LES student for TiO2-water distilled from GemNet-OC22", method: CACE-LES, dataset: t-gemnetoc22, settings: {cutoffRadius: {v: 5.5, loc: "Methods"}, numRadialBasis: {v: 6, loc: "Methods"}, numLayers: {v: 0, loc: "Methods (T = 0)"}}, model: "CACE-LES TiO2-water student (GemNet-OC22)", base_model: {label: "GemNet-OC22", relation: distilled, location: "Results"}}
  s-t-umamoc20: {label: "CACE-LES student for TiO2-water distilled from UMA-M(OC20)", method: CACE-LES, dataset: t-umamoc20, settings: {cutoffRadius: {v: 5.5, loc: "Methods"}, numRadialBasis: {v: 6, loc: "Methods"}, numLayers: {v: 0, loc: "Methods (T = 0)"}}, model: "CACE-LES TiO2-water student (UMA-M(OC20))", base_model: {label: "UMA-M(OC20)", relation: distilled, location: "Results"}}
