  scan-t0: {label: "CACE-LES fitted directly to SCAN TiO2-water data (5.5 A, T = 0)", method: CACE-LES, dataset: t-scan, settings: {cutoffRadius: {v: 5.5, loc: "Methods"}, numLayers: {v: 0, loc: "Methods (T = 0)"}}, model: "CACE-LES SCAN TiO2-water (T = 0)"}
