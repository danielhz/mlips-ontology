results:
  - {key: scan-t0-test, model: scan-t0, material: tio2w, role: test, eval_data: {label: "SCAN TiO2-water test split", location: "Methods"}, metrics: [[RMSE, Force, 73.3, meV/A, "test force RMSE on TiO2-water (SCAN): CACE-LES T = 0", "Methods"]]}
  - {key: scan-t1-test, model: scan-t1, material: tio2w, role: test, eval_data: {label: "SCAN TiO2-water test split", location: "Methods"}, metrics: [[RMSE, Force, 67.1, meV/A, "test force RMSE on TiO2-water (SCAN): CACE-LES T = 1", "Methods"]]}
gaps:
  - "Student test RMSEs are given only as bounds (water: energy below 0.5 meV/atom, force below about 25 meV/A; HCl below 0.7 meV/atom and 20 meV/A; TiO2-water below 0.3 meV/atom and 80 meV/A); BEC errors and IR spectra are properties. The six students trained on RPBE-D3 AIMD water configurations and the SCAN fine-tuned students are not separate runs here."
