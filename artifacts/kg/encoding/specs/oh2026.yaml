study_label: "Oh et al. (2026): SevenNet-Nano, a lightweight universal MLIP distilled from SevenNet-Omni"
scope: |
  Encoding scope: the four SevenNet-Nano models (cutoff 4.5, 5.0, 5.5 and
  6.0 A; 105k parameters) distilled from the mpa channel of SevenNet-Omni
  on teacher-labelled structures of the SevenNet-Omni training databases,
  the fine-tuned SevenNet-Nano-5.0 models, and the MD throughputs on
  amorphous SiO2 (Sec. on speed, Fig. 11). Benchmark accuracies (Figs.
  2-10) are figure-only; validation MAEs are stated only as ranges over the
  four cutoffs.
materials:
  universal: {label: "Inorganic crystals, molecules, surfaces, MOFs and multi-domain structures of the SevenNet-Omni training databases", class: "Universal (materials and molecules)"}
  sse: {label: "Li solid-state electrolytes (eight argyrodites, LLZO, LATP, LGPS, Li7P3S11, Li3YCl6, Li3YBr6, Li3N, Li9S3N)", class: "Li solid electrolytes"}
  sio2: {label: "Amorphous SiO2 (70 to 70,000 atoms)", formula: "SiO2", class: "Amorphous oxide"}
reference:
  teacher: {type: REF, comment: "Labels are inferences of the SevenNet-Omni teacher (mpa channel, PBE level) including atomic energies; no DFT labels are used for training."}
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, comment: "Benchmark DFT (MPtrj-consistent, spin-polarised)."}
datasets:
  omni-distill: {label: "SevenNet-Omni-labelled distillation set from MPtrj, MPtrj-r2SCAN, Alex, OMat24, MatPES, OMol25, SPICE, QCML, OC20, OC22, ODAC23 and MAD structures (with oversampling)", materials: [universal], properties: [Energy, Forces, Stresses], provenance: Augmented, calc: teacher}
  lsn-ft: {label: "SevenNet-Omni-labelled fine-tuning set from SevenNet-Nano-5.0 MD of the solid electrolytes (7,515 configurations, 90/10 split)", materials: [sse], properties: [Energy, Forces, Stresses], provenance: Augmented, n: {v: 7515, loc: "Li diffusion section"}, calc: teacher}
methods:
  NequIP:
    hp: [cutoffRadius, numFeatures, numLayers, numEpochs, learningRate]
    loss: "MAE-type loss on energy (1.0), forces (1.0), stress (2e-4) and atomic energies (0.5) from the teacher"
    algorithm: "Knowledge distillation from SevenNet-Omni (AdamW, two epochs); fine-tuning with Adam, warm-up to 0.03 then cosine annealing"
    impl: {lib: {local: "SevenNet", comment: "SevenNet; LAMMPS with FlashTP"}}
    sims: [MolecularDynamics, GeometryOptimization]
  MACE: {sims: [MolecularDynamics]}
runs:
  7net-omni: {label: "SevenNet-Omni as distributed (teacher, 26M parameters)", method: NequIP, model: "SevenNet-Omni"}
  7net-0: {label: "SevenNet-0 as distributed (MPtrj)", method: NequIP, model: "SevenNet-0 (7net-0)"}
  mace-mp-0-small: {label: "MACE-mp-0-small as distributed", method: MACE, model: "MACE-MP-0 small"}
  nano-45: {label: "SevenNet-Nano-4.5 distilled from SevenNet-Omni (mpa channel)", method: NequIP, dataset: omni-distill, settings: {cutoffRadius: {v: 4.5, loc: "Training of 7net-Nano"}, numFeatures: {v: 32, loc: "Training of 7net-Nano"}, numLayers: {v: 3, loc: "Training of 7net-Nano"}, numEpochs: {v: 2, loc: "Training of 7net-Nano"}}, model: "SevenNet-Nano-4.5 (105k parameters)", base_model: {run: 7net-omni, relation: distilled, location: "Training of 7net-Nano"}}
  nano-50: {label: "SevenNet-Nano-5.0 distilled from SevenNet-Omni (mpa channel)", method: NequIP, dataset: omni-distill, settings: {cutoffRadius: {v: 5.0, loc: "Training of 7net-Nano"}, numFeatures: {v: 32, loc: "Training of 7net-Nano"}, numLayers: {v: 3, loc: "Training of 7net-Nano"}, numEpochs: {v: 2, loc: "Training of 7net-Nano"}}, model: "SevenNet-Nano-5.0 (105k parameters)", base_model: {run: 7net-omni, relation: distilled, location: "Training of 7net-Nano"}}
  nano-55: {label: "SevenNet-Nano-5.5 distilled from SevenNet-Omni (mpa channel)", method: NequIP, dataset: omni-distill, settings: {cutoffRadius: {v: 5.5, loc: "Training of 7net-Nano"}, numFeatures: {v: 32, loc: "Training of 7net-Nano"}, numLayers: {v: 3, loc: "Training of 7net-Nano"}, numEpochs: {v: 2, loc: "Training of 7net-Nano"}}, model: "SevenNet-Nano-5.5 (105k parameters)", base_model: {run: 7net-omni, relation: distilled, location: "Training of 7net-Nano"}}
  nano-60: {label: "SevenNet-Nano-6.0 distilled from SevenNet-Omni (mpa channel)", method: NequIP, dataset: omni-distill, settings: {cutoffRadius: {v: 6.0, loc: "Training of 7net-Nano"}, numFeatures: {v: 32, loc: "Training of 7net-Nano"}, numLayers: {v: 3, loc: "Training of 7net-Nano"}, numEpochs: {v: 2, loc: "Training of 7net-Nano"}}, model: "SevenNet-Nano-6.0 (105k parameters)", base_model: {run: 7net-omni, relation: distilled, location: "Training of 7net-Nano"}}
  ft-nano-50: {label: "SevenNet-Nano-5.0 fine-tuned on teacher-labelled solid-electrolyte MD snapshots", method: NequIP, dataset: lsn-ft, settings: {numEpochs: {v: 100, loc: "Li diffusion section"}, learningRate: {v: 0.03, loc: "Li diffusion section (peak)"}}, model: "FT-7net-Nano-5.0 (solid electrolytes)", base_model: {run: nano-50, relation: fine-tuned, location: "Li diffusion section"}}
