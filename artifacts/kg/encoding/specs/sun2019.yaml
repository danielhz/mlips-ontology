id: sun2019
source:
  rank: 495
  year: "2019"
  first_author: "Geng Sun"
  title: "Toward Fast and Reliable Potential Energy Surfaces for Metallic Pt Clusters by Hierarchical Delta Neural Networks"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.9b00465"
  kg_relevance: "Training/reliability"
  arxiv_id: ""
  pdf_version: "submittedVersion"
  pdf_sha256: "451fefc58239477fac32e26e71d4a1319dd41b2ea38d3832b7b0687d74240d4c"
study_label: "Sun and Sautet (2019): hierarchical delta neural network potentials (Delta-HDNNP) for Pt clusters, from single-zeta DFT baselines to plane-wave PBE, optPBE-vdW and TPSSh"
scope: |
  Encoding scope: aenet HDNNPs (46 symmetry functions, 46-(2x30)-1,
  6.5 A cutoff) for Pt6-Pt20 clusters, trained directly on PBE(VASP-PW)
  energies or as Delta-HDNNPs on the difference to a cheap baseline
  (PBE single-zeta in GPAW or CP2K, or PBE plane waves for functional
  corrections); the RMSEs stated in the text. Delta-learning is a run
  setting. Chebyshev-descriptor variants, architecture scans and the
  Delta2 hierarchical scheme are figure-only.
materials:
  pt: {label: "Compact Pt clusters with 6-20 atoms (Pt25 and Pt55 for transfer tests)", formula: Pt, class: "Metal cluster"}
reference:
  pbepw: {type: DFT, code: VASP, xc: PBE, cutoff: 250, kpoints: "Gamma point", comment: "Non-spin-polarized PBE(VASP-PW)"}
  optpbe: {type: DFT, code: VASP, xc: {local: optPBE-vdW}, comment: "optPBE-vdW(VASP-PW)"}
  tpssh: {type: DFT, code: VASP, xc: {local: TPSSh}, comment: "TPSSh(VASP-PW)"}
sampling:
  rand: {label: "Random cluster geometries extended by local optimization or short MD; compact clusters kept"}
datasets:
  pbe: {label: "PBE(VASP-PW) Pt-cluster database (6,402 structures; 90% train, 10% control)", materials: [pt], properties: [Energy], provenance: InHouse, n: {v: 6402, loc: "Sec. 2.2"}, calc: pbepw, sampling: [rand]}
  optpbe: {label: "optPBE-vdW(VASP-PW) database (2,362 structures drawn from the PBE database)", materials: [pt], properties: [Energy], provenance: InHouse, n: {v: 2362, loc: "Sec. 2.2, Sec. 4"}, calc: optpbe, sampling: [rand]}
  tpssh: {label: "TPSSh(VASP-PW) database (2,362 structures drawn from the PBE database)", materials: [pt], properties: [Energy], provenance: InHouse, n: {v: 2362, loc: "Sec. 2.2, Sec. 4"}, calc: tpssh, sampling: [rand]}
methods:
  HDNNP:
    hp: [cutoffRadius, numLayers, numFeatures]
    loss: "Energies (aenet)"
    algorithm: "Three independent trainings per case; early stopping or 5000th iteration"
    impl: {lib: {local: aenet}}
    sims: [MolecularDynamics]
runs:
  direct: {label: "Direct HDNNP 46-(2x30)-1 on PBE(VASP-PW)", method: HDNNP, dataset: pbe, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 2.1"}, numLayers: {v: 2, loc: "Sec. 3.1.1"}, numFeatures: {v: 46, loc: "Sec. 3.1.1 (input layer size)"}}, model: "HDNNP Pt clusters PBE(VASP-PW)"}
  d1: {label: "Delta1-HDNNP 46-(2x30)-1: PBE(VASP-PW) minus PBE(GPAW-SZ)", method: HDNNP, dataset: pbe, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 2.1"}, numLayers: {v: 2, loc: "Sec. 3.2"}, numFeatures: {v: 46, loc: "Sec. 3.2"}}, model: "Delta1-HDNNP Pt clusters (GPAW-SZ baseline)"}
  d1-optpbe: {label: "Delta-HDNNP: optPBE-vdW(VASP-PW) minus PBE(CP2K-SZ)", method: HDNNP, dataset: optpbe, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 2.1"}, numLayers: {v: 2, loc: "Sec. 4"}, numFeatures: {v: 46, loc: "Sec. 4"}}, model: "Delta-HDNNP Pt optPBE-vdW (CP2K-SZ baseline)"}
  d1-tpssh: {label: "Delta-HDNNP: TPSSh(VASP-PW) minus PBE(CP2K-SZ)", method: HDNNP, dataset: tpssh, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 2.1"}, numLayers: {v: 2, loc: "Sec. 4"}, numFeatures: {v: 46, loc: "Sec. 4"}}, model: "Delta-HDNNP Pt TPSSh (CP2K-SZ baseline)"}
  d2-optpbe: {label: "Delta-HDNNP: optPBE-vdW(VASP-PW) minus PBE(VASP-PW), 10% training", method: HDNNP, dataset: optpbe, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 2.1"}, numLayers: {v: 2, loc: "Sec. 4"}, numFeatures: {v: 46, loc: "Sec. 4"}}, model: "Delta-HDNNP Pt optPBE-vdW (PBE plane-wave baseline)"}
results:
  - {key: direct-tr, model: direct, material: pt, role: training, eval_data: {label: "PBE(VASP-PW) trainset (90%)", location: "Sec. 3.2"}, metrics: [[RMSE, Energy, 14, meV/atom, "trainset energy RMSE on Pt clusters: direct HDNNP (X = 46)", "Sec. 3.2"]]}
  - {key: direct-ctl, model: direct, material: pt, role: validation, eval_data: {label: "PBE(VASP-PW) control set (10%)", location: "Sec. 3.1.1, 3.2"}, metrics: [[RMSE, Energy, 18, meV/atom, "control-set energy RMSE on Pt clusters: direct HDNNP (X = 46)", "Sec. 3.2"]]}
  - {key: d1-tr, model: d1, material: pt, role: training, eval_data: {label: "PBE(VASP-PW) trainset (90%)", location: "Sec. 3.2"}, metrics: [[RMSE, Energy, 8, meV/atom, "trainset energy RMSE on Pt clusters: Delta1-HDNNP (X = 46)", "Sec. 3.2"]]}
  - {key: d1-ctl, model: d1, material: pt, role: validation, eval_data: {label: "PBE(VASP-PW) control set (10%)", location: "Sec. 3.2"}, metrics: [[RMSE, Energy, 10, meV/atom, "control-set energy RMSE on Pt clusters: Delta1-HDNNP (X = 46)", "Sec. 3.2"]]}
  - {key: d1-optpbe-ctl, model: d1-optpbe, material: pt, role: validation, eval_data: {label: "optPBE-vdW control set (90% training)", location: "Sec. 4, Fig. 10a"}, metrics: [[RMSE, Energy, 10, meV/atom, "control-set energy RMSE on Pt clusters (optPBE-vdW): Delta-HDNNP, CP2K-SZ baseline", "Sec. 4"]]}
  - {key: d1-tpssh-ctl, model: d1-tpssh, material: pt, role: validation, eval_data: {label: "TPSSh control set (90% training)", location: "Sec. 4, Fig. 10b"}, metrics: [[RMSE, Energy, 15, meV/atom, "control-set energy RMSE on Pt clusters (TPSSh): Delta-HDNNP, CP2K-SZ baseline", "Sec. 4"]]}
  - {key: d2-optpbe-ctl, model: d2-optpbe, material: pt, role: validation, eval_data: {label: "optPBE-vdW control set (90% held out)", location: "Sec. 4, Fig. 10a"}, metrics: [[RMSE, Energy, 1.5, meV/atom, "control-set energy RMSE on Pt clusters (optPBE-vdW): Delta-HDNNP, PBE plane-wave baseline, 10% training", "Sec. 4"]]}
gaps:
  - "The text gives the control/trainset pair as '14/18 to 8/10 (RMSE (control set)/RMSE(trainset))', but also states the direct HDNNP control-set error as 18 meV/atom; the encoding follows the explicit 18 meV/atom (control 18, train 14; Delta1 control 10, train 8)."
  - "Approximate values ('around 23', 'about 28.2'), force errors from error distributions (0.96 and 0.47 eV/A, metric not named), Pt25/Pt55 absolute and relative errors, Chebyshev and architecture scans, the Delta2 scheme and CPU timings are not encoded."
