  - {model: meng-nnip, system: "6x6x6 alpha-Fe supercell with 1 at.% interstitial H, 10,000-step NVT MD", atoms: null, value: 2.09, unit: "ms per (atom x step)", per_atom_us: 2090, hardware: "single core of a Xeon Gold 6230 CPU", result: null, location: "Table III"}
  - {model: tabgap, system: "6x6x6 alpha-Fe supercell with 10 at.% interstitial H, 10,000-step NVT MD", atoms: null, value: 0.0172, unit: "ms per (atom x step)", per_atom_us: 17.2, hardware: "single core of a Xeon Gold 6230 CPU", result: null, location: "Table III"}
