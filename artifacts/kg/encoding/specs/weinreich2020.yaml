  - {key: nn-202020-test, model: nn-202020, material: cuzn, role: test, eval_data: {label: "Cu-Zn test set (after 20 epochs)", location: "Table 2"}, metrics: [[RMSE, Energy, 1.66, meV/atom, "test energy RMSE on Cu-Zn: HDNNP 20-20-20", "Table 2"], [RMSE, Force, 39.0, meV/A, "test force RMSE on Cu-Zn: HDNNP 20-20-20", "Table 2"]]}
gaps:
  - "Sec. 4.1 quotes the selected 20-20 model with rounded RMSEs (1.8 and 1.7 meV/atom, 39.5 and 38.7 meV/A), slightly different from Table 2 (38.8 meV/A test force); Table 2 values are encoded. Errors on 150 annealed 216-atom clusters are shown as histograms (Fig. 11)."
