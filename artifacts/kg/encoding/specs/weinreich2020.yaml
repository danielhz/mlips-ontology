  - {key: nn-1010-test, model: nn-1010, material: cuzn, role: test, eval_data: {label: "Cu-Zn test set (after 20 epochs)", location: "Table 2"}, metrics: [[RMSE, Energy, 1.76, meV/atom, "test energy RMSE on Cu-Zn: HDNNP 10-10", "Table 2"], [RMSE, Force, 41.1, meV/A, "test force RMSE on Cu-Zn: HDNNP 10-10", "Table 2"]]}
