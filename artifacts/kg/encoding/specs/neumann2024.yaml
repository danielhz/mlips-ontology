study_label: "Neumann et al. (2024): Orb, a fast scalable neural network potential (technical report)"
scope: |
  Encoding scope: the Orb architecture (introduced here; ORB in the
  registry), the universal Orb models trained on MPtrj and Alexandria
  (and on MPtrj only), the D3-corrected Orb-D3, and the four molecule-
  specific Orb models fine-tuned on MD17-10k. Results: the Matbench
  Discovery energy MAE and R2 (Table 1) and the MD17 test force MAEs of the
  fine-tuned models (Table 2). Stability, h(r), the zero-shot MD17 study
  (Table 3), MOF-5 MD and Mg-MOF-74 adsorption are not accuracy metrics of
  the schema; baseline values quoted from other papers are not encoded.
materials:
  wbm: {label: "Inorganic crystals of the WBM test set (Matbench Discovery)", class: "Inorganic crystalline materials"}
  aspirin: {label: "Aspirin molecule (MD17)", formula: "C9H8O4", class: "Small organic molecule (gas phase)", wikidata: Q18216}
  ethanol: {label: "Ethanol molecule (MD17)", formula: "C2H6O", class: "Small organic molecule (gas phase)", wikidata: Q153}
  naphthalene: {label: "Naphthalene molecule (MD17)", formula: "C10H8", class: "Small organic molecule (gas phase)", wikidata: Q179724}
  salicylic-acid: {label: "Salicylic acid molecule (MD17)", formula: "C7H6O3", class: "Small organic molecule (gas phase)", wikidata: Q193572}
  inorganic: {label: "Inorganic materials of the Materials Project and Alexandria databases", class: "Inorganic crystalline materials"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, comment: "MPtrj and Alexandria: PBE with Hubbard U corrections for transition-metal oxides, no dispersion correction, VASP (Sec. 2.3.3); D3 added for the Orb-D3 training data (Sec. 2.4)."}
datasets:
  mptrj-alex: {label: "MPtrj combined with Alexandria (PBE geometry-optimisation trajectories)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published, calc: pbe, comment: "Fine-tuning data of the universal Orb models; sizes not stated in the paper. Pretraining used a curated set of ground-state structures from several sources regardless of functional (Sec. 2.3.3)."}
  mptrj: {label: "MPtrj (Materials Project trajectory data set)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published, calc: pbe}
  mptrj-alex-d3: {label: "MPtrj and Alexandria with D3 dispersion corrections added", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Augmented, calc: pbe}
  md17-aspirin: {label: "MD17-10k aspirin training data", materials: [aspirin], properties: [Energy, Forces], provenance: Published, comment: "MD17-10k protocol of Fu et al. (Ref. [33])."}
  md17-ethanol: {label: "MD17-10k ethanol training data", materials: [ethanol], properties: [Energy, Forces], provenance: Published}
  md17-naphthalene: {label: "MD17-10k naphthalene training data", materials: [naphthalene], properties: [Energy, Forces], provenance: Published}
  md17-salicylic-acid: {label: "MD17-10k salicylic acid training data", materials: [salicylic-acid], properties: [Energy, Forces], provenance: Published}
methods:
  ORB:
    hp: [cutoffRadius, learningRate, numEpochs, batchSize]
    loss: "Weighted sum of the energy error (per atom, relative to a linear stoichiometric reference), force MAE and stress MAE; preceded by a denoising-diffusion (epsilon prediction) pretraining objective"
    algorithm: "Adam (beta1 0.9, beta2 0.999) with cosine-annealing schedule and exponential moving average of weights"
    impl: {lib: {local: "orb-models", comment: "PyTorch, Apache 2.0, https://github.com/orbital-materials/orb-models"}}
    sims: [MolecularDynamics, GeometryOptimization, MonteCarlo]
runs:
  orb-v2: {label: "Orb universal model trained on MPtrj and Alexandria", method: ORB, dataset: mptrj-alex, settings: {cutoffRadius: {v: 10, loc: "App. 6.2"}, learningRate: {v: 0.0003, loc: "App. 6.2"}, numEpochs: {v: 200, loc: "App. 6.2 (pretraining maximum)"}, batchSize: {v: 240, loc: "App. 6.2 (average per GPU, dynamic)"}}, model: "Orb (MPtraj + Alexandria)", trainingHardware: "8 NVIDIA A100 GPUs for diffusion pretraining; fine-tuning on a single A100"}
  orb-mptrj: {label: "Orb trained on MPtrj only", method: ORB, dataset: mptrj, registry: ORB-MPtrj, trainingHardware: "8 NVIDIA A100 GPUs for diffusion pretraining; fine-tuning on a single A100"}
  orb-d3: {label: "Orb-D3 trained on D3-corrected MPtrj and Alexandria", method: ORB, dataset: mptrj-alex-d3, model: "Orb-D3"}
  orb-aspirin: {label: "Orb fine-tuned on MD17-10k aspirin", method: ORB, dataset: md17-aspirin, model: "Orb fine-tuned for aspirin", base_model: {label: "Orb (variant not stated)", relation: fine-tuned, location: "Sec. 3.4"}}
  orb-ethanol: {label: "Orb fine-tuned on MD17-10k ethanol", method: ORB, dataset: md17-ethanol, model: "Orb fine-tuned for ethanol", base_model: {label: "Orb (variant not stated)", relation: fine-tuned, location: "Sec. 3.4"}}
  orb-naphthalene: {label: "Orb fine-tuned on MD17-10k naphthalene", method: ORB, dataset: md17-naphthalene, model: "Orb fine-tuned for naphthalene", base_model: {label: "Orb (variant not stated)", relation: fine-tuned, location: "Sec. 3.4"}}
  orb-salicylic-acid: {label: "Orb fine-tuned on MD17-10k salicylic acid", method: ORB, dataset: md17-salicylic-acid, model: "Orb fine-tuned for salicylic acid", base_model: {label: "Orb (variant not stated)", relation: fine-tuned, location: "Sec. 3.4"}}
results:
