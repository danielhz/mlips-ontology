  - {key: orb-v2-matbench-noproto, model: orb-v2, material: wbm, role: external, eval_data: {label: "Matbench Discovery WBM test set (Alexandria training data without protostructure overlap)"}, comment: "Orb retrained without Alexandria entries whose protostructures overlap the WBM test set (Table 1, last row).", metrics: [[MAE, Energy, 0.029, null, "Matbench Discovery MAE of the energy above hull (eV/atom): Orb, no protostructure overlap", "Table 1"], [R2, Energy, 0.823, null, "Matbench Discovery R2 of the energy above hull: Orb, no protostructure overlap", "Table 1"]]}
  - {key: orb-mptrj-matbench, model: orb-mptrj, material: wbm, role: external, eval_data: {label: "Matbench Discovery WBM test set"}, metrics: [[MAE, Energy, 0.045, null, "Matbench Discovery MAE of the energy above hull (eV/atom): Orb (MPtrj only)", "Table 1"], [R2, Energy, 0.756, null, "Matbench Discovery R2 of the energy above hull: Orb (MPtrj only)", "Table 1"]]}
