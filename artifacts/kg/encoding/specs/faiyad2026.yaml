study_label: "Faiyad and Martini (2026): UMA small and medium for 25 dopants in MoS2, formation-energy benchmark against DFT and heating-cooling MD"
scope: |
  Encoding scope: the pretrained UMA small (uma-sm-1p1) and UMA medium
  (uma-m-1p1), OMat task, evaluated on neutral formation energies of 25
  dopants at three sites in 48-atom MoS2 cells against fixed-cell
  Quantum ESPRESSO PBE relaxations (Zhang-Northrup formalism), and UMA
  small in ~3,100-atom heating-cooling MD. Formation-energy MAEs are
  encoded as energy MAEs on external evaluation data, as in earlier
  papers; nearest-neighbour distance errors, densities and mobilities are
  properties.
materials:
  mos2: {label: "Bulk MoS2 with one of 25 dopants (Ag, Al, Au, C, Cl, Cu, F, Fe, Ir, Li, N, Na, Nb, O, Pd, Pt, Re, Rh, Ru, Si, Ta, Te, Ti, V, Zn) at S-substitution, Mo-substitution or intercalated sites", formula: "MoS2", class: "Transition-metal dichalcogenides"}
reference:
  qe: {type: DFT, code: QuantumESPRESSO, xc: PBE, comment: "PSLibrary 1.0.0 PAW/USPP, spin-polarized, no SOC, 124/843 Ry, Fermi-Dirac smearing, fixed-cell BFGS to 5e-3 eV/A (Methods)."}
methods:
  UMA:
    sims: [GeometryOptimization, MolecularDynamics]
runs:
