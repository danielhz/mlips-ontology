  - {key: c2-ens-test, model: c2-ens, material: organics, role: test, eval_data: {label: "Held-out test set of 13.6M molecules", location: "Table 4"}, metrics: [[RMSE, Energy, 2.817, kcal/mol, "test energy RMSE on organics: AIMNet2 cycle 2 (ensemble selection)", "Table 4"]]}
gaps:
