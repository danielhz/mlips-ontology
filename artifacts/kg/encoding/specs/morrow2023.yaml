scope: |
  Encoding scope: none beyond the study record. This is a tutorial review
  of numerical, physically guided and experimental validation of MLIPs;
  it trains no new models. Its illustrations evaluate the published GAP-17
  carbon potential (deringer2017) on subsets of its own reference
  database, with errors shown only in figures (Figs. 4 and later).
