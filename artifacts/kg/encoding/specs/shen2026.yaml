id: shen2026
source:
  rank: 371
  year: "2026"
  first_author: "Yulin Shen"
  title: "Non-covalent Interactions at cm$^{-1}$ Accuracy: Data Efficient Physics-Informed Distillation for Machine Learning Interatomic Potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2606.05127"
  kg_relevance: "Training/reliability"
  arxiv_id: "2606.05127v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "e03375bc8e9eb5eafc8348df44bd7454d01298d1d4e02f6993bc845d4a65f1df"
study_label: "Shen et al. (2026): teacher-guided distillation from universal MLIPs and CCSD(T) fine-tuning of SAPT-informed SOG-Net students for He-benzene and He-PAH interactions"
scope: |
  Encoding scope: He-benzene student models (SOG-Net-type short-range
  MLP plus sum-of-Gaussians long-range block; fixed cutoff or
  SAPT-informed adaptive cutoff) distilled from 18 universal-MLIP
  teachers on 2,400 teacher-labelled configurations and then fine-tuned
  on CCSD(T)/CBS data (Table S2: distilled MAE, RMSE and maximum error,
  and MAE after fine-tuning); the DFT-labelled student (Table I); the
  DeePMD and fixed-cutoff baselines (Table S1); the data-efficiency means
  stated in Sec. IV A; the He-PAH fixed-cutoff models distilled from Orb
  or MatterSim and fine-tuned on PBE0-D4 (Sec. IV B); and the CPU timing
  of the Orb teacher and the student. Errors are in cm-1 (or cm-1/atom),
  which the schema lacks, so all are recorded with unit null.
materials:
  hebz: {label: "He-benzene van der Waals complex (perturbed configurations)", class: "Molecular dimers and noncovalent complexes"}
  hepah: {label: "He on coronene, circumcoronene, circumcircumcoronene and circumcircumcircumcoronene", class: "Molecular dimers and noncovalent complexes"}
reference:
  ccsdt: {type: WF, wf: CCSDT, basis: "CBS", comment: "CCSD(T)/CBS He-benzene interaction energies and SAPT decompositions from Akram et al. (2026), SI Ref. [1]."}
  pbe0d4: {type: DFT, xc: PBE0, basis: "def2-SVP", comment: "PBE0-D4/def2-SVP interaction energies for the He-PAH series (SI Sec. I)."}
datasets:
  teach: {label: "2,400 perturbed He-benzene configurations labelled by a teacher MLIP (energies only; one label set per teacher)", materials: [hebz], properties: [Energy], provenance: InHouse}
  teach-dft: {label: "He-benzene configurations labelled with DFT (the Table I DFT route; level of theory not stated in the main text)", materials: [hebz], properties: [Energy], provenance: InHouse}
  cc50: {label: "He-benzene CCSD(T)/CBS data (2,400 configurations), 50 % used for fine-tuning", materials: [hebz], properties: [Energy], provenance: Published, n: {v: 2400, loc: "Fig. 3 caption (whole set)"}, calc: ccsdt}
  cc80: {label: "He-benzene CCSD(T)/CBS training pool (80 %; fractions of it used in Fig. 4)", materials: [hebz], properties: [Energy], provenance: Published, calc: ccsdt}
  pah: {label: "He-PAH PBE0-D4/def2-SVP interaction energies for the four PAHs combined", materials: [hepah], properties: [Energy], provenance: InHouse, calc: pbe0d4}
methods:
  SOG-Net:
    hp: [cutoffRadius, learningRate, batchSize, numEpochs]
    loss: "MSE on binding energies plus a force term (prefactor 0.005) when forces exist; cutoff-variance and centre-alignment regularisers for the adaptive cutoff"
    algorithm: "AdamW, weight decay 1e-4, step scheduler (8,000 steps, factor 0.5)"
  DeePMD:
    hp: [cutoffRadius]
    impl: {lib: DeePMDkit}
runs:
  dpmd: {label: "DeePMD se_e2_a baseline fitted directly to He-benzene CCSD(T) binding energies", method: DeePMD, dataset: cc50, settings: {cutoffRadius: {v: 8.0, loc: "SI Sec. II.1"}}, model: "He-benzene DeePMD baseline"}
  fixed-ft: {label: "Fixed-cutoff SR/LR student (SOG-Net; Orb-distilled) fine-tuned on 50 % CCSD(T)", method: SOG-Net, dataset: cc50, settings: {cutoffRadius: {v: 8.0, loc: "SI Sec. II.2 (outer shell)"}, learningRate: {v: 1.0e-4, loc: "SI Sec. II.2"}, batchSize: {v: 64, loc: "SI Sec. II.2"}, numEpochs: {v: 10000, loc: "SI Sec. II.2"}}, model: "He-benzene fixed-cutoff SR/LR (Orb teacher, CCSD(T) fine-tuned)", base_model: {run: dist-orb, relation: fine-tuned, location: "Sec. III"}}
  dft-student: {label: "SAPT-informed SR/LR student trained on DFT labels (Table I 'DFT' route), before CCSD(T) fine-tuning", method: SOG-Net, dataset: teach-dft, model: "He-benzene SAPT SR/LR student (DFT labels)"}
  dist-orb: {label: "SAPT-informed SR/LR student (SOG-Net, adaptive cutoff) distilled from Orb-v3-OMol", method: SOG-Net, dataset: teach, model: "He-benzene SAPT SR/LR student distilled from Orb-v3-OMol", base_model: {label: "Orb-v3-OMol", relation: distilled, location: "Table S2"}}
  ft-orb: {label: "Orb-v3-OMol-distilled SAPT-informed SR/LR student fine-tuned on 50 % CCSD(T)", method: SOG-Net, dataset: cc50, model: "He-benzene SAPT SR/LR student (Orb-v3-OMol teacher, CCSD(T) fine-tuned)", base_model: {run: dist-orb, relation: fine-tuned, location: "Table S2"}}
