id: kavanagh2026
source:
  rank: 690
  year: "2026"
  first_author: "Seán R. Kavanagh"
  title: "Fast and Accurate Equivariant Foundation Models for Atomistic Simulation"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2607.28461"
  kg_relevance: "Method/model"
  arxiv_id: "2607.28461v2"
  pdf_version: "arxiv-preprint"
