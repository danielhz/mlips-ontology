id: vita2023
source:
  rank: 285
  year: "2023"
  first_author: "Joshua A. Vita"
  title: "Data efficiency and extrapolation trends in neural network interatomic potentials"
  venue: "Machine Learning Science and Technology"
  doi: "10.1088/2632-2153/acf115"
  kg_relevance: "Application/model instance"
  arxiv_id: "2302.05823v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "69892ce31c7f6dc9adabd479f7e6044ec483f8498185442f65e380b742b6ed04"
study_label: "Vita and Schwalbe-Koda (2023): data efficiency, extrapolation and loss-landscape entropy of NequIP and MACE on 3BPA"
scope: |
  Encoding scope: NequIP and MACE models with different architectures and
  optimiser choices (Tables S1, S4) trained on 25, 125, 250 or 500 3BPA
  configurations at 300 K, with their test energy and force RMSEs on the
  300, 600 and 1200 K splits (Tables S3, S6). Loss-landscape entropies and
  MD times to failure (Tables S2, S5), the noise study (Fig. 1a) and the
  ANI-Al experiments are not encoded.
materials:
  bpa: {label: "3-(benzyloxy)pyridin-2-amine (3BPA) molecule", formula: "C12H12N2O", class: "Flexible drug-like organic molecule (gas phase)"}
datasets:
  bpa25: {label: "3BPA training subset of 25 configurations sampled at 300 K", materials: [bpa], properties: [Energy, Forces], provenance: Published, n: {v: 25, loc: "Tables S3, S6"}}
  bpa125: {label: "3BPA training subset of 125 configurations sampled at 300 K", materials: [bpa], properties: [Energy, Forces], provenance: Published, n: {v: 125, loc: "Tables S3, S6"}}
  bpa250: {label: "3BPA training subset of 250 configurations sampled at 300 K", materials: [bpa], properties: [Energy, Forces], provenance: Published, n: {v: 250, loc: "Tables S3, S6"}}
  bpa500: {label: "3BPA training subset of 500 configurations sampled at 300 K", materials: [bpa], properties: [Energy, Forces], provenance: Published, n: {v: 500, loc: "Tables S3, S6"}}
methods:
  NequIP:
    hp: [numLayers, cutoffRadius, learningRate]
    loss: "Energy:force weight 1:1000"
    algorithm: "Adam (optionally AMSGrad, EMA), ReduceLROnPlateau (patience 50, factor 0.5)"
    impl: {lib: NequIP, comment: "NequIP 0.5.5"}
    sims: [MolecularDynamics]
  MACE:
    hp: [bodyOrder, cutoffRadius, learningRate]
    loss: "Energy:force weight 1:1000"
    algorithm: "Adam (optionally AMSGrad, EMA, SWA with weight changes), ReduceLROnPlateau (patience 50, factor 0.8)"
    impl: {lib: MACE, comment: "MACE 0.1.0"}
    sims: [MolecularDynamics]
runs:
  nq-2-layer-baseline-25: {label: "NequIP \"2-layer, baseline\" trained on 25 3BPA configurations", method: NequIP, dataset: bpa25, settings: {numLayers: {v: 2, loc: "Table S1"}, cutoffRadius: {v: 5.0, loc: "App. A"}, learningRate: {v: 0.005, loc: "App. A"}}, model: "NequIP 2-layer, baseline, N = 25"}
  nq-2-layer-baseline-125: {label: "NequIP \"2-layer, baseline\" trained on 125 3BPA configurations", method: NequIP, dataset: bpa125, settings: {numLayers: {v: 2, loc: "Table S1"}, cutoffRadius: {v: 5.0, loc: "App. A"}, learningRate: {v: 0.005, loc: "App. A"}}, model: "NequIP 2-layer, baseline, N = 125"}
