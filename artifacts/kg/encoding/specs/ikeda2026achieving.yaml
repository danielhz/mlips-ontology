id: ikeda2026achieving
source:
  rank: 340
  year: "2026"
  first_author: "Yuji Ikeda"
  title: "Machine-Learning Interatomic Potentials Achieving CCSD(T) Accuracy for Systems with Extended Covalent Networks and van der Waals Interactions"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.5c02045"
  kg_relevance: "Method/model"
  arxiv_id: "2508.14306v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "aa9eef4dbacbd757d0a1e505432a31b34b1d0b727811a200e91776519fe08c17"
study_label: "Ikeda et al. (2026): Delta-learned MTPs on a GFN2-xTB baseline reaching PNO-LCCSD(T)-F12 accuracy for an extended covalent organic framework"
scope: |
  Encoding scope: the PNO-LCCSD(T)-F12 reference on hydrogen-terminated
  COF fragments and their vdW multimers (Table I), the four Delta-MTP
  training sets #2-#5 (up to 2-5 benzene rings) at MTP levels 8, 12, 16
  and 20 (cutoff 7 A), and the per-atom energy RMSEs of Table II on the
  training, validation and test sets. The MTP is fitted to the difference
  between PNO-LCCSD(T)-F12 and GFN2-xTB energies; the errors are those of
  TB+Delta-MTP against the CCSD(T)-level reference. Atomization energies,
  bond lengths, vibrational frequencies and COF properties are properties.
materials:
  frag: {label: "Hydrogen-terminated fragments of the C48H30 covalent organic framework (benzene to benzerythrene, H2) and their vdW-bound dimers, trimers and tetramers", class: "Organic molecules (gas phase)"}
reference:
  ccsdt: {type: WF, wf: CCSDT, basis: "heavy-aug-cc-pVTZ", comment: "PNO-LCCSD(T)-F12 (F12b, 3*A ansatz, density fitting, no counterpoise correction) in MOLPRO 2024.1 on GFN2-xTB MD snapshots (Sec. II A); the MTP learns the difference to GFN2-xTB (tblite)."}
datasets:
  train2: {label: "Training set #2: master training configurations with up to 2 benzene rings", materials: [frag], properties: [Energy], provenance: InHouse, n: {v: 747, loc: "Fig. 2(a)"}, calc: ccsdt}
  train3: {label: "Training set #3: master training configurations with up to 3 benzene rings", materials: [frag], properties: [Energy], provenance: InHouse, n: {v: 1125, loc: "Fig. 2(a)"}, calc: ccsdt}
  train4: {label: "Training set #4: master training configurations with up to 4 benzene rings", materials: [frag], properties: [Energy], provenance: InHouse, n: {v: 1602, loc: "Fig. 2(a)"}, calc: ccsdt}
  train5: {label: "Training set #5: master training configurations with up to 5 benzene rings", materials: [frag], properties: [Energy], provenance: InHouse, n: {v: 1872, loc: "Fig. 2(a)"}, calc: ccsdt}
methods:
  MTP:
    hp: [cutoffRadius, momentLevel]
    loss: "Energy per atom averaged over the training configurations (Delta-learning target E(PNO-LCCSD(T)-F12) - E(GFN2-xTB))"
    algorithm: "BFGS (SciPy), at most 1,000 iterations; free-atom energies fixed to the quantum-chemical values"
    sims: [GeometryOptimization, MolecularDynamics]
  ANI: {}
runs:
  dmtp2-l8: {label: "Delta-MTP #2 at MTP level 8 (GFN2-xTB baseline)", method: MTP, dataset: train2, settings: {cutoffRadius: {v: 7, loc: "Sec. II B 1"}, momentLevel: {v: 8, loc: "Table II"}}, model: "TB+Delta-MTP#2 level 8"}
  dmtp2-l12: {label: "Delta-MTP #2 at MTP level 12 (GFN2-xTB baseline)", method: MTP, dataset: train2, settings: {cutoffRadius: {v: 7, loc: "Sec. II B 1"}, momentLevel: {v: 12, loc: "Table II"}}, model: "TB+Delta-MTP#2 level 12"}
