  - {key: um1, model: um1, material: mos2wse2, role: null, eval_data: {label: "DFT ground truth (evaluation set not specified)", location: "Results (Fig. 3)"}, metrics: [[RMSE, Energy, 11.6, meV/atom, "energy RMSE vs DFT: unified Allegro UM1", "Results"]]}
  - {key: um2, model: um2, material: mos2wse2, role: null, eval_data: {label: "DFT ground truth (evaluation set not specified)", location: "Results (Fig. 3)"}, metrics: [[RMSE, Energy, 10.6, meV/atom, "energy RMSE vs DFT: unified Allegro UM2", "Results"]]}
