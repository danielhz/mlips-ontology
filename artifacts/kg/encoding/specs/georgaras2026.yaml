study_label: "Georgaras et al. (2026): split intralayer/interlayer MLIPs and the mean disregistry error for relaxing moire layered materials"
scope: |
  Encoding scope: the split MLIP approach for MoS2/WSe2 bilayers: Allegro
  intralayer models for MoS2 and WSe2 (cutoff 6 A) trained on randomly
  perturbed 3x3 monolayer supercells and an Allegro interlayer model
  (cutoff 10 A) trained on stacking/separation scans, plus unified Allegro
  models UM1 (6 A) and UM2 (10 A) trained on the union, with the RMSEs
  stated in the text; Quantum ESPRESSO vdW-DF-C09 references. Test-set
  comparisons with classical SW and KC potentials (Fig. 2), the MDE
  metric, corruption analyses and HfS2/GaS relaxations are figure-only
  or properties.
materials:
  mos2wse2: {label: "MoS2 and WSe2 monolayers and MoS2/WSe2 bilayers (0 and 60 degree stackings)", class: "2D lateral heterostructure"}
reference:
  c09: {type: DFT, code: QuantumESPRESSO, xc: {local: vdW-DF-C09}, pp: NormConserving, kpoints: "12x12x1 (primitive and interlayer cells), 4x4x1 (3x3 supercells)", comment: "QE 7.2, 60 Ry, PseudoDojo scalar-relativistic pseudopotentials, SCF 1e-8 Ry (Methods)."}
sampling:
  perturb: {label: "1,000 random perturbations of atomic positions and cell parameters of 3x3 monolayer supercells"}
  scan: {label: "Interlayer separations (0.1 A steps from l0 to 2 l0, 0.5 A to 3 l0) times 12x12 in-plane registries; a 6x6 subgrid held out as test set"}
datasets:
  intra-mos2: {label: "MoS2 intralayer data (1,000 perturbed 3x3 supercells; random train/validation/test split)", materials: [mos2wse2], properties: [Energy, Forces], provenance: InHouse, n: {v: 1000, loc: "Methods"}, calc: c09, sampling: [perturb]}
  intra-wse2: {label: "WSe2 intralayer data (1,000 perturbed 3x3 supercells; random split)", materials: [mos2wse2], properties: [Energy, Forces], provenance: InHouse, n: {v: 1000, loc: "Methods"}, calc: c09, sampling: [perturb]}
  inter: {label: "MoS2/WSe2 interlayer data (intralayer contributions subtracted; 6x6 registry test grid held out)", materials: [mos2wse2], properties: [Energy, Forces], provenance: InHouse, n: {v: 4000, loc: "Methods"}, calc: c09, sampling: [scan]}
  union: {label: "Union of the intralayer and interlayer data sets (unified models)", materials: [mos2wse2], properties: [Energy, Forces], provenance: Augmented, calc: c09, sampling: [perturb, scan]}
methods:
  Allegro:
    hp: [cutoffRadius]
    impl: {lib: Allegro}
    sims: [GeometryOptimization]
runs:
  intra-mos2: {label: "Split intralayer Allegro for MoS2", method: Allegro, dataset: intra-mos2, settings: {cutoffRadius: {v: 6.0, loc: "Results"}}, model: "MoS2 intralayer Allegro"}
  intra-wse2: {label: "Split intralayer Allegro for WSe2", method: Allegro, dataset: intra-wse2, settings: {cutoffRadius: {v: 6.0, loc: "Results"}}, model: "WSe2 intralayer Allegro"}
  inter: {label: "Split interlayer Allegro for MoS2/WSe2 (trained at 0 degree twist)", method: Allegro, dataset: inter, settings: {cutoffRadius: {v: 10.0, loc: "Results"}}, model: "MoS2/WSe2 interlayer Allegro"}
  um1: {label: "Unified Allegro UM1 (cutoff 6 A) on the union data set", method: Allegro, dataset: union, settings: {cutoffRadius: {v: 6.0, loc: "Results (Fig. 3)"}}, model: "MoS2/WSe2 unified Allegro UM1"}
  um2: {label: "Unified Allegro UM2 (cutoff 10 A) on the union data set", method: Allegro, dataset: union, settings: {cutoffRadius: {v: 10.0, loc: "Results (Fig. 3)"}}, model: "MoS2/WSe2 unified Allegro UM2"}
