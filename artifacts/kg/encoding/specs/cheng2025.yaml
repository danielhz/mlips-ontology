results:
  - {key: sr-CC, model: sr-CC, material: CC, role: test, eval_data: {label: "CC dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 372.4, meV, "Test RMSE on binding energy: short-range CACE, CC dimer", "Fig. 1 inset"], [RMSE, Force, 49.0, meV/A, "Test RMSE on force components: short-range CACE, CC dimer", "Fig. 1 inset"]]}
  - {key: lr-CC, model: lr-CC, material: CC, role: test, eval_data: {label: "CC dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 15.5, meV, "Test RMSE on binding energy: CACE-LES, CC dimer", "Fig. 1 inset"], [RMSE, Force, 5.9, meV/A, "Test RMSE on force components: CACE-LES, CC dimer", "Fig. 1 inset"]]}
  - {key: sr-CP, model: sr-CP, material: CP, role: test, eval_data: {label: "CP dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 81.5, meV, "Test RMSE on binding energy: short-range CACE, CP dimer", "Fig. 1 inset"], [RMSE, Force, 52.3, meV/A, "Test RMSE on force components: short-range CACE, CP dimer", "Fig. 1 inset"]]}
  - {key: lr-CP, model: lr-CP, material: CP, role: test, eval_data: {label: "CP dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 6.7, meV, "Test RMSE on binding energy: CACE-LES, CP dimer", "Fig. 1 inset"], [RMSE, Force, 16.5, meV/A, "Test RMSE on force components: CACE-LES, CP dimer", "Fig. 1 inset"]]}
  - {key: sr-PP, model: sr-PP, material: PP, role: test, eval_data: {label: "PP dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 14.9, meV, "Test RMSE on binding energy: short-range CACE, PP dimer", "Fig. 1 inset"], [RMSE, Force, 8.8, meV/A, "Test RMSE on force components: short-range CACE, PP dimer", "Fig. 1 inset"]]}
  - {key: lr-PP, model: lr-PP, material: PP, role: test, eval_data: {label: "PP dimer test configurations at 12-15 A separation"}, metrics: [[RMSE, Energy, 3.7, meV, "Test RMSE on binding energy: CACE-LES, PP dimer", "Fig. 1 inset"], [RMSE, Force, 3.0, meV/A, "Test RMSE on force components: CACE-LES, PP dimer", "Fig. 1 inset"]]}
resources: |
  MD timings of the short- and long-range water models on one NVIDIA L40S
  GPU (48 GB) are shown only in Fig. 8: LR models run at roughly half the
  speed of SR models and fit about 10,000 atoms on the GPU (SR about
  30,000). No per-atom number is given.
gaps:
  - "Introduces LES and combines it with CACE: 'In the present work, we combine LES with Cartesian atomic cluster expansion (CACE) MLIP' (Introduction). Recorded in the registry as CACE-LES derived from CACE. LES is described as applicable to other MLIPs (HDNNP, GAP, MTP, ACE, NequIP, MACE); only the CACE combination is used here."
  - "The NaCl errors are root-mean-square percentage errors (CACE-LR T=0: 1.9% energy, 2.3% force; T=1: 1.4%, 1.8%; Table I), which the metric types of the schema do not cover; they are not encoded."
  - "The bulk-water and interface errors appear only as learning curves (Figs. 2, 5, 7); those models have no result. The text says force MAEs of about 14 to 27 meV/A on the interface data at 90% training."
  - "For the water models the text says 'no message passing (T = 0) or no message passing layer (T = 1)'; T = 1 is read as one message-passing layer, as in the rest of the paper. The interface models use 'the same settings' as bulk water, so the water settings are repeated there."
  - "The dimer molecules are not named beyond their class (charged or polar); energy errors are on binding energies in meV per dimer."
  - "The DFT code and numerical settings of the three data sets are not given in this paper; the NaCl data set's level of theory is not stated."
