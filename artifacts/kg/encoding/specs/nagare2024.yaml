id: nagare2024
source:
  rank: 244
  year: "2024"
  first_author: "Balasaheb J. Nagare"
  title: "Machine-Learned Potential Energy Surfaces for Free Sodium Clusters with Density Functional Accuracy: Applications to Melting"
  venue: "Physica Scripta"
  doi: "10.1088/1402-4896/ad37ab"
  kg_relevance: "Application/model instance"
  arxiv_id: "2309.08937v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "f3f88ce7f42a284789129e74c4c0c91c91ddb46ffcd5585d3d7c18e92d8786f0"
study_label: "Nagare, Chacko and Kanhere (2024): GAP potentials for free sodium clusters and their melting"
scope: |
  Encoding scope: the two GAP models (M1 trained on Na55 only, M2 adding
  configurations of 40- to 200-atom clusters) with their validation errors
  (Sec. 2.3, Table 3). Heat capacities, melting temperatures and isomer
  energies/bond lengths (Table 4) are not encoded; the Table 2 maximum
  percentage errors are not accuracy metrics of the schema.
materials:
  Na55: {label: "Free Na55 cluster", formula: "Na55", class: "Metal cluster"}
  Na70: {label: "Free Na70 cluster", formula: "Na70", class: "Metal cluster"}
  Na80: {label: "Free Na80 cluster", formula: "Na80", class: "Metal cluster"}
  Na90: {label: "Free Na90 cluster", formula: "Na90", class: "Metal cluster"}
  Na92: {label: "Free Na92 cluster", formula: "Na92", class: "Metal cluster"}
  Na116: {label: "Free Na116 cluster", formula: "Na116", class: "Metal cluster"}
  Na138: {label: "Free Na138 cluster", formula: "Na138", class: "Metal cluster"}
  Na147: {label: "Free Na147 cluster", formula: "Na147", class: "Metal cluster"}
  Na178: {label: "Free Na178 cluster", formula: "Na178", class: "Metal cluster"}
  Na200: {label: "Free Na200 cluster", formula: "Na200", class: "Metal cluster"}
  Na-clusters: {label: "Free sodium clusters of 40 to 200 atoms", formula: "Na", class: "Metal clusters"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 102, comment: "Force-consistent energies with entropy; SCF tolerance 1e-5 eV; Born-Oppenheimer MD at 50-400 K for data generation."}
sampling:
  bomd: {label: "Born-Oppenheimer MD from solid-like to liquid-like temperatures; configurations selected uniformly over the energy range and refined iteratively at large force errors", comment: "About 100,000 Na55 configurations, deduplicated to about 22,000; 20-50 configurations per larger size for M2."}
datasets:
  m1: {label: "Na55 training set of model M1 (1,945 configurations)", materials: [Na55], properties: [Energy, Forces], provenance: InHouse, n: {v: 1945, loc: "Table 2"}, calc: pbe, sampling: [bomd]}
  m2: {label: "Multi-size training set of model M2 (1,213 configurations of Na40-Na200)", materials: [Na-clusters], properties: [Energy, Forces], provenance: InHouse, n: {v: 1213, loc: "Sec. 2.3"}, calc: pbe, sampling: [bomd]}
methods:
  GAP:
    hp: [cutoffRadius, numSparseConfigs]
    loss: "Energies and forces (no virials for free clusters)"
    algorithm: "Sparse Gaussian process regression with 2-body, 3-body and SOAP kernels"
    impl: {lib: QUIP}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  m1: {label: "GAP model M1 (Na55 data only; M1-3)", method: GAP, dataset: m1, settings: {cutoffRadius: {v: 12.9, loc: "Table 1 (SOAP)"}, numSparseConfigs: {v: 6000, loc: "Table 1 (SOAP)"}}, model: "GAP sodium-cluster model M1", trainingHardware: "About 180 GB of memory across nodes"}
  m2: {label: "GAP model M2 (Na55 plus 40- to 200-atom clusters)", method: GAP, dataset: m2, settings: {cutoffRadius: {v: 12.9, loc: "Table 1 (SOAP)"}, numSparseConfigs: {v: 6000, loc: "Table 1 (SOAP)"}}, model: "GAP sodium-cluster model M2", trainingHardware: "More than 650 GB of memory"}
results:
