gaps:
  - "Table 3's caption gives energies in meV/atom; its Na70-Na200 configurations are validation sets for both models. The 2-body (12.9 A) and 3-body (3.5 A) descriptor cutoffs and sparsifications (20, 100 points) are not encoded; the SOAP values are."
  - "Isomer energies after DFT re-optimisation (MAE about 7 meV/atom or less) are per-isomer comparisons in Table 4 and are not encoded."
