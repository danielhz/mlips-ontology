  - {key: m1-na70, model: m1, material: Na70, role: validation, eval_data: {label: "Na70 validation configurations (2,541)"}, metrics: [[MAE, Energy, 24.563, meV/atom, "Validation energy MAE: GAP M1, Na70", "Table 3"], [RMSE, Energy, 24.614, meV/atom, "Validation energy RMSE: GAP M1, Na70", "Table 3"]]}
  - {key: m2-na70, model: m2, material: Na70, role: validation, eval_data: {label: "Na70 validation configurations (2,541)"}, metrics: [[MAE, Energy, 0.828, meV/atom, "Validation energy MAE: GAP M2, Na70", "Table 3"], [RMSE, Energy, 1.062, meV/atom, "Validation energy RMSE: GAP M2, Na70", "Table 3"]]}
