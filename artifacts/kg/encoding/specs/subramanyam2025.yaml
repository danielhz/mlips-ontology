  ace2-os: {label: "ACE-2 for Os trained on Rev-EM", method: ACE, dataset: rev-os, settings: {cutoffRadius: {v: 6.0, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-os"}
