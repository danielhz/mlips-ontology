id: subramanyam2025
source:
  rank: 398
  year: "2025"
  first_author: "Aparna P. A. Subramanyam"
  title: "Information-entropy-driven generation of material-agnostic datasets for machine-learning interatomic potentials"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-025-01602-9"
  kg_relevance: "Application/model instance"
  arxiv_id: "2407.10361v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "f9f10bd4498e56c267efbbdcab3a76778006591c4dd9664ae7f75ec0becb178c"
study_label: "Subramanyam and Perez (2025): information-entropy-maximised, material-agnostic Rev-EM data sets and ACE potentials for eight elements"
scope: |
  Encoding scope: the Rev-EM data sets (entropy-maximised bispectrum
  distributions, rescaled per element; VASP GGA single points for Be, C,
  Al, W, Re and Os; Table 8 train/test splits), the pacemaker ACE models
  (ACE-2 for all eight elements; ACE-1, ACE-2 and ACE-3 reweighting
  variants for W) with their train and test RMSEs (Tables 3 and 4), the
  ACE-2 tests on literature data sets (Tables 1 and 4, Owen-W MAEs), and
  the cross-validation of literature MLIPs for Al, W and C on each
  other's data sets and on Rev-EM (Tables 6 and 7). Elastic constants,
  defect and surface energies are properties.
materials:
  be: {label: "Elemental Be: Rev-EM entropy-maximised configurations and literature data sets", formula: "Be", class: "Metals"}
  c: {label: "Elemental C: Rev-EM entropy-maximised configurations and literature data sets", formula: "C", class: "Elemental solid and liquid carbon"}
  al: {label: "Elemental Al: Rev-EM entropy-maximised configurations and literature data sets", formula: "Al", class: "Metals"}
  sb: {label: "Elemental Sb: Rev-EM entropy-maximised configurations and literature data sets", formula: "Sb", class: "Elemental semiconductor"}
  te: {label: "Elemental Te: Rev-EM entropy-maximised configurations and literature data sets", formula: "Te", class: "Elemental semiconductor"}
  w: {label: "Elemental W: Rev-EM entropy-maximised configurations and literature data sets", formula: "W", class: "Metals"}
  re: {label: "Elemental Re: Rev-EM entropy-maximised configurations and literature data sets", formula: "Re", class: "Metals"}
  os: {label: "Elemental Os: Rev-EM entropy-maximised configurations and literature data sets", formula: "Os", class: "Metals"}
reference:
  gga: {type: DFT, code: VASP, pp: PAW, cutoff: 700, kpoints: "0.125 1/A spacing", comment: "Non-spin-polarised GGA (functional cited, not named), VASP 6.3.2, Methfessel-Paxton 0.1 eV (Gaussian 0.05 eV for C), EDIFF 1e-6 eV (Sec. 5.4)."}
sampling:
  revem: {label: "Rev-EM: greedy maximisation of the information entropy of bispectrum-component distributions (2Jmax = 8, 55 components) with a core repulsion, uniformly rescaled to each element's equilibrium density (C enriched with low-density configurations)"}
datasets:
  rev-be: {label: "Rev-EM Be training split (7956 configurations)", materials: [be], properties: [Energy, Forces], provenance: InHouse, n: {v: 7956, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-c: {label: "Rev-EM C training split (7023 configurations)", materials: [c], properties: [Energy, Forces], provenance: InHouse, n: {v: 7023, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-al: {label: "Rev-EM Al training split (7893 configurations)", materials: [al], properties: [Energy, Forces], provenance: InHouse, n: {v: 7893, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-sb: {label: "Rev-EM Sb training split (7898 configurations)", materials: [sb], properties: [Energy, Forces], provenance: InHouse, n: {v: 7898, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-te: {label: "Rev-EM Te training split (7922 configurations)", materials: [te], properties: [Energy, Forces], provenance: InHouse, n: {v: 7922, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-w: {label: "Rev-EM W training split (7808 configurations)", materials: [w], properties: [Energy, Forces], provenance: InHouse, n: {v: 7808, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-re: {label: "Rev-EM Re training split (7692 configurations)", materials: [re], properties: [Energy, Forces], provenance: InHouse, n: {v: 7692, loc: "Table 8"}, calc: gga, sampling: [revem]}
  rev-os: {label: "Rev-EM Os training split (7862 configurations)", materials: [os], properties: [Energy, Forces], provenance: InHouse, n: {v: 7862, loc: "Table 8"}, calc: gga, sampling: [revem]}
methods:
  ACE:
    hp: [cutoffRadius, bodyOrder]
    loss: "90 % energy and 10 % force weight; 75 % of the weight on configurations within Delta E of the minimum (2 eV/atom; 3 eV/atom for C; varied for W ACE-1/ACE-3)"
    impl: {lib: PACE, comment: "pacemaker, nonlinear ACE, 1,094 parameters"}
    sims: [MolecularDynamics, GeometryOptimization]
  ANI: {}
  GAP: {}
  NEP: {}
  DeePMD: {}
  SNAP: {}
runs:
  ace2-be: {label: "ACE-2 for Be trained on Rev-EM", method: ACE, dataset: rev-be, settings: {cutoffRadius: {v: 4.5, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-be"}
  ace2-c: {label: "ACE-2 for C trained on Rev-EM", method: ACE, dataset: rev-c, settings: {cutoffRadius: {v: 5.5, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-c"}
  ace2-al: {label: "ACE-2 for Al trained on Rev-EM", method: ACE, dataset: rev-al, settings: {cutoffRadius: {v: 5.5, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-al"}
  ace2-sb: {label: "ACE-2 for Sb trained on Rev-EM", method: ACE, dataset: rev-sb, settings: {cutoffRadius: {v: 6.5, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-sb"}
  ace2-te: {label: "ACE-2 for Te trained on Rev-EM", method: ACE, dataset: rev-te, settings: {cutoffRadius: {v: 7.5, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace2-te"}
