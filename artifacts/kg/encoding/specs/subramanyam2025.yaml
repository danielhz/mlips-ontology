  ace3-w: {label: "ACE-3 for W (reweighting variant: 75 % of weight within 2 eV/atom, force limit 100 eV/A)", method: ACE, dataset: rev-w, settings: {cutoffRadius: {v: 6.0, loc: "Sec. 5.5"}, bodyOrder: {v: 6, loc: "Sec. 5.5"}}, model: "Rev-EM ace3-w"}
