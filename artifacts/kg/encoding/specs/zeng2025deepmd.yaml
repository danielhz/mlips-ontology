id: zeng2025deepmd
source:
  rank: 403
  year: "2025"
  first_author: "Jinzhe Zeng"
  title: "DeePMD-kit v3: A Multiple-Backend Framework for Machine Learning Potentials"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.5c00340"
  kg_relevance: "Software/implementation"
  arxiv_id: "2502.19161v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "fd3eb31855e11fe359119ef2785e0af781bead7c9cdd342a865b031e6c03fc1b"
study_label: "Zeng et al. (2025): DeePMD-kit v3, a multiple-backend (TensorFlow, PyTorch, JAX, PaddlePaddle) framework for machine-learning potentials"
scope: |
  Encoding scope: the software paper's benchmark: water models DPA-1
  without attention (L=0; also compressed), DPA-1 with two attention
  layers (L=2) and DPA-2 (medium), all with 6 A cutoffs and 240-240-240
  fitting nets, timed in LAMMPS MD on water systems of 192 to 98,304
  atoms in FP64 and FP32 with each backend. The H100 timings (Table S1)
  are encoded; the A800 and RTX 4090 tables (S2, S3) are summarised in
  gaps. No accuracy metrics are reported; the training data of the water
  models are not described.
materials:
  water: {label: "Liquid water boxes of 192 to 98,304 atoms (benchmark systems)", formula: "H2O", class: "Molecular liquid"}
methods:
  DeePMD:
    hp: [cutoffRadius, numLayers]
    impl: {lib: DeePMDkit, comment: "DeePMD-kit v3 with TensorFlow, PyTorch and JAX backends"}
    sims: [MolecularDynamics]
  DPA2:
    hp: [cutoffRadius, numLayers]
    impl: {lib: DeePMDkit, comment: "DeePMD-kit v3 (PyTorch and JAX backends)"}
    sims: [MolecularDynamics]
runs:
  dpa1-l0: {label: "DPA-1 water model without attention layers (L=0; se_atten descriptor)", method: DeePMD, settings: {cutoffRadius: {v: 6, loc: "Sec. 4"}}, model: "water DPA-1 (L=0)"}
  dpa1-l0c: {label: "Compressed DPA-1 water model without attention layers (L=0)", method: DeePMD, settings: {cutoffRadius: {v: 6, loc: "Sec. 4"}}, model: "water DPA-1 (L=0), compressed"}
  dpa1-l2: {label: "DPA-1 water model with two attention layers (L=2; hidden vectors 128)", method: DeePMD, settings: {cutoffRadius: {v: 6, loc: "Sec. 4"}, numLayers: {v: 2, loc: "Sec. 4 (attention layers)"}}, model: "water DPA-1 (L=2)"}
  dpa2: {label: "DPA-2 (medium) water model (6 Reperformer layers; 6 A initializer, 4 A Reperformer and three-body cutoffs)", method: DPA2, settings: {cutoffRadius: {v: 6, loc: "Sec. 4"}, numLayers: {v: 6, loc: "Sec. 4 (Reperformer layers)"}}, model: "water DPA-2 (medium)"}
results: []
