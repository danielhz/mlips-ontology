  - {key: mf-dzef-mp2e-insample, model: mf-dzef-mp2e, material: organics, role: test, eval_data: {label: "In-sample held-out 10% of the ANI-1x/ANI-1ccx subset, MP2/TZ labels", location: "Sec. 2.2.2"}, metrics: [[RMSE, Energy, 1.72, kcal/mol, "in-sample test MP2/TZ energy RMSE: HIP-NN MF-DZ/EF-MP2/E (mean of 8 models)", "Table 3"]]}
  - {key: mf-dzef-mp2e-gdb, model: mf-dzef-mp2e, material: gdb1013, role: external, eval_data: {label: "COMP6 GDB10to13 conformers within 100 kcal/mol, MP2/TZ forces", location: "Sec. 2.2.2"}, metrics: [[RMSE, Force, 3.42, kcal/mol/A, "GDB10to13 MP2/TZ force RMSE: HIP-NN MF-DZ/EF-MP2/E (mean of 8 models)", "Table 3"]]}
