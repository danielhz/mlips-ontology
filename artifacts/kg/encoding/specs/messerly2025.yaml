gaps:
  - "Conformer (Delta E_conf) and torsion (Delta E_tors) energy-difference RMSEs of Table 4 are derived-property errors and are not encoded; nor are the ANI-1ccx comparison values (2.57, 2.62, 0.77 kcal/mol), which come from a published model evaluated on a split it may have been trained on."
  - "Seven further models of Table 1 (SF-DZ/E, SF-DZ/EF, MF-DZ/E-TZ/EF, MF-TZ/EF-MP2/E, MF-TZ/E-CC/E, MF-TZ/EF-CC/E, MF-DZ/EF-TZ/EF-CC/E) have errors only in the Supplementary Material; not encoded. The +/- values are 95% confidence intervals over 8 models. The subset size is approximate (about 460k), so no n."
