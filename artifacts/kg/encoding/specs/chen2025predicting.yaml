study_label: "Chen et al. (2025): an actively learned moment tensor potential for the thermal properties of uranium nitride"
scope: |
  Encoding scope: the VASP PBE+SOC (ferromagnetic, no Hubbard U) data
  set of 64-atom UN cells grown by MLIP-3 active learning with MD up to
  3600 K (3,236 configurations, 90/10 train/validation), the MTP trained
  on it (energy, force and stress weights 0.85, 0.15, 0.001), and its
  validation RMSEs. Elastic constants, defect energies, thermal expansion,
  specific heat, melting point and thermal conductivity are properties.
materials:
  un: {label: "Uranium nitride (rocksalt UN), crystalline, defective and high-temperature/amorphous configurations", formula: "UN", class: "Inorganic crystals"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, kpoints: "3x3x3", comment: "VASP 6.4.1, spin-orbit coupling, ferromagnetic ordering, no Hubbard U, Gaussian smearing 0.05 eV, 2x2x2 conventional supercell (64 atoms) (Sec. II B)."}
sampling:
  al: {label: "MLIP-3 active learning: MTP-driven MD up to 3600 K with extrapolation-grade selection of new configurations"}
datasets:
  un: {label: "UN active-learning data set (90 % training, 10 % validation)", materials: [un], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 3236, loc: "Sec. II B"}, calc: pbe, sampling: [al]}
methods:
  MTP:
    loss: "Weighted energy, force and stress squared errors (0.85, 0.15, 0.001)"
    impl: {lib: MLIP}
    sims: [MolecularDynamics, GeometryOptimization, PhononCalculation]
runs:
  mtp-un: {label: "MTP for UN trained with MLIP-3 active learning", method: MTP, dataset: un, model: "UN MTP (Chen 2025)"}
results:
