gaps:
  - "Weighted RMSEs (eWRMSE, fWRMSE) are not encoded. Table 4 lists PES1 and PES4 force MAEs (77 and 39 cm-1/bohr) as forces, differing from the Table 3 gradient MAE for PES1 (177); Table 4 is not encoded. Timing comparisons with other MLPs (Fig. 3) are figure-only and partly taken from Ref. 15. PIP is a new registry method without origin."
