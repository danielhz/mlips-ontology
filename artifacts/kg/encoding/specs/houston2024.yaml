id: houston2024
source:
  rank: 569
  year: "2024"
  first_author: "Paul L. Houston"
  title: "No Headache for PIPs: A PIP Potential for Aspirin Runs Much Faster and with Similar Precision Than Other Machine-Learned Potentials"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.4c00054"
  kg_relevance: "Application/model instance"
  arxiv_id: "2401.09316v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "a67997216e9e1e5b18727168557f642d29ffbece72f43ea4cd81ecafc4e97f37"
study_label: "Houston et al. (2024): a permutationally invariant polynomial potential for aspirin with precision similar to other MLPs and much faster evaluation"
scope: |
  Encoding scope: PIP fits to rMD17 aspirin (third-order basis with
  49,978 coefficients; a 25,001-coefficient 2-4 order basis for PES1):
  the train/test study with three training sizes (Table 2) and the four
  final PESs fitted to the lowest-energy data (Table 3). Errors are in
  cm-1 and cm-1/bohr (outside the schema units) and kept with unit null.
  Literature ACE, PaiNN and Allegro values and stationary-point
  properties are not encoded.
hyperparameters:
  ncoef: {label: "Number of PIP coefficients", name: "number of coefficients", datatype: integer}
materials:
  aspirin: {label: "Aspirin (rMD17)", class: "Small organic molecules (MD trajectories)"}
reference:
  md17: {type: DFT, comment: "rMD17 aspirin reference as published"}
sampling:
  rand: {label: "Random 60/40 train/test split of rMD17 aspirin"}
  low: {label: "Lowest-energy configurations and their gradients from rMD17 aspirin"}
datasets:
  d-t1: {label: "rMD17 aspirin training subset: 30,000 energies and 2,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 30000, loc: "Table 2"}, calc: md17, sampling: [rand]}
  d-t2: {label: "rMD17 aspirin training subset: 45,000 energies and 3,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 45000, loc: "Table 2"}, calc: md17, sampling: [rand]}
  d-t3: {label: "rMD17 aspirin training subset: 60,000 energies and 4,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 60000, loc: "Table 2"}, calc: md17, sampling: [rand]}
  d-pes1: {label: "rMD17 aspirin lowest-energy subset: 80,000 energies and 10,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 80000, loc: "Table 3"}, calc: md17, sampling: [low]}
  d-pes2: {label: "rMD17 aspirin lowest-energy subset: 60,000 energies and 3,500 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 60000, loc: "Table 3"}, calc: md17, sampling: [low]}
  d-pes3: {label: "rMD17 aspirin lowest-energy subset: 60,000 energies and 4,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 60000, loc: "Table 3"}, calc: md17, sampling: [low]}
  d-pes4: {label: "rMD17 aspirin lowest-energy subset: 80,000 energies and 5,000 gradient sets", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 80000, loc: "Table 3"}, calc: md17, sampling: [low]}
methods:
  PIP:
    hp: [ncoef]
    loss: "Weighted linear least squares on energies and gradients"
    algorithm: "Over-determined linear regression; MSA basis generation"
    impl: {lib: {local: MSA}}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  pip-t1: {label: "PIP (49,978 coefficients) trained on 30,000 energies and 2,000 gradients", method: PIP, dataset: d-t1, settings: {ncoef: {v: 49978, loc: "Table 2"}}, model: "PIP aspirin Train1"}
  pip-t2: {label: "PIP (49,978 coefficients) trained on 45,000 energies and 3,000 gradients", method: PIP, dataset: d-t2, settings: {ncoef: {v: 49978, loc: "Table 2"}}, model: "PIP aspirin Train2"}
  pip-t3: {label: "PIP (49,978 coefficients) trained on 60,000 energies and 4,000 gradients", method: PIP, dataset: d-t3, settings: {ncoef: {v: 49978, loc: "Table 2"}}, model: "PIP aspirin Train3"}
  pip-pes1: {label: "PIP PES1 (order 2-4, 25,001 coefficients)", method: PIP, dataset: d-pes1, settings: {ncoef: {v: 25001, loc: "Table 3"}}, model: "PIP aspirin PES1"}
  pip-pes2: {label: "PIP PES2 (order 3, 49,978 coefficients)", method: PIP, dataset: d-pes2, settings: {ncoef: {v: 49978, loc: "Table 3"}}, model: "PIP aspirin PES2"}
  pip-pes3: {label: "PIP PES3 (order 3, 49,978 coefficients)", method: PIP, dataset: d-pes3, settings: {ncoef: {v: 49978, loc: "Table 3"}}, model: "PIP aspirin PES3"}
  pip-pes4: {label: "PIP PES4 (order 3, 49,978 coefficients)", method: PIP, dataset: d-pes4, settings: {ncoef: {v: 49978, loc: "Table 3"}}, model: "PIP aspirin PES4"}
