gaps:
  - "Table II also gives MADs on set A and set B against CCSD(T)/cc-pVTZ; models trained on the larger set B (SI Section S6) are not encoded. Set A results are evaluated against CCSD(T)/cc-pVQZ rather than each model's own training labels, so their role is left null."
  - "Validation MAEs of the ML models are given only approximately ('about 1.2-1.3 kcal/mol/A', Table S5 not read)."
  - "Table I (average force MADs of VMC, DMC, PBE-TS and PBE0-MBD against CCSD(T)/cc-pVQZ) compares reference methods and is not encoded; vibrational spectra (Fig. 3) are property comparisons. The DFT code is not named in the text read."
