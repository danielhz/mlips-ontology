  - {key: m-pbe0-mbd-a, model: m-pbe0-mbd, material: ethanol, role: null, eval_data: {label: "Set A (training and validation configurations) against CCSD(T)/cc-pVQZ forces", location: "Table II"}, metrics: [[MAE, Force, 1.7, kcal/mol/A, "force MAD vs CCSD(T)/cc-pVQZ on ethanol set A: sGDML trained on PBE0-MBD", "Table II (column A, Q)"]]}
  - {key: m-pbe0-mbd-c, model: m-pbe0-mbd, material: ethanol, role: test, eval_data: {label: "Set C: 2000 configurations clustered from the PBE-TS MD trajectory, against CCSD(T)/cc-pVTZ forces", location: "Table II"}, metrics: [[MAE, Force, 2.1, kcal/mol/A, "force MAD vs CCSD(T)/cc-pVTZ on ethanol set C: sGDML trained on PBE0-MBD", "Table II (column C, T)"]]}
  - {key: m-cc-tz-a, model: m-cc-tz, material: ethanol, role: null, eval_data: {label: "Set A (training and validation configurations) against CCSD(T)/cc-pVQZ forces", location: "Table II"}, metrics: [[MAE, Force, 1.0, kcal/mol/A, "force MAD vs CCSD(T)/cc-pVQZ on ethanol set A: sGDML trained on CCSD(T)/cc-pVTZ", "Table II (column A, Q)"]]}
