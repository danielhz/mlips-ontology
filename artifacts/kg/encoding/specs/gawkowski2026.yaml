study_label: "Gawkowski et al. (2026): Dyna-Mat, end-to-end benchmarking of 15 foundation MLIPs on finite-temperature first-principles MD ensembles"
scope: |
  Encoding scope: the Dyna-Mat-v1.0 data set (17 NVT first-principles
  MD trajectories at 293-1500 K over metals, TMDs, alloys, perovskites,
  interfaces and molecular crystals; VASP PBE, FHI-aims PBE+D3 for the
  molecular crystals) and the 15 foundation MLIPs evaluated on it as
  distributed, in four tiers of training data. Per-model energy and force
  RMSEs, RDF, pressure and VDOS errors are shown only in figures; the text
  gives only tier medians, which are aggregates over models and are not
  encoded.
materials:
  dynamat: {label: "Dyna-Mat-v1.0 systems: pure metals, transition-metal dichalcogenides, metal alloys, perovskites (e.g. MAPbBr3), H2O on Pt(111), Cu3Au clusters and molecular crystals (naphthalene, anthracene, tetracene, pentacene, picene)", class: "Universal (materials and molecules)"}
reference:
  vasp: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 700, kpoints: "4.54 1/A Gamma-centred k-point density", comment: "potpaw.64, Gaussian smearing 0.05 eV, dipole corrections for surfaces (Table I)."}
  aims: {type: DFT, code: FHIaims, xc: PBE, comment: "PBE+D3 for molecular crystals, tight (2020) defaults, all-electron (Table I)."}
datasets:
  dynamat: {label: "Dyna-Mat-v1.0: 17 first-principles NVT MD trajectories (up to about 21 ps each)", materials: [dynamat], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: vasp}
