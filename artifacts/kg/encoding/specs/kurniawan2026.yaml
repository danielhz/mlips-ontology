  - {key: snapshots-train, model: snapshots, material: carbon, role: training, eval_data: {label: "Carbon training set (90 %)", location: "Table 2"}, metrics: [[RMSE, Energy, 7.105, meV/atom, "train energy RMSE on carbon: carbon NNIP snapshots ensemble", "Table 2"], [RMSE, Force, 5.218, meV/A, "train force RMSE on carbon: carbon NNIP snapshots ensemble", "Table 2"]]}
  - {key: snapshots-test, model: snapshots, material: carbon, role: test, eval_data: {label: "Carbon test set (10 %; also used for epoch selection)", location: "Table 2"}, metrics: [[RMSE, Energy, 7.235, meV/atom, "test energy RMSE on carbon: carbon NNIP snapshots ensemble", "Table 2"], [RMSE, Force, 5.501, meV/A, "test force RMSE on carbon: carbon NNIP snapshots ensemble", "Table 2"]]}
resources: |
