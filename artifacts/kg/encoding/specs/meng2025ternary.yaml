  first_author: "Fan-Shun Meng"
  title: "A Neural Network Interatomic Potential for the Ternary α-Fe-C-H System: Toward Million-Atom Simulations of Hydrogen Embrittlement in Steel"
  venue: "JOM"
  doi: "10.1007/s11837-025-07721-4"
