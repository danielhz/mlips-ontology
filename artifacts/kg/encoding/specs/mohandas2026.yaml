study_label: "Mohandas, Echeverri Restrepo and Sluiter (2026): catastrophic forgetting when fine-tuning CHGNet, MACE and SevenNet on bcc Fe"
scope: |
  Encoding scope: three MPtrj-trained universal MLIPs (CHGNet 0.2.0,
  MACE-MP-0b3 medium, SevenNet-0) fine-tuned on a PBE bcc-Fe data set by
  naive fine-tuning, layer freezing and (MACE) multi-head replay at
  learning rate 0.0001, with energy and force RMSEs on a random 10% subset
  of MPtrj before and after fine-tuning (forgetting) and RMSEs of
  solute-solute and vacancy-solute binding energies against DFT. Fe
  property tables (Tables 1, 2, 4) are properties, not error metrics.
materials:
  mptrj: {label: "Materials Project relaxation trajectories (inorganic crystals, 89 elements)", class: "Inorganic crystals"}
  fe: {label: "bcc iron with vacancies, grain boundaries, free surfaces and deformed cells", formula: "Fe", class: "Elemental metal (bcc)"}
  fe-solutes: {label: "Substitutional solute pairs (Al, Cu, Ni, Nb, Sn, Ti, Zn, Mo, V) and vacancy-solute pairs in bcc Fe, first five neighbour shells", class: "Dilute iron alloys"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, comment: "MPMetalRelaxSet (pymatgen) inputs consistent with MPtrj; Fe pseudopotential with 8 valence electrons."}
datasets:
  fe: {label: "Pure Fe data set (bcc-based structures; 10,400 training structures)", materials: [fe], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 10400, loc: "Sec. 3.1"}, calc: pbe, comment: "Defect configurations (vacancies, GBs, surfaces, deformed cells) included in large numbers to weight them."}
external_models: [MACE-MP-0b3-medium]
methods:
  CHGNet:
    hp: [learningRate, numEpochs]
    impl: {lib: CHGNet}
    sims: [MolecularDynamics, GeometryOptimization, NudgedElasticBand]
  MACE:
    hp: [learningRate, numEpochs]
    algorithm: "Naive fine-tuning, freezing of the first four layers, or multi-head replay (MACE 0.3.12)"
    impl: {lib: MACE}
    sims: [MolecularDynamics, GeometryOptimization, NudgedElasticBand]
  NequIP:
    hp: [learningRate, numEpochs]
    impl: {lib: {local: "SevenNet", comment: "SevenNet implementation of NequIP"}}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  chg2: {label: "CHGNet 0.2.0 as distributed (MPtrj)", method: CHGNet, model: "CHGNet 0.2.0 (CHG2)"}
  sevennet: {label: "SevenNet-0 as distributed (MPtrj; version not stated)", method: NequIP, model: "SevenNet-O"}
  chg2-naive: {label: "CHGNet 0.2.0 naive fine-tuning on the Fe data set", method: CHGNet, dataset: fe, settings: {learningRate: {v: 0.0001, loc: "Sec. 2.2"}, numEpochs: {v: 50, loc: "Sec. 3.1"}}, model: "CHG2-naive Fe model", base_model: {run: chg2, relation: fine-tuned, location: "Sec. 2.2"}}
  chg2-ft: {label: "CHGNet 0.2.0 fine-tuned on Fe with only the convolution layers trainable (CHG2-FT)", method: CHGNet, dataset: fe, settings: {learningRate: {v: 0.0001, loc: "Sec. 2.2"}, numEpochs: {v: 50, loc: "Sec. 3.1"}}, model: "CHG2-FT Fe model", base_model: {run: chg2, relation: fine-tuned, location: "Sec. 3.1; Table 3"}}
  sevennet-naive: {label: "SevenNet-0 naive fine-tuning on the Fe data set", method: NequIP, dataset: fe, settings: {learningRate: {v: 0.0001, loc: "Sec. 2.2"}, numEpochs: {v: 50, loc: "Sec. 3.1"}}, model: "SevenNet-O naive Fe model", base_model: {run: sevennet, relation: fine-tuned, location: "Sec. 2.2"}}
  mace-naive: {label: "MACE-MP-0b3 medium naive fine-tuning on the Fe data set", method: MACE, dataset: fe, settings: {learningRate: {v: 0.0001, loc: "Sec. 2.2"}, numEpochs: {v: 50, loc: "Sec. 3.1"}}, model: "MACE-naive Fe model", base_model: {registry: MACE-MP-0b3-medium, relation: fine-tuned, location: "Sec. 2.1.2"}}
  mace-ft: {label: "MACE-MP-0b3 medium multi-head replay fine-tuning on the Fe data set (MACE-FT)", method: MACE, dataset: fe, settings: {learningRate: {v: 0.0001, loc: "Sec. 2.2"}, numEpochs: {v: 50, loc: "Sec. 3.1"}}, model: "MACE-FT (replay) Fe model", base_model: {registry: MACE-MP-0b3-medium, relation: fine-tuned, location: "Sec. 2.2"}}
  mace-freeze: {label: "MACE-MP-0b3 medium fine-tuned on Fe with the first four layers frozen", method: MACE, dataset: fe, model: "MACE-freeze Fe model", base_model: {registry: MACE-MP-0b3-medium, relation: fine-tuned, location: "Sec. 2.2.1"}}
