id: mohandas2026
source:
  rank: 271
  year: "2026"
  first_author: "Naveen Karuthodi Mohandas"
  title: "Fine-Tuning Universal Machine-Learned Interatomic Potentials for Applications in the Science of Steels"
  venue: "Journal of Phase Equilibria and Diffusion"
  doi: "10.1007/s11669-025-01225-z"
  kg_relevance: "Training/reliability"
  arxiv_id: ""
  pdf_version: "publisher"
