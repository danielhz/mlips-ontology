source:
  rank: 400
  year: "2025"
  first_author: "Maximilian Xaver Tiefenbacher"
  title: "Excited-state nonadiabatic dynamics in explicit solvent using machine learned interatomic potentials"
  venue: "Digital Discovery"
  doi: "10.1039/d5dd00044k"
  kg_relevance: "Application/model instance"
