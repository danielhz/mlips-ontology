gaps:
  - "Energy MAEs and force RMSEs over the five states for each split and subsampling fraction (three seeds each) are figure-only (Fig. 6); weighted RMSEs are discussed only qualitatively. The subsampling variants are settings of these two runs and are not encoded separately."
