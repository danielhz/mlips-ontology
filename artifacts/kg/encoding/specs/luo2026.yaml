id: luo2026
source:
  rank: 283
  year: "2026"
  first_author: "Mingxiang Luo"
  title: "Active rejection enables reliable generalization of universal machine-learning interatomic potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2607.09456"
  kg_relevance: "Training/reliability"
  arxiv_id: "2607.09456v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "74a9747cc8afc43901b9512184f6b309d0b9e522bb604317b7d8e0d4ed73551d"
study_label: "Luo et al. (2026): Adaptive Multi-Teacher Routing (ATR) with active rejection for r2SCAN-level pseudo-labels and CHGNet students"
scope: |
  Encoding scope: the ATR pseudo-label data set (2.89 million accepted
  r2SCAN-level labels from universal-MLIP teachers, calibrated on about
  18,000 r2SCAN single points), the CHGNet student and control models and
  the teacher references of Table 3 (held-out r2SCAN and MP-r2SCAN energy
  and force MAEs), the SevenNet-Omni-i12-MP calibration-set errors (Fig.
  2a, b) and the HgInSn AIMD energy MAEs (Table 4). Router screening
  metrics (Tables 1, 2) and MD stability statistics are not encoded.
materials:
  open-materials: {label: "Inorganic materials from Materials Project, Alexandria, MPtrj and OQMD (86 elements, up to 240 atoms; mostly bulk alloys, halides, chalcogenides and oxides)", class: "Inorganic crystals"}
  hginsn: {label: "Hg16In20Sn12 alloy supercell at 300 K", formula: "Hg16In20Sn12", class: "Soft-metal alloy"}
reference:
  r2scan: {type: DFT, code: VASP, xc: {local: "r2SCAN"}, pp: PAW, cutoff: 680, kpoints: "KSPACING = 0.22 1/A", comment: "MatPES-compatible static workflow, PBE_64 PAW, ENAUG 1360 eV, PREC Accurate, EDIFF 1e-5, spin-polarised; AIMD with 450 eV and Gamma point."}
datasets:
  atr: {label: "ATR pseudo-label pretraining set: about 2.6 million of 2,893,331 accepted r2SCAN-level pseudo-labels (from 7,674,241 PBE candidate structures)", materials: [open-materials], properties: [Energy, Forces], provenance: Augmented, calc: r2scan, comment: "Pseudo-labels from SevenNet, MACE, CHGNet and PET-MAD teachers selected by the ATR router; calibration set of about 18,000 real r2SCAN single points."}
  pbe-orig: {label: "Same 2.6M structure pool with original (non-routed) labels, for the without-ATR controls", materials: [open-materials], properties: [Energy, Forces], provenance: Published}
  mp-r2scan: {label: "MP-r2SCAN training data", materials: [open-materials], properties: [Energy, Forces], provenance: Published}
methods:
  CHGNet:
    hp: [learningRate, batchSize, numEpochs]
    loss: "Huber loss on energies and forces (wE:wF = 1:1 in pretraining, 3:1 in fine-tuning)"
    algorithm: "4-GPU DDP, cosine annealing from 1e-3 to 1e-5"
    impl: {lib: CHGNet}
    sims: [MolecularDynamics]
  NequIP: {sims: [MolecularDynamics]}
runs:
  baseline: {label: "CHGNet trained only on MP-r2SCAN (baseline)", method: CHGNet, dataset: mp-r2scan, model: "CHGNet baseline (MP-r2SCAN only)"}
  noatr1: {label: "CHGNet without ATR, control 1 (non-routed pretraining on the same structure pool)", method: CHGNet, dataset: pbe-orig, model: "CHGNet without ATR 1"}
  noatr2: {label: "CHGNet without ATR, control 2 (non-routed pretraining on the same structure pool, different protocol)", method: CHGNet, dataset: pbe-orig, model: "CHGNet without ATR 2"}
  student-pre: {label: "CHGNet pretrained from scratch on ATR pseudo-labels", method: CHGNet, dataset: atr, settings: {learningRate: {v: 0.001, loc: "Sec. 4.5"}, batchSize: {v: 256, loc: "Sec. 4.5 (global)"}, numEpochs: {v: 40, loc: "Sec. 4.5"}}, model: "CHGNet ATR-pretrained checkpoint"}
  student: {label: "ATR student: ATR-pretrained CHGNet fine-tuned on MP-r2SCAN", method: CHGNet, dataset: mp-r2scan, settings: {learningRate: {v: 0.001, loc: "Sec. 4.5"}, batchSize: {v: 256, loc: "Sec. 4.5 (global)"}, numEpochs: {v: 50, loc: "Sec. 4.5"}}, model: "CHGNet ATR student", base_model: {run: student-pre, relation: fine-tuned, location: "Sec. 4.5"}}
  chgnet-r2scan: {label: "Official CHGNet-r2SCAN checkpoint as distributed", method: CHGNet, model: "CHGNet-r2SCAN"}
  7net-mp: {label: "SevenNet-Omni-i12 (MP-r2SCAN channel) as distributed", method: NequIP, model: "SevenNet-Omni-i12-MP (r2SCAN)"}
  7net-matpes: {label: "SevenNet-Omni-i12 (MatPES-r2SCAN channel) as distributed", method: NequIP, model: "SevenNet-Omni-i12-MatPES (r2SCAN)"}
