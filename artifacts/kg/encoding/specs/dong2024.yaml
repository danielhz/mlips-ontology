  - {key: nep1-test, model: nep1, material: si, role: test, eval_data: {label: "100 structures from NEP-iteration-1 NPT MD at 100-1000 K (10 ps)", location: "Sec. III B 3"}, metrics: [[RMSE, Energy, 1.2, meV/atom, "test energy RMSE on si: Si NEP-iteration-1", "Sec. III B 3"], [RMSE, Force, 41.6, meV/A, "test force RMSE on si: Si NEP-iteration-1", "Sec. III B 3"], [RMSE, Stress, 8.5, null, "test virial RMSE on si in meV/atom: Si NEP-iteration-1", "Sec. III B 3"]]}
  - {key: nep2-test, model: nep2, material: si, role: test, eval_data: {label: "100 structures from NEP-iteration-2 NPT MD at 100-1000 K (10 ns)", location: "Sec. III B 3"}, metrics: [[RMSE, Energy, 0.5, meV/atom, "test energy RMSE on si: Si NEP-iteration-2", "Sec. III B 3"], [RMSE, Force, 33.5, meV/A, "test force RMSE on si: Si NEP-iteration-2", "Sec. III B 3"], [RMSE, Stress, 8.9, null, "test virial RMSE on si in meV/atom: Si NEP-iteration-2", "Sec. III B 3"]]}
  - {key: nep2-300k, model: nep2, material: si, role: test, eval_data: {label: "Silicon configurations at 300 K (set not described further)", location: "Sec. III C 4"}, metrics: [[RMSE, Force, 21.2, meV/A, "test force RMSE at 300 K on si: Si NEP-iteration-2", "Sec. III C 4"]]}
  - {key: nep-n1, model: nep-n1, material: si, role: null, eval_data: {label: "Evaluation set not stated", location: "Sec. III C 4"}, metrics: [[RMSE, Force, 32.4, meV/A, "force RMSE on si: Si NEP, N_neu = 1", "Sec. III C 4"]]}
