gaps:
  - "Carbon errors versus training-set size (PANNA small/mid/big, NequIP l=1/2, MACE) and the improvement of the distilled PANNA model are figure-only (Fig. 1); no carbon result is encoded."
  - "ANI (pre/rand) and SOTA columns of Table I and the 2G/4G-HDNNP rows of Table III are literature values quoted from Refs. 13, 22-23 and 44; not encoded. Charge RMSEs (LR gamma_q>0: 11.5 train, 11.8 test; gamma_q=0: 237.3, 238.9 me) have no metric property in the schema and are left out."
  - "PANNA-LR keeps its origin shaidu2024: this paper implements it and defers the theory to its Ref. 46."
