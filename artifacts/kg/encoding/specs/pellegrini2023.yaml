  p-malonaldehyde: {label: "PANNA mBP for rMD17 Malonaldehyde", method: HDNNP, dataset: r-malonaldehyde, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Malonaldehyde"}
  p-naphthalene: {label: "PANNA mBP for rMD17 Naphthalene", method: HDNNP, dataset: r-naphthalene, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Naphthalene"}
  p-paracetamol: {label: "PANNA mBP for rMD17 Paracetamol", method: HDNNP, dataset: r-paracetamol, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Paracetamol"}
  p-salicylic: {label: "PANNA mBP for rMD17 Salicylic acid", method: HDNNP, dataset: r-salicylic, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Salicylic acid"}
  p-toluene: {label: "PANNA mBP for rMD17 Toluene", method: HDNNP, dataset: r-toluene, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Toluene"}
  p-uracil: {label: "PANNA mBP for rMD17 Uracil", method: HDNNP, dataset: r-uracil, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Uracil"}
  c-small: {label: "PANNA small (layers 64, 32) for carbon", method: HDNNP, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}, numLayers: {v: 2, loc: "Sec. III B"}, learningRate: {v: 0.0001, loc: "Sec. III B"}, batchSize: {v: 10, loc: "Sec. III B"}}, model: "PANNA small carbon"}
  c-mid: {label: "PANNA mid (layers 256, 128) for carbon", method: HDNNP, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}, numLayers: {v: 2, loc: "Sec. III B"}, learningRate: {v: 0.0001, loc: "Sec. III B"}, batchSize: {v: 10, loc: "Sec. III B"}}, model: "PANNA mid carbon"}
  c-big: {label: "PANNA big (layers 1024, 512, 256) for carbon", method: HDNNP, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}, numLayers: {v: 3, loc: "Sec. III B"}, learningRate: {v: 0.0001, loc: "Sec. III B"}, batchSize: {v: 10, loc: "Sec. III B"}}, model: "PANNA big carbon"}
  c-nequip1: {label: "NequIP l=1 for carbon", method: NequIP, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}, numLayers: {v: 4, loc: "Sec. III B"}, numFeatures: {v: 32, loc: "Sec. III B"}, numRadialBasis: {v: 8, loc: "Sec. III B"}}, model: "NequIP l=1 carbon"}
  c-nequip2: {label: "NequIP l=2 for carbon", method: NequIP, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}, numLayers: {v: 4, loc: "Sec. III B"}, numFeatures: {v: 32, loc: "Sec. III B"}, numRadialBasis: {v: 8, loc: "Sec. III B"}}, model: "NequIP l=2 carbon"}
  c-mace: {label: "MACE for carbon", method: MACE, dataset: carbon, settings: {cutoffRadius: {v: 5, loc: "Sec. III B"}}, model: "MACE carbon"}
  c-kd: {label: "PANNA retrained on MACE-labelled perturbed carbon data (knowledge distillation)", method: HDNNP, dataset: carbon-kd, model: "PANNA distilled carbon", base_model: {run: c-mace, relation: distilled, location: "Sec. III B"}}
  n-sr: {label: "PANNA short-range model for NaCl clusters", method: HDNNP, dataset: nacl, settings: {numLayers: {v: 2, loc: "Sec. III C"}}, model: "PANNA SR NaCl"}
  n-lrq: {label: "PANNA long-range model with charge targets (gamma_q > 0) for NaCl clusters", method: PANNA-LR, dataset: nacl, settings: {numLayers: {v: 2, loc: "Sec. III C"}}, model: "PANNA LR NaCl gamma_q>0"}
  n-lr0: {label: "PANNA long-range model without charge targets (gamma_q = 0) for NaCl clusters", method: PANNA-LR, dataset: nacl, settings: {numLayers: {v: 2, loc: "Sec. III C"}}, model: "PANNA LR NaCl gamma_q=0"}
