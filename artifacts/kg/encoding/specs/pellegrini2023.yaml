id: pellegrini2023
source:
  rank: 466
  year: "2023"
  first_author: "Franco Pellegrini"
  title: "PANNA 2.0: Efficient neural network interatomic potentials and new architectures"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0158075"
  kg_relevance: "Application/model instance"
  arxiv_id: "2305.11805v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "f83ec49bac0b03d17844c81b3c21e31037b5bbb1458b189d3db5aeef231878c3"
study_label: "Pellegrini et al. (2023): PANNA 2.0, Behler-Parrinello-type networks with modified descriptors, long-range electrostatics, and benchmarks on rMD17, carbon and charged NaCl clusters"
scope: |
  Encoding scope: PANNA modified Behler-Parrinello (mBP) networks on
  rMD17 (1,000 configurations per molecule; Table I validation MAEs), on
  a 60,000-configuration carbon dataset (three PANNA sizes against
  NequIP and MACE, errors figure-only; MD timings of Table II; a PANNA
  model distilled from MACE labels) and on charged Na9Cl8+/Na8Cl8+
  clusters (short-range PANNA and the long-range PANNA model with and
  without charge targets; Table III). ANI, SOTA and 2G/4G-HDNNP values
  are quoted from the literature and not encoded.
materials:
  aspirin: {label: "Aspirin (rMD17)", class: "Small organic molecules (MD trajectories)"}
  azobenzene: {label: "Azobenzene (rMD17)", class: "Small organic molecules (MD trajectories)"}
  benzene: {label: "Benzene (rMD17)", class: "Small organic molecules (MD trajectories)"}
  ethanol: {label: "Ethanol (rMD17)", class: "Small organic molecules (MD trajectories)"}
  malonaldehyde: {label: "Malonaldehyde (rMD17)", class: "Small organic molecules (MD trajectories)"}
  naphthalene: {label: "Naphthalene (rMD17)", class: "Small organic molecules (MD trajectories)"}
  paracetamol: {label: "Paracetamol (rMD17)", class: "Small organic molecules (MD trajectories)"}
  salicylic: {label: "Salicylic acid (rMD17)", class: "Small organic molecules (MD trajectories)"}
  toluene: {label: "Toluene (rMD17)", class: "Small organic molecules (MD trajectories)"}
  uracil: {label: "Uracil (rMD17)", class: "Small organic molecules (MD trajectories)"}
  carbon: {label: "Carbon allotropes, high-pressure, high-temperature and defected configurations (16-200 atoms)", formula: C, class: "Elemental solid and liquid carbon"}
  nacl: {label: "Charged sodium chloride clusters Na9Cl8+ and Na8Cl8+", class: "Metal cluster"}
reference:
  rmd17ref: {type: DFT, xc: PBE, basis: "def2-SVP", comment: "rMD17 labels (Ref. 47)"}
  carbonref: {type: DFT, comment: "Carbon dataset of Ref. 9 (evolutionary search with an earlier PANNA version); level of theory not restated here"}
  naclref: {type: DFT, comment: "NaCl cluster data of Ref. 44"}
  macelabels: {type: REF, code: MLIP, comment: "Energies and forces from the best MACE model on 10 Gaussian-perturbed copies (sigma 0.075 A) of each training configuration"}
sampling:
  rand: {label: "1,000 random configurations per molecule (rMD17 budget)"}
  fps: {label: "Farthest-point selection by cosine fingerprint distance from the 50,000-configuration training split"}
  perturb: {label: "Gaussian perturbation of atomic positions (sigma 0.075 A), 10 copies per configuration"}
  pub: {label: "Published cluster data of Ref. 44"}
datasets:
  r-aspirin: {label: "rMD17 Aspirin, 1,000 training configurations", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-azobenzene: {label: "rMD17 Azobenzene, 1,000 training configurations", materials: [azobenzene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-benzene: {label: "rMD17 Benzene, 1,000 training configurations", materials: [benzene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-ethanol: {label: "rMD17 Ethanol, 1,000 training configurations", materials: [ethanol], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-malonaldehyde: {label: "rMD17 Malonaldehyde, 1,000 training configurations", materials: [malonaldehyde], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-naphthalene: {label: "rMD17 Naphthalene, 1,000 training configurations", materials: [naphthalene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-paracetamol: {label: "rMD17 Paracetamol, 1,000 training configurations", materials: [paracetamol], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-salicylic: {label: "rMD17 Salicylic acid, 1,000 training configurations", materials: [salicylic], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-toluene: {label: "rMD17 Toluene, 1,000 training configurations", materials: [toluene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  r-uracil: {label: "rMD17 Uracil, 1,000 training configurations", materials: [uracil], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table I caption"}, calc: rmd17ref, sampling: [rand]}
  carbon: {label: "Carbon dataset, full 50,000-configuration training split", materials: [carbon], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Sec. III B"}, calc: carbonref, sampling: [fps]}
  carbon-kd: {label: "Carbon dataset augmented with MACE labels (about half a million configurations)", materials: [carbon], properties: [Energy, Forces], provenance: Augmented, calc: macelabels, sampling: [perturb]}
  nacl: {label: "Na9Cl8+ and Na8Cl8+ cluster configurations of Ref. 44", materials: [nacl], properties: [Energy, Forces], provenance: Published, calc: naclref, sampling: [pub]}
methods:
  HDNNP:
    hp: [cutoffRadius, numLayers, learningRate, batchSize]
    loss: "Quadratic energy and force loss (force cost 1 on rMD17), L1 regularization 1e-5 on rMD17"
    algorithm: "Adam; learning rate 1e-4, then quenched to 1e-6"
    impl: {lib: {local: PANNA}, comment: "PANNA 2.0 (TensorFlow), modified Behler-Parrinello descriptors"}
    sims: [MolecularDynamics]
  PANNA-LR:
    hp: [numLayers]
    loss: "Energy and force loss, optionally charge loss (gamma_q)"
    impl: {lib: {local: PANNA}, comment: "PANNA 2.0 long-range layer: per-atom energy, electronegativity and hardness, charge equilibration"}
    sims: [GeometryOptimization]
  NequIP:
    hp: [cutoffRadius, numLayers, numFeatures, numRadialBasis]
    impl: {lib: NequIP, comment: "Default parameters otherwise"}
  MACE:
    hp: [cutoffRadius]
    loss: "MACE default schedule with SWA and energy re-weighting in the last 20%"
    impl: {lib: MACE, comment: "Standard 128x0e + 128x1o setup"}
runs:
  p-aspirin: {label: "PANNA mBP for rMD17 Aspirin", method: HDNNP, dataset: r-aspirin, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Aspirin"}
  p-azobenzene: {label: "PANNA mBP for rMD17 Azobenzene", method: HDNNP, dataset: r-azobenzene, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, numLayers: {v: 2, loc: "Sec. III A"}, learningRate: {v: 0.0001, loc: "Sec. III A"}}, model: "PANNA rMD17 Azobenzene"}
