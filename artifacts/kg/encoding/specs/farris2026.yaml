  - {key: qm7-rad-test, model: qm7-rad, material: qm7, role: test, eval_data: {label: "QM7 test split (10%)", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 7.5, meV/atom, "test energy MAE on QM7: RAD (mean of 5 runs)", "Table 7"], [RMSE, Energy, 13.0, meV/atom, "test energy RMSE on QM7: RAD (mean of 5 runs)", "Table 7"]]}
  - {key: qm7-de-test, model: qm7-de, material: qm7, role: test, eval_data: {label: "QM7 test split (10%)", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 7.1, meV/atom, "test energy MAE on QM7: DE (mean of 5 runs)", "Table 7"], [RMSE, Energy, 15.2, meV/atom, "test energy RMSE on QM7: DE (mean of 5 runs)", "Table 7"]]}
gaps:
  - "Force errors are not reported in the text read. The +/- values are standard deviations over five runs. NLL, RMSCE, sharpness, overlap and Spearman metrics are not encoded. BNN vs ensemble is a training-scheme setting of the same HDNNP method."
