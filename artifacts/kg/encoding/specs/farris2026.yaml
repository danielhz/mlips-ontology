  - {key: tio2-low-rad-test, model: tio2-low-rad, material: tio2, role: test, eval_data: {label: "TiO2 test set (781 structures)", location: "Sec. 3.1"}, metrics: [[MAE, Energy, 77, meV/atom, "test energy MAE on TiO2 (low-data): RAD (mean of 5 runs)", "Table 4"], [RMSE, Energy, 466, meV/atom, "test energy RMSE on TiO2 (low-data): RAD (mean of 5 runs)", "Table 4"]]}
  - {key: tio2-low-de-test, model: tio2-low-de, material: tio2, role: test, eval_data: {label: "TiO2 test set (781 structures)", location: "Sec. 3.1"}, metrics: [[MAE, Energy, 35, meV/atom, "test energy MAE on TiO2 (low-data): DE (mean of 5 runs)", "Table 4"], [RMSE, Energy, 291, meV/atom, "test energy RMSE on TiO2 (low-data): DE (mean of 5 runs)", "Table 4"]]}
