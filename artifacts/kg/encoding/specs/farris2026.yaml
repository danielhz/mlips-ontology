  - {key: tio2-high-rad-test, model: tio2-high-rad, material: tio2, role: test, eval_data: {label: "TiO2 test set (781 structures)", location: "Sec. 3.1"}, metrics: [[MAE, Energy, 21, meV/atom, "test energy MAE on TiO2 (high-data): RAD (mean of 5 runs)", "Table 4"], [RMSE, Energy, 38, meV/atom, "test energy RMSE on TiO2 (high-data): RAD (mean of 5 runs)", "Table 4"]]}
  - {key: tio2-high-de-test, model: tio2-high-de, material: tio2, role: test, eval_data: {label: "TiO2 test set (781 structures)", location: "Sec. 3.1"}, metrics: [[MAE, Energy, 6, meV/atom, "test energy MAE on TiO2 (high-data): DE (mean of 5 runs)", "Table 4"], [RMSE, Energy, 9, meV/atom, "test energy RMSE on TiO2 (high-data): DE (mean of 5 runs)", "Table 4"]]}
