id: birks2026
source:
  rank: 372
  year: "2026"
  first_author: "Fraser Birks"
  title: "Efficient and accurate spatial mixing of machine learned interatomic potentials for materials science"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-026-01982-6"
  kg_relevance: "Application/model instance"
  arxiv_id: ""
  pdf_version: "publisher"
  pdf_sha256: "a7d56949872295c45505425f0dfab16ba1c8af1a8808893e8c9f1725c8245b74"
study_label: "Birks et al. (2026): ML-MIX, spatial mixing of expensive and cheap MLIPs with constrained linear fitting (Si, Fe, W, W-He)"
scope: |
  Encoding scope: the expensive potentials (Si, Fe, W-He and W ACE from
  ACEpotentials.jl; W-He MACE fine-tuned from mace-mpa-0-medium with
  multihead replay) and the cheap potentials (Si and Fe linear ACE (2,10),
  W UF3, W ACE (3,14), W SNAP of Wood and Thompson), with the training
  energy and force RMSEs of Table 2 on the full DFT data sets and, for
  the constrained cheap potentials, on synthetic MD data generated by the
  expensive potentials. Elastic constants (Table 3), NEB barriers,
  diffusion coefficients and speedups (Tables 4-5) are properties or
  relative timings.
hyperparameters:
  corrOrder: {label: "ACE correlation order nu", name: "corrOrder", datatype: integer}
  polyDegree: {label: "ACE maximum total polynomial degree p", name: "polyDegree", datatype: integer}
materials:
  si: {label: "Silicon (diamond; vacancy migration, stretched bond)", formula: "Si", class: "Elemental semiconductor"}
  fe: {label: "Bcc iron (self-interstitial dumbbell diffusion)", formula: "Fe", class: "Metals"}
  w: {label: "Bcc tungsten (screw dislocations, surfaces, kinks)", formula: "W", class: "Metals"}
  whe: {label: "Tungsten with helium (interstitial He diffusion, He implantation)", class: "Metals"}
datasets:
  si-dft: {label: "Si DFT data of Ref. 16", materials: [si], properties: [Energy, Forces], provenance: Published}
  fe-dft: {label: "Fe DFT data of Ref. 49", materials: [fe], properties: [Energy, Forces], provenance: Published}
  whe-dft: {label: "W-He DFT data of Refs. 50-52 (extended with He implantation snapshots, Sec. 4.3)", materials: [whe], properties: [Energy, Forces], provenance: Augmented}
  w-dft: {label: "W DFT data of Ref. 52 (extended with surface and kink configurations, Sec. 4.3)", materials: [w], properties: [Energy, Forces], provenance: Augmented}
  si-syn: {label: "Synthetic Si data from the expensive Si ACE: 500 K bulk MD snapshots (soft) and homogeneous strains (hard constraints)", materials: [si], properties: [Energy, Forces], provenance: InHouse}
  fe-syn: {label: "Synthetic Fe data from the expensive Fe ACE: 1200 K bulk MD snapshots and strains", materials: [fe], properties: [Energy, Forces], provenance: InHouse}
  w-syn: {label: "Synthetic W data from the expensive W-He ACE: 1200 K bulk MD snapshots and strains", materials: [w], properties: [Energy, Forces], provenance: InHouse}
methods:
  ACE:
    hp: [cutoffRadius, corrOrder, polyDegree]
    impl: {lib: {local: "ACEpotentials.jl"}}
    sims: [MolecularDynamics, NudgedElasticBand]
  MACE:
    hp: [cutoffRadius, numLayers, numFeatures]
    impl: {lib: MACE}
    sims: [MolecularDynamics]
  UF3:
    loss: "Constrained linear least squares (soft MD constraints, hard elastic constraints via an augmented Lagrangian)"
    sims: [MolecularDynamics]
  SNAP:
    sims: [MolecularDynamics]
runs:
  si-exp: {label: "Expensive Si ACE (nu 4, p 20)", method: ACE, dataset: si-dft, settings: {cutoffRadius: {v: 6.0, loc: "Table 1"}, corrOrder: {v: 4, loc: "Table 1"}, polyDegree: {v: 20, loc: "Table 1"}}, model: "ML-MIX Si ACE (4,20)"}
  fe-exp: {label: "Expensive Fe ACE (nu 3, p 20)", method: ACE, dataset: fe-dft, settings: {cutoffRadius: {v: 5.5, loc: "Table 1"}, corrOrder: {v: 3, loc: "Table 1"}, polyDegree: {v: 20, loc: "Table 1"}}, model: "ML-MIX Fe ACE (3,20)"}
  whe-exp: {label: "Expensive W-He ACE (nu 3, p 20)", method: ACE, dataset: whe-dft, settings: {cutoffRadius: {v: 5.0, loc: "Table 1"}, corrOrder: {v: 3, loc: "Table 1"}, polyDegree: {v: 20, loc: "Table 1"}}, model: "ML-MIX W-He ACE (3,20)"}
  w-exp: {label: "Expensive W ACE (nu 3, p 21)", method: ACE, dataset: w-dft, settings: {cutoffRadius: {v: 5.0, loc: "Table 1"}, corrOrder: {v: 3, loc: "Table 1"}, polyDegree: {v: 21, loc: "Table 1"}}, model: "ML-MIX W ACE (3,21)"}
  whe-mace: {label: "Expensive W-He MACE: mace-mpa-0-medium fine-tuned on W-He data (multihead replay; 128 L=1 / 128 L=0 channels, 2 layers)", method: MACE, dataset: whe-dft, settings: {cutoffRadius: {v: 6.0, loc: "Table 1"}, numLayers: {v: 2, loc: "Table 1"}, numFeatures: {v: 128, loc: "Table 1"}}, model: "ML-MIX W-He MACE", base_model: {label: "mace-mpa-0-medium", relation: fine-tuned, location: "Table 1"}}
  si-cheap-dft: {label: "Cheap Si linear ACE (nu 2, p 10) fitted directly to the Si DFT data", method: ACE, dataset: si-dft, settings: {cutoffRadius: {v: 6.0, loc: "Sec. 2.1"}, corrOrder: {v: 2, loc: "Sec. 2.1"}, polyDegree: {v: 10, loc: "Sec. 2.1"}}, model: "Si ACE (2,10) on DFT"}
  fe-cheap-dft: {label: "Cheap Fe linear ACE (nu 2, p 10) fitted directly to the Fe DFT data", method: ACE, dataset: fe-dft, settings: {cutoffRadius: {v: 5.5, loc: "Sec. 2.1"}, corrOrder: {v: 2, loc: "Sec. 2.1"}, polyDegree: {v: 10, loc: "Sec. 2.1"}}, model: "Fe ACE (2,10) on DFT"}
  w-uf3-dft: {label: "Cheap W UF3 (2-body cutoff 6.0 A, 3-body 3.5 A) fitted directly to the W-He DFT data (W-only configurations)", method: UF3, dataset: whe-dft, model: "W UF3 on DFT"}
  w-cheap: {label: "Cheap W ACE (nu 3, p 14) fitted to the W DFT data", method: ACE, dataset: w-dft, settings: {cutoffRadius: {v: 5.0, loc: "Sec. 2.1"}, corrOrder: {v: 3, loc: "Sec. 2.1"}, polyDegree: {v: 14, loc: "Sec. 2.1"}}, model: "ML-MIX W ACE (3,14)"}
  si-cheap-syn: {label: "Constrained cheap Si linear ACE (nu 2, p 10) fitted to synthetic data", method: ACE, dataset: si-syn, settings: {cutoffRadius: {v: 6.0, loc: "Sec. 2.1"}, corrOrder: {v: 2, loc: "Sec. 2.1"}, polyDegree: {v: 10, loc: "Sec. 2.1"}}, model: "ML-MIX Si ACE (2,10) constrained"}
  fe-cheap-syn: {label: "Constrained cheap Fe linear ACE (nu 2, p 10) fitted to synthetic data", method: ACE, dataset: fe-syn, settings: {cutoffRadius: {v: 5.5, loc: "Sec. 2.1"}, corrOrder: {v: 2, loc: "Sec. 2.1"}, polyDegree: {v: 10, loc: "Sec. 2.1"}}, model: "ML-MIX Fe ACE (2,10) constrained"}
  w-uf3-syn: {label: "Cheap W UF3 (2-body cutoff 6.0 A, 3-body 3.5 A) fitted to synthetic data from the W-He ACE (lambda fixed at 4.3e5)", method: UF3, dataset: w-syn, model: "ML-MIX W UF3"}
  w-snap: {label: "Pure W SNAP of Wood and Thompson as distributed", method: SNAP, model: "W SNAP (Wood and Thompson)"}
results:
  - {key: si-exp-train, model: si-exp, material: si, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 2.14, meV/atom, "train energy RMSE on si: ML-MIX Si ACE (4,20)", "Table 2"], [RMSE, Force, 0.075, eV/A, "train force RMSE on si: ML-MIX Si ACE (4,20)", "Table 2"]]}
  - {key: fe-exp-train, model: fe-exp, material: fe, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 2.32, meV/atom, "train energy RMSE on fe: ML-MIX Fe ACE (3,20)", "Table 2"], [RMSE, Force, 0.083, eV/A, "train force RMSE on fe: ML-MIX Fe ACE (3,20)", "Table 2"]]}
  - {key: whe-exp-train, model: whe-exp, material: whe, role: training, eval_data: {label: "Training set: full DFT data (W-containing configurations)", location: "Table 2"}, metrics: [[RMSE, Energy, 2.15, meV/atom, "train energy RMSE on whe: ML-MIX W-He ACE (3,20)", "Table 2"], [RMSE, Force, 0.07, eV/A, "train force RMSE on whe: ML-MIX W-He ACE (3,20)", "Table 2"]]}
  - {key: w-exp-train, model: w-exp, material: w, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 1.9, meV/atom, "train energy RMSE on w: ML-MIX W ACE (3,21)", "Table 2"], [RMSE, Force, 0.066, eV/A, "train force RMSE on w: ML-MIX W ACE (3,21)", "Table 2"]]}
  - {key: whe-mace-train, model: whe-mace, material: whe, role: training, eval_data: {label: "Training set: full DFT data (W-containing configurations)", location: "Table 2"}, metrics: [[RMSE, Energy, 4.1, meV/atom, "train energy RMSE on whe: ML-MIX W-He MACE", "Table 2"], [RMSE, Force, 0.075, eV/A, "train force RMSE on whe: ML-MIX W-He MACE", "Table 2"]]}
  - {key: si-cheap-dft-train, model: si-cheap-dft, material: si, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 106.5, meV/atom, "train energy RMSE on si: Si ACE (2,10) on DFT", "Table 2"], [RMSE, Force, 0.27, eV/A, "train force RMSE on si: Si ACE (2,10) on DFT", "Table 2"]]}
  - {key: fe-cheap-dft-train, model: fe-cheap-dft, material: fe, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 18.48, meV/atom, "train energy RMSE on fe: Fe ACE (2,10) on DFT", "Table 2"], [RMSE, Force, 0.156, eV/A, "train force RMSE on fe: Fe ACE (2,10) on DFT", "Table 2"]]}
  - {key: w-uf3-dft-train, model: w-uf3-dft, material: whe, role: training, eval_data: {label: "Training set: full DFT data (W-only configurations)", location: "Table 2"}, metrics: [[RMSE, Energy, 6549, meV/atom, "train energy RMSE on whe: W UF3 on DFT", "Table 2"], [RMSE, Force, 0.16, eV/A, "train force RMSE on whe: W UF3 on DFT", "Table 2"]]}
  - {key: w-cheap-train, model: w-cheap, material: w, role: training, eval_data: {label: "Training set: full DFT data", location: "Table 2"}, metrics: [[RMSE, Energy, 4.489, meV/atom, "train energy RMSE on w: ML-MIX W ACE (3,14)", "Table 2"], [RMSE, Force, 0.116, eV/A, "train force RMSE on w: ML-MIX W ACE (3,14)", "Table 2"]]}
  - {key: si-cheap-syn-train, model: si-cheap-syn, material: si, role: training, eval_data: {label: "Training set: synthetic MD data", location: "Table 2"}, metrics: [[RMSE, Energy, 0.21, meV/atom, "train energy RMSE on si: ML-MIX Si ACE (2,10) constrained", "Table 2"], [RMSE, Force, 0.045, eV/A, "train force RMSE on si: ML-MIX Si ACE (2,10) constrained", "Table 2"]]}
  - {key: fe-cheap-syn-train, model: fe-cheap-syn, material: fe, role: training, eval_data: {label: "Training set: synthetic MD data", location: "Table 2"}, metrics: [[RMSE, Energy, 0.81, meV/atom, "train energy RMSE on fe: ML-MIX Fe ACE (2,10) constrained", "Table 2"], [RMSE, Force, 0.09, eV/A, "train force RMSE on fe: ML-MIX Fe ACE (2,10) constrained", "Table 2"]]}
  - {key: w-uf3-syn-train, model: w-uf3-syn, material: w, role: training, eval_data: {label: "Training set: synthetic MD data", location: "Table 2"}, metrics: [[RMSE, Energy, 1.02, meV/atom, "train energy RMSE on w: ML-MIX W UF3", "Table 2"], [RMSE, Force, 0.053, eV/A, "train force RMSE on w: ML-MIX W UF3", "Table 2"]]}
resources: |
  Force-evaluation speedups of the cheap over the expensive potentials: about 30x (Si ACE), 75x (W UF3), 8x (Fe ACE), 4.4x (W ACE 3,14 vs 3,21, about 5,000 atoms, CPU) and 29x (W SNAP vs W-He MACE, GPU); mixed-simulation speedups in Tables 4-5. Constrained fitting takes about 5 minutes on one CPU core.
gaps:
  - "Table 2 energy errors are per atom (column header 'meV'). The W SNAP fitting data are not public, so it has no RMSE. The W UF3 RMSEs on the full DFT data refer to a fit with identical hyperparameters directly to DFT, not the constrained model used in the mixed simulations."
  - "Speedups are ratios, not absolute timings. Elastic constants and lattice parameters (Table 3), NEB barriers, diffusion coefficients and dislocation velocities are properties."
