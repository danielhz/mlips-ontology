study_label: "Wong, Langer, Maurer and Hine (2026): long-range MLIPs (MACE-LES, MACE-POLAR, LOREM) versus local MACE for Schottky-defect energetics in SrTiO3"
scope: |
  Encoding scope: the four models trained on the SrTiO3 DFT data (bulk
  MD, 1D strain and Sr-O Schottky defect configurations; PBE, FHI-aims),
  with energy and force RMSEs relative to DFT along NEB paths at three
  Sr-O separations (Table V). Synthetic point-charge and formal-charge
  Ewald benchmarks are reported as pass/fail tables and figure panels and
  are not encoded; activation barriers are properties.
materials:
  sto: {label: "SrTiO3 bulk (MD, strain) and Sr-O Schottky defect pairs", formula: SrTiO3, class: "Oxides"}
reference:
  aims: {type: DFT, code: FHIaims, xc: PBE, comment: "Frozen core below -600 eV, non-spin-polarized"}
sampling:
  mix: {label: "Cubic SrTiO3 MD (MACE-OMAT-0 and NOMAD trajectories), 1D strains and Schottky-defect configurations at varying separations"}
datasets:
  sto: {label: "SrTiO3 DFT training data (bulk MD, strain, Schottky defects)", materials: [sto], properties: [Energy, Forces], provenance: InHouse, calc: aims, sampling: [mix]}
methods:
  MACE: {impl: {lib: MACE}, sims: [NudgedElasticBand, MolecularDynamics]}
  MACE-LES: {impl: {lib: MACE}, sims: [NudgedElasticBand]}
  MACE-POLAR: {impl: {lib: MACE}, sims: [NudgedElasticBand]}
  LOREM: {sims: [NudgedElasticBand]}
runs:
  mace: {label: "MACE trained on SrTiO3 DFT data", method: MACE, dataset: sto, model: "MACE SrTiO3 (Wong 2026)"}
