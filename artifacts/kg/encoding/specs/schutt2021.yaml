id: schutt2021
source:
  rank: 212
  year: "2021"
  first_author: "Kristof T. Schütt"
  title: "Equivariant message passing for the prediction of tensorial properties and molecular spectra"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2102.03150"
  kg_relevance: "Method/model"
  arxiv_id: "2102.03150v4"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "6dfa7b5add4dc8c5ccd799b83951b5b100bed9421bade501cdf979ccd76e5105"
study_label: "Schütt, Unke and Gastegger (2021): polarizable atom interaction neural network (PaiNN)"
scope: |
  Encoding scope: PaiNN (introduced here) with its QM9 U0 error (Table II)
  and MD17 energy and force MAEs for models trained on forces only and on
  energies and forces (Table III); the spectra models for ethanol and
  aspirin (errors only in the Fig. 5 inset). Other QM9 targets, the
  ablation (Table IV), the ferrocene study and values quoted from other
  papers are not encoded.
materials:
  qm9: {label: "Small organic molecules with up to nine heavy atoms (QM9)", class: "Small organic molecules (equilibrium geometries)"}
  aspirin: {label: "Aspirin molecule (MD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (MD17)", class: "Small organic molecule (gas phase)"}
  malondialdehyde: {label: "Malondialdehyde molecule (MD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (MD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (MD17)", class: "Small organic molecule (gas phase)"}
reference:
  aspirin-pbe0: {type: DFT, code: ORCA, xc: PBE0, basis: "def2-TZVP", comment: "Tight SCF, grid levels 4 and 5, RIJK approximation; 20,000 MD17 aspirin configurations recomputed (App. A 2)."}
  ethanol-pbe0: {type: DFT, xc: PBE0, basis: "def2-TZVP", comment: "Ethanol reference data of Ref. [38], same level without RIJK."}
datasets:
  qm9: {label: "QM9 training set (110k molecules)", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 110000, loc: "Sec. V A"}, comment: "10k validation; three random splits."}
  md17-aspirin: {label: "MD17 aspirin training set (950 structures)", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-ethanol: {label: "MD17 ethanol training set (950 structures)", materials: [ethanol], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-malondialdehyde: {label: "MD17 malondialdehyde training set (950 structures)", materials: [malondialdehyde], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-naphthalene: {label: "MD17 naphthalene training set (950 structures)", materials: [naphthalene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-salicylic-acid: {label: "MD17 salicylic acid training set (950 structures)", materials: [salicylic-acid], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-toluene: {label: "MD17 toluene training set (950 structures)", materials: [toluene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  md17-uracil: {label: "MD17 uracil training set (950 structures)", materials: [uracil], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Sec. V B"}, comment: "1k known structures: 950 training, 50 validation; three random splits."}
  spectra-aspirin: {label: "Aspirin configurations from MD17 recomputed at PBE0/def2-TZVP (20,000)", materials: [aspirin], properties: [Energy, Forces], provenance: Augmented, n: {v: 20000, loc: "App. A 2"}, calc: aspirin-pbe0, comment: "Also dipole moments and polarisabilities for IR and Raman spectra."}
  spectra-ethanol: {label: "Ethanol reference data with dipoles and polarisabilities (Ref. [38])", materials: [ethanol], properties: [Energy, Forces], provenance: Published, calc: ethanol-pbe0}
methods:
  PaiNN:
    hp: [cutoffRadius, numFeatures, learningRate, batchSize]
    loss: "Squared loss on energies and/or forces (force weight rho = 0.95 for the combined MD17 models); MAE loss for the QM9 polarisability"
    algorithm: "Adam with weight decay, learning rate halved on validation plateau (smoothed validation loss), early stopping"
    impl: {lib: {local: "SchNetPack", comment: "PaiNN implemented in PyTorch and SchNetPack; MD and RPMD with the SchNetPack MD module"}}
    sims: [MolecularDynamics]
runs:
