  painn-f-aspirin: {label: "PaiNN fit to MD17 aspirin on forces only", method: PaiNN, dataset: md17-aspirin, settings: {cutoffRadius: {v: 5.0, loc: "Suppl. Table 5"}, numFeatures: {v: 128, loc: "Sec. V"}, learningRate: {v: 0.001, loc: "Suppl. Table 5"}, batchSize: {v: 10, loc: "Suppl. Table 5"}}, model: "PaiNN MD17 aspirin model (forces only)"}
