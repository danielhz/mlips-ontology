  - {key: alphanet-task1, model: alphanet, material: omc, role: external, eval_data: {label: "OMC-bench Task 1 (large-cell out-of-distribution force/stress set)", location: "Table 1; Methods"}, metrics: [[MAE, Force, 120.1, meV/A, "OMC-bench Task 1 force MAE: AlphaNet-v1-OAM", "Table 1"], [MAE, Stress, 0.84, GPa, "OMC-bench Task 1 stress MAE: AlphaNet-v1-OAM", "Table 1"]]}
  - {key: macempa0-task1, model: macempa0, material: omc, role: external, eval_data: {label: "OMC-bench Task 1 (large-cell out-of-distribution force/stress set)", location: "Table 1; Methods"}, metrics: [[MAE, Force, 103.4, meV/A, "OMC-bench Task 1 force MAE: MACE-MPA-0", "Table 1"], [MAE, Stress, 1.09, GPa, "OMC-bench Task 1 stress MAE: MACE-MPA-0", "Table 1"]]}
