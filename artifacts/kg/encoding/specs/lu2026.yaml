id: lu2026
source:
  rank: 556
  year: "2026"
  first_author: "Muyu Lu"
  title: "OMC-bench and AtomBit-OMC: task-aligned benchmarks and robust, interpretable machine-learned interatomic potentials for organic molecular crystals"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-026-02315-3"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: ""
  pdf_version: "publisher"
  pdf_sha256: "28a4fb5b45440677f1cf59ebe475805675a3419c23c349cb967f3a69e5ff95d4"
study_label: "Lu et al. (2026): OMC-bench task-aligned benchmarks for organic molecular crystals and the AtomBit-OMC Cartesian-tensor MLIP"
scope: |
  Encoding scope: the OMC training dataset (PBE-D3(BJ), CSD-derived
  organic molecular crystals: optimization trajectories, AIMD and fixed
  displacements), 14 off-the-shelf foundation MLIPs as distributed and
  five OMC-specialized models trained from scratch (NEMP-OMC, MACE-OMC,
  MatRIS-OMC, AtomBit-OMC-s, AtomBit-OMC-l); Task 1 force and stress
  MAEs of Table 1. Phonon, thermodynamic, cocrystal-recovery and
  polymorph-ranking metrics (Tasks 2-4) are properties.
materials:
  omc: {label: "Organic molecular crystals from the CSD (H, B, C, N, O, F, P, S, Cl, Br, I; under 400 atoms per cell)", class: "Organic molecular crystal"}
reference:
  pbed3: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 600, kpoints: "Gamma-centred, KSPACING 0.4 1/A", comment: "D3(BJ) dispersion"}
sampling:
  omc: {label: "DFT geometry-optimization trajectories, AIMD at 600 K and 1 GPa, and fixed all-atom displacements (0.01-0.30 A) of CSD-derived crystals; benchmark sets by dual-objective farthest-point sampling in SOAP-UMAP space"}
datasets:
  omc: {label: "OMC training dataset (about 2.07 million configurations)", materials: [omc], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: pbed3, sampling: [omc]}
methods:
  AlphaNet: {sims: [GeometryOptimization, PhononCalculation]}
  AtomBit:
    hp: [cutoffRadius, numLayers, numFeatures, numEpochs]
    loss: "Energies, forces and stresses"
    algorithm: "OneCycle learning rate 1e-5 to 1e-3 to 1e-6, EMA 0.999, cost-aware dynamic batch sampler"
    sims: [GeometryOptimization, PhononCalculation]
  CHGNet: {sims: [GeometryOptimization, PhononCalculation]}
  DPA3: {sims: [GeometryOptimization, PhononCalculation]}
  Eqnorm: {sims: [GeometryOptimization, PhononCalculation]}
  GRACE: {sims: [GeometryOptimization, PhononCalculation]}
  MACE: {sims: [GeometryOptimization, PhononCalculation]}
  MatRIS: {sims: [GeometryOptimization, PhononCalculation]}
  NEMP: {sims: [GeometryOptimization, PhononCalculation]}
  NequIP: {sims: [GeometryOptimization, PhononCalculation]}
  Nequix: {sims: [GeometryOptimization, PhononCalculation]}
  ORB: {sims: [GeometryOptimization, PhononCalculation]}
  UMA: {sims: [GeometryOptimization, PhononCalculation]}
  eSEN: {sims: [GeometryOptimization, PhononCalculation]}
runs:
  grace1l: {label: "GRACE-1L-OAM (off-the-shelf, as distributed)", method: GRACE, model: "GRACE-1L-OAM"}
  macemp0: {label: "MACE-MP-0 (off-the-shelf, as distributed)", method: MACE, model: "MACE-MP-0"}
  alphanet: {label: "AlphaNet-v1-OAM (off-the-shelf, as distributed)", method: AlphaNet, model: "AlphaNet-v1-OAM"}
  macempa0: {label: "MACE-MPA-0 (off-the-shelf, as distributed)", method: MACE, model: "MACE-MPA-0"}
  chgnet: {label: "CHGNet (off-the-shelf, as distributed)", method: CHGNet, model: "CHGNet"}
  sevennet: {label: "SevenNet-l3i5 (off-the-shelf, as distributed)", method: NequIP, model: "SevenNet-l3i5"}
  eqnorm: {label: "Eqnorm MPtrj (off-the-shelf, as distributed)", method: Eqnorm, model: "Eqnorm MPtrj"}
  nequix: {label: "Nequix-MP (off-the-shelf, as distributed)", method: Nequix, model: "Nequix-MP"}
  dpa31: {label: "DPA-3.1-MPtrj (off-the-shelf, as distributed)", method: DPA3, model: "DPA-3.1-MPtrj"}
  orbv3: {label: "ORB v3 (conserve) (off-the-shelf, as distributed)", method: ORB, model: "ORB v3 (conserve)"}
  matrisoam: {label: "MatRIS-OAM (off-the-shelf, as distributed)", method: MatRIS, model: "MatRIS-OAM"}
  esen30m: {label: "eSEN-30M-OAM (off-the-shelf, as distributed)", method: eSEN, model: "eSEN-30M-OAM"}
  maceomol: {label: "MACE-OMol (off-the-shelf, as distributed)", method: MACE, model: "MACE-OMol"}
  umamd: {label: "UMA-md (off-the-shelf, as distributed)", method: UMA, model: "UMA-md"}
  nempomc: {label: "NEMP-OMC (trained from scratch on the OMC dataset)", method: NEMP, dataset: omc, model: "NEMP-OMC"}
  maceomc: {label: "MACE-OMC (trained from scratch on the OMC dataset)", method: MACE, dataset: omc, model: "MACE-OMC"}
  matrisomc: {label: "MatRIS-OMC (trained from scratch on the OMC dataset)", method: MatRIS, dataset: omc, model: "MatRIS-OMC"}
  atombits: {label: "AtomBit-OMC-s (trained from scratch on the OMC dataset)", method: AtomBit, dataset: omc, settings: {cutoffRadius: {v: 6, loc: "Methods (AtomBit)"}, numLayers: {v: 2, loc: "Methods (AtomBit)"}, numFeatures: {v: 64, loc: "Methods (AtomBit)"}, numEpochs: {v: 15, loc: "Methods (AtomBit)"}}, model: "AtomBit-OMC-s"}
  atombitl: {label: "AtomBit-OMC-l (trained from scratch on the OMC dataset)", method: AtomBit, dataset: omc, settings: {cutoffRadius: {v: 6, loc: "Methods (AtomBit)"}, numLayers: {v: 2, loc: "Methods (AtomBit)"}, numFeatures: {v: 128, loc: "Methods (AtomBit)"}, numEpochs: {v: 15, loc: "Methods (AtomBit)"}}, model: "AtomBit-OMC-l"}
results:
  - {key: grace1l-task1, model: grace1l, material: omc, role: external, eval_data: {label: "OMC-bench Task 1 (large-cell out-of-distribution force/stress set)", location: "Table 1; Methods"}, metrics: [[MAE, Force, 134.7, meV/A, "OMC-bench Task 1 force MAE: GRACE-1L-OAM", "Table 1"], [MAE, Stress, 0.68, GPa, "OMC-bench Task 1 stress MAE: GRACE-1L-OAM", "Table 1"]]}
