scope: |
  Encoding scope: the pretrained CHGNet (chgnet 0.3.5 package) evaluated
  against VASP (MPRelaxSet-compatible, PBE+U mixing) total energies of
  160-atom rock-salt SQS for the 56 five-cation equimolar combinations
  of Mg, Ca, Mn, Fe, Co, Ni, Cu and Zn, with the stated energy MAE, and
  its use for high-throughput descriptor screening. Bond-length MAEs,
  mixing enthalpies and the synthesis results are properties.
