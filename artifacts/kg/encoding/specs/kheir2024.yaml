id: kheir2024
source:
  rank: 373
  year: "2024"
  first_author: "Omar Abou El Kheir"
  title: "Unraveling the crystallization kinetics of the Ge2Sb2Te5 phase change compound with a machine-learned interatomic potential"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-024-01217-6"
  kg_relevance: "Application/model instance"
  arxiv_id: "2304.03109v2"
  pdf_version: "arxiv-preprint"
