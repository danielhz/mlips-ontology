study_label: "Xie and Grossman (2018): crystal graph convolutional neural networks (CGCNN) for material properties"
scope: |
  Encoding scope: CGCNN (introduced here) trained on Materials Project
  data, with the energy-valued test errors only: formation energy per atom
  with the two convolution functions (Eqs. 4, 5), absolute energy per atom
  (Table I) and the perovskite energy above hull (Fig. 3). Band gap, Fermi
  energy, elastic moduli, Poisson ratio and the metal/semiconductor
  classification are not energies or forces and are not encoded.
materials:
  mp: {label: "Inorganic crystals of the Materials Project (87 elements, 7 lattice systems, 216 space groups)", class: "Inorganic crystalline materials"}
  perovskites: {label: "ABX3 perovskite crystals (X = O, N, S, F)", class: "Perovskite oxides, nitrides, sulfides and fluorides"}
datasets:
  mp: {label: "Materials Project crystals with DFT properties (46,744 materials; 60% for training)", materials: [mp], properties: [Energy], provenance: Published, n: {v: 28046, loc: "Table I"}, comment: "46,744 materials after removing ill-converged crystals; 60% training, 20% validation, 20% test (9,350 crystals)."}
  perovskites: {label: "Perovskite energy-above-hull data set (18,928 crystals)", materials: [perovskites], properties: [Energy], provenance: Published, n: {v: 18928, loc: "Sec. on perovskites"}, comment: "Database of Ref. [26]; 3,787 test perovskites."}
methods:
  CGCNN:
    hp: [numLayers]
    loss: "Cost function J between predicted and DFT property (MAE-type regression; cross entropy for classification)"
    algorithm: "Stochastic gradient descent with backpropagation"
runs:
  cgcnn-ef-eq5: {label: "CGCNN with the gated convolution (Eq. 5) trained on formation energy per atom", method: CGCNN, dataset: mp, model: "CGCNN formation-energy model (Eq. 5 convolution)"}
  cgcnn-ef-eq4: {label: "CGCNN with the simple convolution (Eq. 4) trained on formation energy per atom", method: CGCNN, dataset: mp, model: "CGCNN formation-energy model (Eq. 4 convolution)"}
  cgcnn-eabs: {label: "CGCNN trained on absolute energy per atom", method: CGCNN, dataset: mp, model: "CGCNN absolute-energy model"}
  cgcnn-pv: {label: "CGCNN with linear pooling trained on perovskite total energy above hull", method: CGCNN, dataset: perovskites, model: "CGCNN perovskite energy-above-hull model (linear pooling, Eq. 4)"}
