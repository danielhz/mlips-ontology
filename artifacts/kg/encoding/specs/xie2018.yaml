  - {key: cgcnn-eabs, model: cgcnn-eabs, material: mp, role: test, eval_data: {label: "Materials Project test set"}, metrics: [[MAE, Energy, 0.072, null, "Test MAE of absolute energy per atom (eV/atom): CGCNN", "Table I"]]}
