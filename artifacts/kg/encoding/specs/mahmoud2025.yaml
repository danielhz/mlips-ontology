id: mahmoud2025
source:
  rank: 665
  year: "2025"
  first_author: "Chiheb Ben Mahmoud"
  title: "Assessing zero-shot generalisation behaviour in graph-neural-network interatomic potentials"
  venue: "Digital Discovery"
  doi: "10.1039/d5dd00103j"
  kg_relevance: "Application/model instance"
  arxiv_id: "2502.21317v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "a4154f5ed70e9557c14e34c5e10f9e40ba1317027ddbd0837e9e6ef3d67c4b24"
study_label: "Ben Mahmoud et al. (2025): zero-shot generalisation of graph-neural-network interatomic potentials trained on graphene-oxide data"
scope: |
  Encoding scope: GO-MACE-23 (MACE, max L = 1) used as distributed, the
  max L = 0 and max L = 2 MACE refits, and SchNet, PaiNN, TensorNet and
  NequIP models trained by the authors on the GO-MACE-23 data, with their
  zero-shot energy and force RMSEs on rMD17 molecules against rMD17's DFT
  labels (Tables 1 and 2). MACE-OFF23/24 are baselines evaluated only in
  figures.
materials:
  go: {label: "Graphene oxide sheets with hydroxyl, epoxide, aldehyde and carboxylic-acid groups and small molecules", class: "functionalised carbon (graphene oxide)"}
  rmd17: {label: "rMD17 small organic molecules (aspirin, ethanol, malonaldehyde, naphthalene, salicylic acid, toluene)", class: "small organic molecules"}
reference:
  pbe: {type: DFT, code: {local: CASTEP}, xc: PBE, comment: "On-the-fly generated pseudopotentials; GO-MACE-23 training labels (CASTEP+ML data generation)."}
datasets:
  go: {label: "GO-MACE-23 training data (graphene oxide, PBE)", materials: [go], properties: [Energy, Forces], provenance: Published, calc: pbe}
methods:
  MACE:
    hp: [cutoffRadius]
    algorithm: "GO-MACE-23 architecture with max L of the hidden equivariant features set to 0, 1 or 2"
  SchNet: {}
  PaiNN: {}
  TensorNet: {}
  NequIP: {}
runs:
  go-mace-23: {label: "GO-MACE-23 (max L = 1, 3.7 A cutoff) as distributed", method: MACE, model: "GO-MACE-23"}
  mace-l0: {label: "MACE refitted on GO-MACE-23 data with max L = 0 (invariant)", method: MACE, dataset: go, settings: {cutoffRadius: {v: 3.7, loc: "Methodology"}}, model: "GO-MACE (max L = 0)"}
  mace-l2: {label: "MACE refitted on GO-MACE-23 data with max L = 2", method: MACE, dataset: go, settings: {cutoffRadius: {v: 3.7, loc: "Methodology"}}, model: "GO-MACE (max L = 2)"}
  schnet: {label: "SchNet trained on GO-MACE-23 data (graph-pes)", method: SchNet, dataset: go, model: "SchNet (GO data)"}
  painn: {label: "PaiNN trained on GO-MACE-23 data (graph-pes)", method: PaiNN, dataset: go, model: "PaiNN (GO data)"}
  tensornet: {label: "TensorNet trained on GO-MACE-23 data (graph-pes)", method: TensorNet, dataset: go, model: "TensorNet (GO data)"}
  nequip: {label: "NequIP trained on GO-MACE-23 data (graph-pes)", method: NequIP, dataset: go, model: "NequIP (GO data)"}
results:
