id: kovacs2023
source:
  rank: 617
  year: "2023"
  first_author: "Dávid Péter Kovács"
  title: "Evaluation of the MACE force field architecture: From medicinal chemistry to materials science"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0155322"
  kg_relevance: "Method/model"
  arxiv_id: "2305.14247v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "86959a723502162d6ed4e5033f38df91b0f5f6637d89016fbc163d3cbb7b193d"
study_label: "Kovács et al. (2023): evaluation of the MACE architecture from medicinal chemistry to materials science"
scope: |
  Encoding scope: the MACE models trained in the paper and their stated
  test errors: three receptive-field variants on each of the seven MD22
  systems (Table I), the 64-0/96-1/192-2 organic models on the ANI-1x
  coupled-cluster subset tested on COMP6 (Table II), HME21 (Table III),
  the M3GNet MPF training set (Table IV), liquid water (Table V) and the
  QM9 U0 task (Table VI). Literature baselines in the same tables are not
  encoded. MACE was introduced in batatia2022; this paper is not its origin.
materials:
  tetrapeptide: {label: "MD22 Tetrapeptide", class: "large molecule or molecular assembly"}
  fattyacid: {label: "MD22 Fatty acid", class: "large molecule or molecular assembly"}
  tetrasaccharide: {label: "MD22 Tetrasaccharide", class: "large molecule or molecular assembly"}
  atat: {label: "MD22 Nucleic acid AT-AT", class: "large molecule or molecular assembly"}
  atatcgcg: {label: "MD22 Nucleic acid AT-AT-CG-CG", class: "large molecule or molecular assembly"}
  buckyball: {label: "MD22 Buckyball catcher", class: "large molecule or molecular assembly"}
  nanotube: {label: "MD22 Double-walled nanotube", class: "large molecule or molecular assembly"}
  organics: {label: "H, C, N, O organic molecules (ANI-1x / COMP6)", class: "small organic molecules"}
  hme21: {label: "HME21 disordered and regular crystals of 37 elements", class: "multi-element inorganic crystals"}
  mp: {label: "Materials Project structures of 89 elements (M3GNet MPF training set)", class: "inorganic materials"}
  water: {label: "Liquid water (64 molecules)", formula: H2O, class: "molecular liquid"}
  qm9: {label: "QM9 small organic molecules", class: "small organic molecules"}
reference:
  md22-ref: {type: DFT, comment: "MD22 published labels (not restated in this paper)."}
  ani1x-ref: {type: DFT, comment: "DFT labels of the coupled-cluster subset of ANI-1x as published (not restated); CCSD(T) labels used for transfer learning."}
  hme21-ref: {type: DFT, comment: "HME21 published labels (not restated)."}
  mpf-ref: {type: DFT, comment: "M3GNet MPF (Materials Project) published labels (not restated)."}
  water-ref: {type: DFT, code: {local: CP2K}, xc: {local: revPBE0-D3}, comment: "Data set of Cheng et al. (Ref. 60)."}
  qm9-ref: {type: DFT, comment: "QM9 published labels (not restated)."}
datasets:
  md22-tetrapeptide: {label: "MD22 Tetrapeptide (published training-set size; 95/5 train/validation)", materials: [tetrapeptide], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-fattyacid: {label: "MD22 Fatty acid (published training-set size; 95/5 train/validation)", materials: [fattyacid], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-tetrasaccharide: {label: "MD22 Tetrasaccharide (published training-set size; 95/5 train/validation)", materials: [tetrasaccharide], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-atat: {label: "MD22 Nucleic acid AT-AT (published training-set size; 95/5 train/validation)", materials: [atat], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-atatcgcg: {label: "MD22 Nucleic acid AT-AT-CG-CG (published training-set size; 95/5 train/validation)", materials: [atatcgcg], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-buckyball: {label: "MD22 Buckyball catcher (published training-set size; 95/5 train/validation)", materials: [buckyball], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  md22-nanotube: {label: "MD22 Double-walled nanotube (published training-set size; 95/5 train/validation)", materials: [nanotube], properties: [Energy, Forces], provenance: Published, calc: md22-ref}
  ani1x-cc: {label: "Coupled-cluster subset of ANI-1x with DFT energies and forces", materials: [organics], properties: [Energy, Forces], provenance: Published, calc: ani1x-ref}
  hme21: {label: "HME21 (published train/test split)", materials: [hme21], properties: [Energy, Forces], provenance: Published, calc: hme21-ref}
  mpf: {label: "M3GNet MPF training set (published train/test split)", materials: [mp], properties: [Energy, Forces, Stresses], provenance: Published, calc: mpf-ref}
  water: {label: "Liquid-water data set of Cheng et al. (1593 configurations of 64 molecules)", materials: [water], properties: [Energy, Forces], provenance: Published, n: {v: 1593, loc: "Sec. IX"}, calc: water-ref}
  qm9: {label: "QM9", materials: [qm9], properties: [Energy], provenance: Published, calc: qm9-ref}
methods:
  MACE:
    hp: [numFeatures, cutoffRadius, numLayers, bodyOrder, learningRate, batchSize]
    loss: "Weighted energy/force (and stress) loss with a two-phase scheduler switching to large energy weights; Huber loss for the M3GNet data set"
    algorithm: "lmax = 3, 8 Bessel radial features, radial MLP [64,64,64], correlation order 3 (4-body messages), AMSGrad, EMA 0.99"
    impl: {lib: MACE, comment: "github.com/ACEsuit/mace; trained on NVIDIA A100 GPUs"}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  md22-tetrapeptide-2x3: {label: "MACE 256-2, 2 x 3 A cutoff on MD22 Tetrapeptide", method: MACE, dataset: md22-tetrapeptide, settings: {numFeatures: {v: 256, loc: "App. D b"}, numLayers: {v: 2, loc: "Table I"}, cutoffRadius: {v: 3, loc: "Table I"}}, model: "MACE 256-2, 2 x 3 A cutoff (MD22 Tetrapeptide)"}
