methods:
  MACE:
    hp: [batchSize, numEpochs, learningRate]
    loss: "Force weight 10, energy weight 0.1"
    algorithm: "Naive fine-tuning of MACE-MP-0 small (MACE 0.3.6); multi-head fine-tuning for A2 and B3"
    impl: {lib: MACE}
    sims: [MolecularDynamics]
