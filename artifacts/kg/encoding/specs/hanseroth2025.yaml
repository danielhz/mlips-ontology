id: hanseroth2025
source:
  rank: 301
  year: "2025"
  first_author: "Jonas Hänseroth"
  title: "Optimizing machine learning interatomic potentials for hydroxide transport: Surprising efficiency of single-concentration training"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0284063"
  kg_relevance: "Application/model instance"
  arxiv_id: "2505.07580v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "b43088186844f388d75a7c16d9400ffa55ce00392044ba9168dc196437c157ce"
study_label: "Hänseroth and Dreßler (2025): concentration transferability of MACE-MP-0 fine-tuned on aqueous KOH"
scope: |
  Encoding scope: MACE-MP-0 (small) fine-tuned on BLYP-D3 AIMD frames of
  aqueous KOH: 2,000-frame models at six concentrations (333 K), 200-frame
  models at four concentrations and four temperatures, and combined or
  multi-head models (A1, A2, B1-B3); force and energy RMSEs against AIMD
  at the training concentration (Table I), across concentrations (Table
  S2) and for the combined models (Fig. 4). Diffusion coefficients and
  structural analyses are properties, not error metrics.
materials:
  c0p56: {label: "Aqueous KOH solution, 0.56 mol/L", class: "Aqueous alkaline electrolyte"}
  c1p13: {label: "Aqueous KOH solution, 1.13 mol/L", class: "Aqueous alkaline electrolyte"}
  c2p32: {label: "Aqueous KOH solution, 2.32 mol/L", class: "Aqueous alkaline electrolyte"}
  c6p26: {label: "Aqueous KOH solution, 6.26 mol/L", class: "Aqueous alkaline electrolyte"}
  c12p25: {label: "Aqueous KOH solution, 12.25 mol/L", class: "Aqueous alkaline electrolyte"}
  c17p89: {label: "Aqueous KOH solution, 17.89 mol/L", class: "Aqueous alkaline electrolyte"}
reference:
  blyp-d3: {type: DFT, code: {local: "CP2K"}, xc: {local: "BLYP-D3"}, pp: NormConserving, comment: "CP2K Quickstep, DZVP-MOLOPT-GTH basis, GTH-BLYP pseudopotentials, Grimme D3; NVT AIMD with Nose-Hoover chains, 0.5 fs step."}
sampling:
