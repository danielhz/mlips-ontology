  mace: {label: "MACE universal MLIP as distributed (version not stated)", method: MACE, model: "MACE pretrained universal model (version not stated)"}
  sevennet: {label: "SevenNet universal MLIP as distributed (version not stated)", method: NequIP, model: "SevenNet pretrained universal model (version not stated)"}
