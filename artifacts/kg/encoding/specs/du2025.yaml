study_label: "Du et al. (2025): benchmark of universal MLIPs for solid-state electrolytes"
scope: |
  Encoding scope: the six pretrained universal MLIPs evaluated (MatterSim,
  MACE, SevenNet, ORB, CHGNet, M3GNet; checkpoints not identified), their
  energy and force MAEs on the non-equilibrium halide-electrolyte test
  data stated in Sec. 3.2, and the DFT-labelled SSE data set built for the
  benchmark. Errors per sulfide/oxide system, near-equilibrium ranges,
  formation-energy, hull-energy, elastic-moduli and diffusivity benchmarks
  are shown in figures or given as ranges and are not encoded; the
  MatterSim application studies of Li3YCl6 and Li6PS5Cl are not encoded.
materials:
  halides: {label: "Halide solid-state electrolytes (six systems; heated DeePMD trajectories, 100-1100 K)", class: "Lithium halide solid electrolytes"}
  sse: {label: "Sulfide, halide and oxide solid-state electrolytes (18 systems, 17 elements)", class: "Lithium solid-state electrolytes"}
reference:
  sse-dft: {type: DFT, code: VASP, pp: PAW, cutoff: 600, kpoints: "KSPACING = 0.3", comment: "PBE functional consistent with the uMLIP training data (Sec. 3.1); 0.01 eV/A relaxation convergence."}
sampling:
  aimd-deepgen: {label: "Randomly perturbed structures sampled by short AIMD, then NPT MD at 100-1100 K and 0-2 GPa (AIMD and DeepGen)"}
datasets:
  sse: {label: "SSE energy and force benchmark set (1,980 DFT-labelled snapshots of 18 systems)", materials: [sse, halides], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 1980, loc: "Sec. 3.1"}, calc: sse-dft, sampling: [aimd-deepgen]}
methods:
  CHGNet: {sims: [MolecularDynamics, GeometryOptimization]}
