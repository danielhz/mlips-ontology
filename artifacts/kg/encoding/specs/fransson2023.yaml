resources: |
  About 2e7 atom-steps per second on one NVIDIA A100 for these NEP models (Methods).
gaps:
  - "Virial RMSEs are in meV/atom (recorded as Stress with unit null). Ensemble (90/10 split) training and validation errors are in SI Table S1. The data-set sizes are not given in the main text."
  - "The throughput (about 2e7 atom-steps per second, 60,000 atoms for about 150 ns per day) is stated for the NEP models generally, not for one model, so it is kept in resources only."
