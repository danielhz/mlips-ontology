id: liu2026evaluation
source:
  rank: 274
  year: "2026"
  first_author: "Ryan Liu"
  title: "From Evaluation to Design: Using Potential Energy Surface Smoothness Metrics to Guide Machine Learning Interatomic Potential Architectures"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2602.04861"
  kg_relevance: "Application/model instance"
  arxiv_id: "2602.04861v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "695944b622bcd5d236f8a4145160a3e9d08ecdaa70520980640fd3a6f057145d"
study_label: "Liu et al. (2026): Bond Smoothness Characterization Test (BSCT) and the MinDScAIP architecture"
scope: |
  Encoding scope: the MinDScAIP attention-based MLIP introduced here,
  trained on SPICE (MACE-OFF split) in the ablations of Table 2 (smoothness
  designs, prediction heads, model sizes) with the MACE and GemNet-T
  baselines, its per-subset SPICE test errors (Table 4), the MPtrj-trained
  MinDScAIP-60M on Matbench Discovery (Table 5) and the inference
  throughput benchmark (Table 6). The BSCT force-smoothness deviation (FSD),
  NVE energy drift, F1, kappa_SRME and RMSD are not error metrics of the
  schema and are not encoded; other models' Table 4 and Table 5 values are
  quoted from the literature and leaderboard and are not encoded.
materials:
  spice: {label: "SPICE drug-like molecules, peptides, dimers and water clusters (MACE-OFF split)", class: "Organic molecules and molecular clusters"}
  mptrj: {label: "Materials Project relaxation trajectories (inorganic crystals)", class: "Inorganic crystals"}
  wbm: {label: "WBM test set of Matbench Discovery (inorganic crystals)", class: "Inorganic crystals"}
  diamond: {label: "Diamond supercells (216 to 2,744 atoms)", formula: "C", class: "Elemental covalent solid", wikidata: Q623}
datasets:
  spice: {label: "SPICE training split of MACE-OFF", materials: [spice], properties: [Energy, Forces], provenance: Published}
  mptrj: {label: "MPtrj", materials: [mptrj], properties: [Energy, Forces, Stresses], provenance: Published}
methods:
  MinDScAIP:
    hp: [numFeatures, numLayers, numRadialBasis, cutoffRadius, batchSize, numEpochs]
    loss: "Energy (weight 1) and force (weight 2; 4 when fine-tuning on MPtrj) MAE-type loss, stress weight 10 on MPtrj"
    algorithm: "Weight decay, EMA 0.999, gradient clipping 100; MPtrj models pretrained with direct forces and DeNS, then fine-tuned with gradient forces"
    impl: {lib: {local: "fairchem", comment: "Diff-kNN released in the fairchem repository"}}
    sims: [MolecularDynamics, GeometryOptimization, PhononCalculation]
  MACE: {sims: [MolecularDynamics]}
  GemNet: {sims: [MolecularDynamics]}
  eSEN: {}
