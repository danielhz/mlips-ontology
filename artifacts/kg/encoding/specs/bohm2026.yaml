  first_author: "Jonas Böhm"
  title: "Predicting Crystal Structures and Ionic Conductivities in Li 3 YCl 6−x Br x Halide Solid Electrolytes Using a Fine‐Tuned Machine Learning Interatomic Potential"
  venue: "Advanced Intelligent Systems"
  doi: "10.1002/aisy.202501382"
