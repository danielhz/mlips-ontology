id: fan2022
source:
  rank: 250
  year: "2022"
  first_author: "Zheyong Fan"
  title: "GPUMD: A package for constructing accurate machine-learned potentials and performing highly efficient atomistic simulations"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0106617"
  kg_relevance: "Software/implementation"
  arxiv_id: "2205.10046v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "55cb9c2a457852b32d2f3ce2a385d12c10372bd92c0ace6181100cdc6ee4cefe"
study_label: "Fan et al. (2022): GPUMD, NEP3 machine-learned potentials and comparison with DP, GAP, MTP and REANN"
scope: |
  Encoding scope: the NEP2 and NEP3 models for the MgAlCu alloy (Table I)
  and the carbon comparison of Table II (NEP3 at two cutoffs against DP,
  GAP, MTP and REANN, with RMSEs on the 450-structure test set and the MD
  speed of each potential). The silicon and azobenzene comparisons (Figs. 4
  and 5, figure-only values), the active-learning study (Fig. 9), the
  diamond properties of Table III and the heat-transport applications are
  not encoded.
materials:
  MgAlCu: {label: "Mg-Al-Cu alloys in the full concentration space", formula: "MgAlCu", class: "Ternary metallic alloy"}
  C: {label: "Carbon (bulk crystals, liquid and amorphous bulk, amorphous surfaces, dimers)", formula: "C", class: "Elemental solid and liquid carbon", wikidata: Q623}
datasets:
  MgAlCu: {label: "MgAlCu data set of Ref. [122] (141,409 structures; 90% training, 10% test)", materials: [MgAlCu], properties: [Energy, Forces, Virials], provenance: Published, n: {v: 141409, loc: "Sec. III A"}, comment: "Previously used for a Deep Potential (Jiang et al., Chin. Phys. B 30, 050706 (2021))."}
  C-train: {label: "Carbon training set of Ref. [10] (4,080 structures, 256,628 atoms)", materials: [C], properties: [Energy, Forces, Virials], provenance: Published, n: {v: 4080, loc: "Sec. III B 3"}, comment: "Deringer and Csanyi, Phys. Rev. B 95, 094203 (2017); DFT-LDA reference; some structures carry virials."}
hyperparameters:
  Nneu: {label: "NEP number of neurons in the hidden layer N_neu", name: "N_neu", datatype: integer}
  Ngen: {label: "NEP maximum number of generations of the separable natural evolution strategy N_gen", name: "N_gen", datatype: integer}
methods:
  NEP:
    hp: [cutoffRadius, angularCutoff, Nneu, Ngen, batchSize]
    loss: "Energy, force and virial RMSEs plus L1 and L2 regularisation"
    algorithm: "Separable natural evolution strategy (SNES), population 50"
    impl: {lib: {local: "GPUMD", comment: "nep executable of the open-source gpumd package (GPU)"}}
    sims: [MolecularDynamics]
  DeePMD:
    hp: [cutoffRadius, angularCutoff]
    impl: {lib: DeePMDkit}
    sims: [MolecularDynamics]
  GAP:
    sims: [MolecularDynamics]
  MTP:
    hp: [cutoffRadius, momentLevel]
    impl: {lib: MLIP}
    sims: [MolecularDynamics]
  REANN:
    hp: [cutoffRadius, batchSize, numEpochs]
    impl: {lib: {local: "REANN", comment: "reann package (PyTorch)"}}
    sims: [MolecularDynamics]
