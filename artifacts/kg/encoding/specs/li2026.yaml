study_label: "Li et al. (2026): melt-quench failures of universal MLIPs for amorphous IrO2 and practical remedies"
scope: |
  Encoding scope: eight universal MLIPs (Table S1) and an IrO2 MTP used in
  melt-quench MD of amorphous IrO2, the UPET (PET-OAM-XL) energy, mean-force
  and pressure errors against AIMD configurations before and after
  pressure-targeted fine-tuning (Fig. 4). Densities and the 30-material
  density benchmark (Table S2) are properties, not error metrics.
materials:
  a-iro2: {label: "Amorphous IrO2 (96-atom AIMD cells and melt-quench models)", formula: "IrO2", class: "Amorphous oxide electrocatalyst"}
reference:
  aimd: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 400, kpoints: "Gamma point", comment: "NPT melt-quench AIMD (Parrinello-Rahman, Langevin): 3000 K melt, quench to 100 K over 5 ps, 300 K equilibration; EDIFF 1e-5."}
  static: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, kpoints: "Monkhorst-Pack with k_i |a_i| >= 20 A", comment: "Static references for configurations from MLIP trajectories."}
sampling:
  aimd-traj: {label: "Configurations from the IrO2 AIMD melt-quench trajectory"}
  mtp-al: {label: "AIMD snapshots of rutile (120 atoms) and disordered (96 atoms) IrO2 at 300-2500 K with +-5% strain, then learning-on-the-fly active learning in NVT and NPT melt-quench"}
datasets:
  aimd-ft: {label: "IrO2 AIMD configurations for UPET fine-tuning (0.8/0.1/0.1 split)", materials: [a-iro2], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: aimd, sampling: [aimd-traj]}
  mtp-train: {label: "IrO2 MTP training set (1,800 initial DFT snapshots plus active-learning additions)", materials: [a-iro2], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: static, sampling: [mtp-al]}
