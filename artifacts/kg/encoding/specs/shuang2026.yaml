id: shuang2026
source:
  rank: 293
  year: "2026"
  first_author: "Fei Shuang"
  title: "Benchmarking chemically scalable machine-learning interatomic potentials for large-scale simulations of multicomponent alloys"
  venue: "Physical Review Materials"
  doi: "10.1103/1qc9-ypyb"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2604.01642v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "58e732484866d56ad935e3bde924e966c9710cd56db4b163f1def4d2bcf1489a"
study_label: "Shuang et al. (2026): benchmarking UNEP-v1 (NEP) and GRACE potentials for 16 metals and their multicomponent alloys"
scope: |
  Encoding scope: the published UNEP-v1 NEP4 model and the GRACE-FS-S/M/L
  and GRACE-2L models trained here on the UNEP-v1 data set of 16 metals and
  their binary alloys, with training and test energy, force and stress
  MAEs and RMSEs (Tables I and II), the training cost of GRACE-FS-M (Fig.
  1d) and the stated inference speeds (Fig. 3). Ensemble averages (Table
  III), uncertainty correlations, MD energy drift and the spall simulations
  are not encoded.
materials:
  metals16: {label: "16 elemental metals (Ag, Al, Au, Cr, Cu, Mg, Mo, Ni, Pb, Pd, Pt, Ta, Ti, V, W, Zr) and their alloys under diverse deformation states", class: "Metals and multicomponent alloys"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, kpoints: "Monkhorst-Pack, reciprocal density 2 pi x 0.03 1/A (VASPKIT)", comment: "EDIFF 1e-6 eV (for newly generated configurations)."}
datasets:
  unep: {label: "UNEP-v1 training set of Ref. [38] (16 metals, unary and binary structures)", materials: [metals16], properties: [Energy, Forces, Virials], provenance: Published, calc: pbe, comment: "Zenodo 10.5281/zenodo.11533864."}
methods:
  NEP:
    impl: {lib: {local: "GPUMD", comment: "GPUMD v5.0 for inference benchmarks"}}
    sims: [MolecularDynamics]
  GRACE:
    hp: [cutoffRadius]
    impl: {lib: {local: "gracemaker", comment: "GRACE / tensorpotential; LAMMPS with Kokkos"}}
    sims: [MolecularDynamics]
runs:
  unep-v1: {label: "UNEP-v1 (NEP4) as published in Ref. [38] (not retrained)", method: NEP, model: "UNEP-v1 (70,401 parameters)"}
  grace-fs-s: {label: "GRACE-FS-S trained on the UNEP-v1 data", method: GRACE, dataset: unep, settings: {cutoffRadius: {v: 6, loc: "Methods"}}, model: "GRACE-FS-S (9,312 parameters)"}
  grace-fs-m: {label: "GRACE-FS-M trained on the UNEP-v1 data", method: GRACE, dataset: unep, settings: {cutoffRadius: {v: 6, loc: "Methods"}}, model: "GRACE-FS-M (17,824 parameters)", gpuHours: {v: 24, loc: "Fig. 1d"}, trainingHardware: "Single NVIDIA A100 GPU, converged within one day in fewer than 2,000 epochs"}
  grace-fs-l: {label: "GRACE-FS-L trained on the UNEP-v1 data", method: GRACE, dataset: unep, settings: {cutoffRadius: {v: 6, loc: "Methods"}}, model: "GRACE-FS-L (28,592 parameters)"}
  grace-2l: {label: "GRACE-2L (two-layer graph model) trained on the UNEP-v1 data", method: GRACE, dataset: unep, settings: {cutoffRadius: {v: 6, loc: "Methods"}}, model: "GRACE-2L (1,289,704 parameters)"}
