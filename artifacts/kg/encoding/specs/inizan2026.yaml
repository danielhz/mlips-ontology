id: inizan2026
source:
  rank: 354
  year: "2026"
  first_author: "Théo Jaffrelot Inizan"
  title: "uMOF: A Universal Database, Benchmark, and Machine Learning Interatomic Potentials for Metal-Organic Frameworks"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2608.28100"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2608.28100v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "0868d94d469f3a07bd4a152da09999d78369d88906c29938ef508ef63d376d1f"
study_label: "Inizan et al. (2026): uMOF, an r2SCAN-D4 data set, experimental benchmark and fine-tuned MACE potentials for metal-organic frameworks"
scope: |
  Encoding scope: the uMOF r2SCAN-D4 data set (h5_mof, 85,524
  configurations of 19,950 MOFs, 79 elements; 68,394 / 8,470 / 8,660
  train / validation / test frames), the two fine-tuned models uMOF-MH
  (from the r2SCAN head of MACE-MH-1) and uMOF-POLAR (from
  MACE-POLAR-1-M) with their held-out validation RMSEs (Table 3), the
  Cu-MOF MD ablation (Tables 4 and 5), and the foundation baselines
  MACE-MH-1, MACE-POLAR-1-M and MACE-MP-MOF0-v2. The literature-mined
  experimental benchmark (3,986 property records) and the Tier-1 to
  Tier-3 property errors are properties, not energy/force errors.
materials:
  mof: {label: "Metal-organic frameworks (QMOF and ~90 named experimental MOFs), empty and loaded with six gas adsorbates, plus isolated atoms and molecules", class: "Metal-organic frameworks"}
reference:
  r2scand4: {type: DFT, code: VASP, xc: {local: "r2SCAN-D4"}, pp: PAW, cutoff: 680, comment: "VASP 6.4.2 via atomate2 (MatPES meta-GGA static settings), EDIFF 1e-5, LREAL False, spin polarization only for open-shell metals (Sec. 2.1.1)."}
sampling:
  noise: {label: "Gaussian-noise perturbations of QMOF structures (sigma about 0.06 A), relaxation and equation-of-state trajectories, finite-temperature MD (Cu-MOF, temperature-sampled and empty-framework sets), adsorbate-loaded frameworks"}
datasets:
  umof: {label: "uMOF h5_mof (r2SCAN-D4; 68,394 train / 8,470 validation / 8,660 test frames)", materials: [mof], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 85524, loc: "Table 1"}, calc: r2scand4, sampling: [noise]}
  umof-nocu: {label: "uMOF h5_mof training frames without the Cu-MOF MD subset (ablation)", materials: [mof], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 67248, loc: "Table 4"}, calc: r2scand4, sampling: [noise]}
methods:
  MACE:
    loss: "Two stages with stochastic weight averaging; force/stress-weighted second stage; replay head of the foundation training kept"
    impl: {lib: MACE}
    sims: [GeometryOptimization, PhononCalculation, MolecularDynamics, MonteCarlo]
  MACE-POLAR:
    sims: [GeometryOptimization, PhononCalculation, MolecularDynamics, MonteCarlo]
runs:
  mace-mh1: {label: "MACE-MH-1 as distributed (r2SCAN MatPES head)", method: MACE, model: "mace-mh-1"}
  umof-mh: {label: "uMOF-MH: MACE-MH-1 r2SCAN head fine-tuned on uMOF (r2SCAN-D4)", method: MACE, dataset: umof, model: "uMOF-MH", base_model: {run: mace-mh1, relation: fine-tuned, location: "Sec. 3; Table 3"}}
  mace-polar: {label: "MACE-POLAR-1-M as distributed (OMol, wB97M-V)", method: MACE-POLAR, model: "MACE-POLAR-1-M"}
  umof-polar: {label: "uMOF-POLAR: MACE-POLAR-1-M fine-tuned on uMOF (r2SCAN-D4)", method: MACE-POLAR, dataset: umof, model: "uMOF-POLAR", base_model: {run: mace-polar, relation: fine-tuned, location: "Sec. 3; Table 3"}}
  mof0: {label: "MACE-MP-MOF0 v2 as distributed (PBE+D3(BJ) MOF fine-tune of MACE-MP-0b)", method: MACE, model: "MACE-MP-MOF0-v2", base_model: {label: "MACE-MP-0b", relation: fine-tuned, location: "Sec. 3; Table 3"}}
  abl-with: {label: "MD ablation: MACE-MH-1 fine-tune with the Cu-MOF MD subset", method: MACE, dataset: umof, model: "uMOF-MH ablation, with Cu-MOF MD", base_model: {run: mace-mh1, relation: fine-tuned, location: "Table 4"}}
  abl-without: {label: "MD ablation: identical MACE-MH-1 fine-tune without the Cu-MOF MD subset", method: MACE, dataset: umof-nocu, model: "uMOF-MH ablation, without Cu-MOF MD", base_model: {run: mace-mh1, relation: fine-tuned, location: "Table 4"}}
