study_label: "Barroso-Luque et al. (2024): Open Materials 2024 (OMat24) data set and models"
scope: |
  Encoding scope: the OMat24 data set and the sAlex subset of Alexandria
  introduced here, and the eight eSEN and EquiformerV2 models of the
  Matbench Discovery comparison (Table 2): pretrained on OMat24 or OC20
  and fine-tuned on MPtrj or on MPtrj and sAlex. Their energy-above-hull
  MAE, RMSE and R2 are encoded; the classification scores, the thermal-
  conductivity SRME, the softening analysis and the MPtrj-only models of
  the SI are not.
materials:
  inorganic: {label: "Inorganic materials across the periodic table (OMat24, from Alexandria structures)", class: "Inorganic crystalline materials (equilibrium and non-equilibrium)"}
  wbm: {label: "Inorganic crystals of the WBM test set (Matbench Discovery)", class: "Inorganic crystalline materials"}
reference:
  omat-dft: {type: DFT, code: VASP, xc: PBE, pp: PAW, comment: "Materials Project defaults (MPRelaxSet) with PBE 54 pseudopotentials and ALGO Normal; Hubbard U for oxides and fluorides containing Co, Cr, Fe, Mn, Mo, Ni, V or W (Sec. 4.2)."}
sampling:
  rattled-boltzmann: {label: "Rattled Boltzmann sampling of Alexandria structures"}
  rattled-relax: {label: "Rattled relaxations of Alexandria structures"}
  aimd: {label: "Short AIMD runs (50 steps of 2 fs)", comment: "Time step chosen for diversity rather than accurate integration (Sec. 4.2)."}
datasets:
  omat24: {label: "OMat24 training split (100,824,585 structures)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 100824585, loc: "Table 1"}, calc: omat-dft, sampling: [rattled-boltzmann, rattled-relax, aimd], comment: "118 million structures in total with validation, WBM, ID, OOD-composition and OOD-element test splits; released under CC-BY 4.0."}
  mptrj: {label: "MPtrj", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published}
  mptrj-salex: {label: "MPtrj combined with sAlex (subsampled Alexandria, 10 million training structures)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Augmented, comment: "sAlex removes Alexandria trajectories matching WBM prototypes and structures with energy > 0 eV, force norm > 50 eV/A or stress > 80 GPa, keeping frames differing by more than 10 meV/atom (Sec. 4.3)."}
hyperparameters:
  Lmax: {label: "Maximum degree Lmax of the equivariant features", name: "Lmax", datatype: integer}
methods:
  EquiformerV2:
    hp: [cutoffRadius, numLayers, numRadialBasis, Lmax, learningRate, batchSize, numEpochs]
    loss: "Weighted energy, force and stress loss (coefficients 20, 20, 5) with optional DeNS denoising objective"
    algorithm: "AdamW with cosine schedule, EMA 0.999"
    impl: {lib: {local: "fairchem", comment: "https://github.com/FAIR-Chem/fairchem, MIT licence"}}
  eSEN:
    hp: [cutoffRadius, learningRate, batchSize, numEpochs]
    loss: "Energy, force and stress loss; direct-force pretraining followed by conservative fine-tuning"
    impl: {lib: {local: "fairchem"}}
runs:
