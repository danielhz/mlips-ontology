  eqv2-m-oam: {label: "eqV2-M pretrained on OMat24, fine-tuned on MPtrj-sAlex", method: EquiformerV2, dataset: mptrj-salex, settings: {cutoffRadius: {v: 12, loc: "Table G.1"}, numLayers: {v: 10, loc: "Table G.1"}, numRadialBasis: {v: 600, loc: "Table G.1"}, Lmax: {v: 6, loc: "Table G.1"}, learningRate: {v: 0.0002, loc: "Table G.2 (OAM fine-tuning)"}, batchSize: {v: 256, loc: "Table G.2"}, numEpochs: {v: 8, loc: "Table G.2"}}, registry: eqV2-M, base_model: {label: "eqV2-M pretrained on OMat24", relation: fine-tuned, location: "Sec. 2.2.1, Table 2"}}
