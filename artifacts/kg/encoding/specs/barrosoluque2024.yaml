id: barrosoluque2024
source:
  rank: 221
  year: "2024"
  first_author: "Luis Barroso-Luque"
  title: "Open Materials 2024 (OMat24) Inorganic Materials Dataset and Models"
  venue: "arXiv"
  doi: "10.48550/arxiv.2410.12771"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2410.12771v2"
  pdf_version: "arxiv-preprint"
