  eqv2-s-omp: {label: "eqV2-S pretrained on OMat24, fine-tuned on MPtrj", method: EquiformerV2, dataset: mptrj, settings: {cutoffRadius: {v: 12, loc: "Table G.1"}, numLayers: {v: 8, loc: "Table G.1"}, numRadialBasis: {v: 600, loc: "Table G.1"}, Lmax: {v: 4, loc: "Table G.1"}}, model: "eqV2-S pretrained on OMat24, fine-tuned on MPtrj", base_model: {label: "eqV2-S pretrained on OMat24", relation: fine-tuned, location: "Sec. 2.2.1, Table 2"}}
