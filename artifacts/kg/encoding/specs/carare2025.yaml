study_label: "Cărare et al. (2025): Landscape17, kinetic transition networks of rMD17 molecules as a test and training arena for MLIPs"
scope: |
  Encoding scope: the Landscape17 data set introduced here (wB97X/6-31G(d)
  minima, transition states and approximate steepest-descent pathways of
  six rMD17 molecules), NequIP, MACE and Allegro models trained per molecule
  on rMD17 only (N-L) or on rMD17 plus 40% of the Landscape17 pathways (L),
  and the pretrained ANI2x, AIMNet2, MACE-MP-0b3 (medium) and SO3LR used to
  construct MLIP energy landscapes. All errors are given in figures or in
  Supplementary Tables S2-S5 that are not part of the PDF, so no metric is
  encoded.
materials:
  rmd17-mols: {label: "Ethanol, malonaldehyde, salicylic acid, azobenzene, paracetamol and aspirin (rMD17 molecules with several minima)", class: "Small organic molecules (gas phase)"}
reference:
  wb97x: {type: DFT, code: {local: "Psi4"}, xc: wB97X, basis: "6-31G(d)", comment: "Restricted Kohn-Sham, energy and density convergence 1e-9, (100, 770) integration grid; basin hopping, TopSearch/OPTIM transition-state searches."}
sampling:
  dps: {label: "Basin-hopping global optimisation and single- and double-ended transition-state searches (discrete path sampling), with approximate steepest-descent paths from each transition state"}
datasets:
  landscape17: {label: "Landscape17: 28 minima, 67 transition states and pathway configurations of six rMD17 molecules with energies, forces and Hessian eigenspectra", materials: [rmd17-mols], properties: [Energy, Forces], provenance: InHouse, calc: wb97x, sampling: [dps], comment: "Estimated cost above 1e5 CPU hours; publicly available (Ref. [80])."}
  rmd17-train: {label: "rMD17 training split (950/50 split as in the original papers) for the six molecules", materials: [rmd17-mols], properties: [Energy, Forces], provenance: Published}
  rmd17-l: {label: "rMD17 training split plus 40% of the Landscape17 pathway configurations (up to 500 structures per molecule)", materials: [rmd17-mols], properties: [Energy, Forces], provenance: Augmented, calc: wb97x}
external_models: [ANI-2x, MACE-MP-0b3-medium]
methods:
  NequIP: {sims: [GeometryOptimization, NudgedElasticBand]}
