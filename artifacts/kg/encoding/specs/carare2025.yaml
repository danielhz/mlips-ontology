  Allegro: {sims: [GeometryOptimization, NudgedElasticBand]}
  ANI: {sims: [GeometryOptimization, NudgedElasticBand]}
  AIMNet2: {sims: [GeometryOptimization, NudgedElasticBand]}
  SO3LR: {sims: [GeometryOptimization, NudgedElasticBand]}
runs:
  nequip-nl: {label: "NequIP trained per molecule on rMD17 (non-landscape, N-L)", method: NequIP, dataset: rmd17-train, model: "NequIP N-L models (one per molecule)"}
  nequip-l: {label: "NequIP trained per molecule on rMD17 plus Landscape17 pathways (L)", method: NequIP, dataset: rmd17-l, model: "NequIP L models (one per molecule)"}
  mace-nl: {label: "MACE trained per molecule on rMD17 (N-L)", method: MACE, dataset: rmd17-train, model: "MACE N-L models (one per molecule)"}
  mace-l: {label: "MACE trained per molecule on rMD17 plus Landscape17 pathways (L)", method: MACE, dataset: rmd17-l, model: "MACE L models (one per molecule)"}
  allegro-nl: {label: "Allegro trained per molecule on rMD17 (N-L)", method: Allegro, dataset: rmd17-train, model: "Allegro N-L models (one per molecule)"}
  allegro-l: {label: "Allegro trained per molecule on rMD17 plus Landscape17 pathways (L)", method: Allegro, dataset: rmd17-l, model: "Allegro L models (one per molecule)"}
  aimnet2: {label: "AIMNet2 as distributed", method: AIMNet2, model: "AIMNet2"}
  so3lr: {label: "SO3LR as distributed", method: SO3LR, model: "SO3LR"}
results: []
resources: |
  ANI2x and AIMNet2 were evaluated on single CPUs, the other models on
  single NVIDIA A100 GPUs; the DFT landscapes cost more than 1e5 CPU hours.
  No MLIP timings are given.
gaps:
  - "Energy and force RMSEs on stationary points and test sets are shown only as relative errors in Fig. 2 and in Supplementary Tables S2-S5, which are not in the PDF; counts of unphysical and matched stationary points (Figs. 3, 4) are not error metrics."
  - "The system-specific models are trained per molecule with the hyperparameters of their original publications (not restated); each run stands for six per-molecule models. SO3LR is a new registry method (method paper not in the corpus); GFN2-xTB is semi-empirical and not encoded."
