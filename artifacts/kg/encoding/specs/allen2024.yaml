  ccx-tl-tz: {label: "ANI trained on ANI-1x wB97x/def2-TZVPP and transfer-learned to ANI-1ccx", method: ANI, dataset: ani1ccx, model: "ANI-1ccx refit after training on ANI-1x (def2-TZVPP)", base_model: {label: "ANI trained on ANI-1x wB97x/def2-TZVPP", relation: fine-tuned, location: "Sec. III C"}}
  multi-meta: {label: "ANI meta-learned on the six organic data sets (pre-trained model)", method: ANI, dataset: multi, model: "Meta-learning organic pre-trained ANI potential"}
  ccx-multi-meta: {label: "Meta-learned organic ANI potential refitted to ANI-1ccx", method: ANI, dataset: ani1ccx, model: "ANI-1ccx refit after organic meta-learning", base_model: {run: multi-meta, relation: fine-tuned, location: "Sec. III C"}}
  ccx-multi-k1: {label: "ANI jointly pre-trained (k = 1) on the six organic data sets and refitted to ANI-1ccx", method: ANI, dataset: ani1ccx, model: "ANI-1ccx refit after organic k = 1 pre-training", base_model: {label: "ANI jointly pre-trained (k = 1) on the six organic data sets", relation: fine-tuned, location: "Sec. III C"}}
  s1-ani1x-dz: {label: "ANI pre-trained on 10,000 structures of ANI-1x dz (wB97x/6-31G*) and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on ANI-1x dz (wB97x/6-31G*)", base_model: {label: "ANI pre-trained on ANI-1x dz (wB97x/6-31G*)", relation: fine-tuned, location: "Table S1"}}
  s1-ani1x-tz: {label: "ANI pre-trained on 10,000 structures of ANI-1x tz (wB97x/def2-TZVPP) and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on ANI-1x tz (wB97x/def2-TZVPP)", base_model: {label: "ANI pre-trained on ANI-1x tz (wB97x/def2-TZVPP)", relation: fine-tuned, location: "Table S1"}}
  s1-geom: {label: "ANI pre-trained on 10,000 structures of GEOM and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on GEOM", base_model: {label: "ANI pre-trained on GEOM", relation: fine-tuned, location: "Table S1"}}
  s1-t1x: {label: "ANI pre-trained on 10,000 structures of Transition-1x and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on Transition-1x", base_model: {label: "ANI pre-trained on Transition-1x", relation: fine-tuned, location: "Table S1"}}
  s1-qm7x: {label: "ANI pre-trained on 10,000 structures of QM7-x and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on QM7-x", base_model: {label: "ANI pre-trained on QM7-x", relation: fine-tuned, location: "Table S1"}}
  s1-qmugs: {label: "ANI pre-trained on 10,000 structures of QMugs and refitted to CCSD(T) (Table S1)", method: ANI, dataset: ani1ccx, model: "CCSD(T) refit after pre-training on QMugs", base_model: {label: "ANI pre-trained on QMugs", relation: fine-tuned, location: "Table S1"}}
