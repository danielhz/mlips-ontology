  - {key: mofs-mil-140, model: nq-mofs, material: mofs, role: test, eval_data: {label: "MIL-140 test configurations at 600 K", location: "Table 1"}, metrics: [[MAE, Force, 22.6, meV/A, "test force MAE on MIL-140: NequIP ten MOFs", "Table 1"], [MAE, Stress, 0.0585, GPa, "test stress MAE on MIL-140: NequIP ten MOFs", "Table 1 (58.5 MPa)"]]}
  - {key: mofs-mof-808, model: nq-mofs, material: mofs, role: test, eval_data: {label: "MOF-808 test configurations at 600 K", location: "Table 1"}, metrics: [[MAE, Force, 40.0, meV/A, "test force MAE on MOF-808: NequIP ten MOFs", "Table 1"], [MAE, Stress, 0.018, GPa, "test stress MAE on MOF-808: NequIP ten MOFs", "Table 1 (18.0 MPa)"]]}
  - {key: mofs-bd899c1, model: nq-mofs, material: mofs, role: test, eval_data: {label: "BD899C1 test configurations at 600 K", location: "Table 1"}, metrics: [[MAE, Force, 25.9, meV/A, "test force MAE on BD899C1: NequIP ten MOFs", "Table 1"], [MAE, Stress, 0.0652, GPa, "test stress MAE on BD899C1: NequIP ten MOFs", "Table 1 (65.2 MPa)"]]}
  - {key: mofs-mil-53, model: nq-mofs, material: mil53, role: external, eval_data: {label: "MIL-53 test configurations at 600 K (framework not in training)", location: "Table 1"}, metrics: [[MAE, Force, 24.7, meV/A, "test force MAE on MIL-53: NequIP ten MOFs", "Table 1"], [MAE, Stress, 0.1072, GPa, "test stress MAE on MIL-53: NequIP ten MOFs", "Table 1 (107.2 MPa)"]]}
  - {key: mofs-uio-66-bdc, model: nq-mofs, material: uio66, role: external, eval_data: {label: "UiO-66[BDC] test configurations at 600 K (framework not in training)", location: "Table 1"}, metrics: [[MAE, Force, 21.3, meV/A, "test force MAE on UiO-66[BDC]: NequIP ten MOFs", "Table 1"], [MAE, Stress, 0.0317, GPa, "test stress MAE on UiO-66[BDC]: NequIP ten MOFs", "Table 1 (31.7 MPa)"]]}
resources: |
  Each incremental-learning iteration takes one to two hours; MLP training on one NVIDIA A100 (40 GB), QM and metadynamics on CPU nodes (Methods).
gaps:
  - "Errors of the single-system UiO-66 and MIL-53 models are stated only as bounds (below 1 meV/atom and 30 meV/A over the volume range; Fig. 4). Stress MAEs converted exactly from MPa to GPa (original values in the locations)."
