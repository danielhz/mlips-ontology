study_label: "Xu et al. (2026): benchmarking universal MLIPs for Cu nanoparticles supported on Al2O3"
scope: |
  Encoding scope: the domain-specific DP-UniAlCu model (from the authors'
  previous work), MACE-UniAlCu trained here on the same data, and the
  universal models MACE-OMAT, MatterSim-v1.0.0-1M, MatterSim-v1.0.0-5M and
  DPA3-OMAT, with their force RMSEs on the three subsystems of the UniAlCu
  data set (Table 3). Binding-energy deviations (Table 1), ranking metrics
  (Table 2), MD observables and the MACE-MP and DPA2 models (errors in
  figures and SI) are not encoded.
materials:
  Cu: {label: "Cu structures of the UniAlCu data set (bulk, surfaces, gas-phase nanoparticles)", class: "Supported metal nanoparticle catalyst / oxide surface"}
  gamma: {label: "gamma-Al2O3 surfaces with and without supported Cu nanoparticles", class: "Supported metal nanoparticle catalyst / oxide surface"}
  alpha: {label: "alpha-Al2O3(0001) surfaces with and without supported Cu nanoparticles", class: "Supported metal nanoparticle catalyst / oxide surface"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, comment: "UniAlCu data set and binding energies; settings close to the Materials Project MPRelaxSet (Section S2)."}
datasets:
  unialcu: {label: "UniAlCu data set (147,464 structures at 0 K and 400-1200 K)", materials: [Cu, gamma, alpha], properties: [Energy, Forces], provenance: Published, n: {v: 147464, loc: "Results"}, calc: pbe, comment: "From the authors' previous work (Ref. 16); Cu bulk, surfaces and gas-phase nanoparticles, Al2O3 surfaces and Al2O3-supported Cu nanoparticles up to Cu21."}
external_models: [MatterSim-v1]
methods:
  DeePMD: {sims: [MolecularDynamics, GeometryOptimization]}
  MACE: {impl: {lib: MACE}, sims: [MolecularDynamics, GeometryOptimization]}
  M3GNet: {sims: [MolecularDynamics, GeometryOptimization]}
  DPA3: {sims: [MolecularDynamics]}
runs:
  dp-unialcu: {label: "DP-UniAlCu, the domain-specific Deep Potential of the authors' previous work", method: DeePMD, dataset: unialcu, model: "DP-UniAlCu"}
  mace-unialcu: {label: "MACE trained on the UniAlCu data set with the MACE-OMAT architecture", method: MACE, dataset: unialcu, model: "MACE-UniAlCu"}
  mace-omat: {label: "MACE-OMAT as distributed", method: MACE, model: "MACE-OMAT (trained on OMat24)"}
  mattersim-1m: {label: "MatterSim-v1.0.0-1M as distributed", method: M3GNet, model: "MatterSim-v1.0.0-1M"}
  dpa3-omat: {label: "DPA3-OMAT as distributed", method: DPA3, model: "DPA3-OMAT"}
