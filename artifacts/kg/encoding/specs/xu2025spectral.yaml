id: xu2025spectral
source:
  rank: 215
  year: "2025"
  first_author: "Zemin Xu"
  title: "Spectral/Spatial Tensor Atomic Cluster Expansion with Universal Embeddings in Cartesian Space"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2509.14961"
  kg_relevance: "Method/model"
  arxiv_id: "2509.14961v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "c397b632e82ce6a9f6d713e78e5bcafca94a26d34e087b95a1af8d1df6e12f97"
study_label: "Xu, Xie and Hu (2025): tensor atomic cluster expansion (TACE) in Cartesian space"
scope: |
  Encoding scope: TACE (introduced here) with its tabulated energy and force
  errors: four TACE variants on 3BPA (Table 1), the 32-molecule water
  system (Table 2), the GAP17 carbon set (Table 4), the field-embedded
  FITACE on BaTiO3 (Table 5, energy and force only), four charged systems
  (Table 6) and MatPES-PBE (Table 10). Dipole and polarisability errors
  (Table 3), the multi-fidelity study (Fig. 2), adsorption geometries and
  reaction barriers (Tables 7-9) and values of other models quoted from the
  literature are not encoded.
materials:
  3BPA: {label: "3-(benzyloxy)pyridin-2-amine (3BPA) molecule", class: "Flexible drug-like organic molecule (gas phase)"}
  water: {label: "Liquid water (32-molecule system)", formula: "H2O", class: "Molecular liquid", wikidata: Q283}
  carbon: {label: "Carbon allotropes (GAP17 data set)", formula: "C", class: "Elemental solid and liquid carbon", wikidata: Q623}
  BaTiO3: {label: "Barium titanate under external electric fields", formula: "BaTiO3", class: "Ferroelectric perovskite"}
  C10H2: {label: "C10H2 / C10H3+ carbon chains (neutral and positively charged)", class: "Charged system (Ko et al. benchmark)"}
  Ag3: {label: "Ag3 trimers with total charge +1 and -1", class: "Charged system (Ko et al. benchmark)"}
  NaCl: {label: "Na8/9Cl8+ ionic clusters", class: "Charged system (Ko et al. benchmark)"}
  AuMgO: {label: "Au2 cluster on a MgO(001) slab", class: "Charged system (Ko et al. benchmark)"}
  matpes: {label: "Inorganic materials of MatPES-PBE", class: "Inorganic crystalline materials"}
reference:
  bpa: {type: DFT, xc: wB97X, basis: "6-31G(d)", comment: "3BPA configurations reevaluated at wB97X/6-31G(d) (Sec. 2.4)."}
datasets:
  3BPA: {label: "3BPA training set at 300 K", materials: [3BPA], properties: [Energy, Forces], provenance: Published, calc: bpa}
  water: {label: "32-water data set (Refs. [15, 43])", materials: [water], properties: [Energy, Forces], provenance: Published}
  gap17: {label: "GAP17 carbon data set", materials: [carbon], properties: [Energy, Forces], provenance: Published}
  batio3: {label: "BaTiO3 data set of Allegro-pol (59 zero-field MD frames)", materials: [BaTiO3], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 59, loc: "Sec. 2.8"}, comment: "Also polarisation, polarisability and Born effective charges."}
  chg-C10H2: {label: "Charged-system data set of Ko et al.: C10H2 / C10H3+ carbon chains (neutral and positively charged)", materials: [C10H2], properties: [Energy, Forces], provenance: Published, comment: "Charges also used as labels."}
  chg-Ag3: {label: "Charged-system data set of Ko et al.: Ag3 trimers with total charge +1 and -1", materials: [Ag3], properties: [Energy, Forces], provenance: Published, comment: "Charges also used as labels."}
  chg-NaCl: {label: "Charged-system data set of Ko et al.: Na8/9Cl8+ ionic clusters", materials: [NaCl], properties: [Energy, Forces], provenance: Published, comment: "Charges also used as labels."}
  chg-AuMgO: {label: "Charged-system data set of Ko et al.: Au2 cluster on a MgO(001) slab", materials: [AuMgO], properties: [Energy, Forces], provenance: Published, comment: "Charges also used as labels."}
  matpes: {label: "MatPES-PBE training data", materials: [matpes], properties: [Energy, Forces, Stresses], provenance: Published}
hyperparameters:
  correlation-order: {label: "ACE correlation order of the product basis", name: "correlation order", datatype: integer}
  Lmax: {label: "Maximum rank Lmax of the irreducible Cartesian tensor features", name: "Lmax", datatype: integer}
methods:
  TACE:
    hp: [numFeatures, correlation-order, Lmax]
    impl: {lib: {local: "TACE", comment: "Implementation of the paper; details in the Methods and SI"}}
    sims: [MolecularDynamics, PhononCalculation]
runs:
  tace-3bpa-sph-spa: {label: "TACE spherical, spatial-domain ACE, correlation order 2, trained on 3BPA at 300 K", method: TACE, dataset: 3BPA, settings: {numFeatures: {v: 64, loc: "Sec. 2.4"}, correlation-order: {v: 2, loc: "Table 1 note"}}, model: "TACE spherical, spatial-domain ACE, correlation order 2 (3BPA)"}
  tace-3bpa-cart-spa: {label: "TACE Cartesian, spatial-domain ACE, correlation order 2, trained on 3BPA at 300 K", method: TACE, dataset: 3BPA, settings: {numFeatures: {v: 64, loc: "Sec. 2.4"}, correlation-order: {v: 2, loc: "Table 1 note"}}, model: "TACE Cartesian, spatial-domain ACE, correlation order 2 (3BPA)"}
