id: yu2024
source:
  rank: 402
  year: "2024"
  first_author: "Hongyu Yu"
  title: "Spin-dependent graph neural network potential for magnetic materials"
  venue: "Physical review. B./Physical review. B"
  doi: "10.1103/physrevb.109.144426"
  kg_relevance: "Application/model instance"
  arxiv_id: "2203.02853v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "da1ce1408f3f238b1d8ead59faa8bcd5ce976c8900a894ac02330dfe5d78a0ed"
study_label: "Yu et al. (2024): SpinGNN, spin-dependent graph neural network potentials (Spin-DimeNet++, Spin-Allegro) for magnetic materials and BiFeO3"
scope: |
  Encoding scope: Spin-DimeNet++ models (HEGNN, SEGNN and combined)
  trained on three effective-Hamiltonian data sets generated with PASP
  (a CuMO2 spin Hamiltonian; a Heisenberg-type and a fourth-order
  spin-lattice ABO3 model), Spin-Allegro and plain Allegro trained on a
  DFT+U BiFeO3 data set (4,857 configurations), and their test MAEs.
  Ground-state search and the Neel temperature from spin-lattice
  dynamics are properties.
materials:
  cumo2: {label: "CuMO2 spin lattice (96 magnetic sites, fixed CuAlO2-type structure)", class: "Inorganic crystals"}
  abo3: {label: "50-atom ABO3 perovskite spin-lattice model with magnetic B sites", class: "Inorganic crystals"}
  bfo: {label: "Multiferroic BiFeO3 (R3c, R3m, Pnma, Pm-3m supercells with random spins)", formula: "BiFeO3", class: "Oxides"}
reference:
  pasp: {type: REF, comment: "Effective spin and spin-lattice Hamiltonians (Eqs. 10-12) evaluated with PASP; coefficients set to 0.1 eV (spin terms) and 1 eV (position terms)."}
  pbeu: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 500, kpoints: "2x4x4", comment: "PBE+U, U = 3.8 eV on Fe 3d, collinear spins without SOC, EDIFF 1e-6 eV per supercell (Methods)."}
datasets:
  spinh: {label: "CuMO2 spin-Hamiltonian data (random spin configurations, 80/10/10)", materials: [cumo2], properties: [Energy], provenance: InHouse, n: {v: 10000, loc: "Methods"}, calc: pasp}
  heis: {label: "Heisenberg-type spin-lattice model data (distorted ABO3, random spins, 80/10/10)", materials: [abo3], properties: [Energy, Forces], provenance: InHouse, n: {v: 2416, loc: "Methods"}, calc: pasp}
  high: {label: "Fourth-order spin-lattice model data (distorted ABO3, random spins, 80/10/10)", materials: [abo3], properties: [Energy, Forces], provenance: InHouse, n: {v: 3611, loc: "Methods"}, calc: pasp}
  bfo: {label: "BiFeO3 DFT+U data (4,200 training / 357 validation / 300 test)", materials: [bfo], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 4857, loc: "Results"}, calc: pbeu}
methods:
  Spin-DimeNet:
    hp: [numLayers, cutoffRadius, learningRate, batchSize]
  Spin-Allegro:
    hp: [numLayers, cutoffRadius, numRadialBasis, learningRate, batchSize]
    sims: [MolecularDynamics, GeometryOptimization]
  Allegro:
    hp: [numLayers, cutoffRadius, numRadialBasis, learningRate, batchSize]
runs:
  sd-spinh: {label: "Spin-DimeNet++ (HEGNN + SEGNN) on the CuMO2 spin Hamiltonian", method: Spin-DimeNet, dataset: spinh, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 8, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 10, loc: "Methods"}}, model: "Spin-DimeNet++ CuMO2"}
  hegnn-heis: {label: "HEGNN-DimeNet++ on the Heisenberg-type spin-lattice model", method: Spin-DimeNet, dataset: heis, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 7.2, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 6, loc: "Methods"}}, model: "HEGNN-DimeNet++ Heisenberg model"}
  ens-heis: {label: "HEGNN-DimeNet++ and SEGNN-DimeNet++ together on the Heisenberg-type model", method: Spin-DimeNet, dataset: heis, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 7.2, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 6, loc: "Methods"}}, model: "HEGNN+SEGNN-DimeNet++ Heisenberg model"}
  hegnn-high: {label: "HEGNN-DimeNet++ on the fourth-order spin-lattice model", method: Spin-DimeNet, dataset: high, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 6, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 8, loc: "Methods"}}, model: "HEGNN-DimeNet++ fourth-order model"}
  segnn-high: {label: "SEGNN-DimeNet++ on the fourth-order spin-lattice model", method: Spin-DimeNet, dataset: high, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 6, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 8, loc: "Methods"}}, model: "SEGNN-DimeNet++ fourth-order model"}
  both-high: {label: "HEGNN-DimeNet++ and SEGNN-DimeNet++ jointly on the fourth-order spin-lattice model", method: Spin-DimeNet, dataset: high, settings: {numLayers: {v: 4, loc: "Methods"}, cutoffRadius: {v: 6, loc: "Methods"}, learningRate: {v: 0.0005, loc: "Methods"}, batchSize: {v: 8, loc: "Methods"}}, model: "HEGNN+SEGNN-DimeNet++ fourth-order model"}
  spin-allegro: {label: "Spin-Allegro for BiFeO3 (two HEGNN-Allegro layers and one SEGNN-Allegro layer)", method: Spin-Allegro, dataset: bfo, settings: {numLayers: {v: 3, loc: "Results (2 HEGNN + 1 SEGNN layers)"}, cutoffRadius: {v: 6.0, loc: "Methods"}, numRadialBasis: {v: 8, loc: "Methods"}, learningRate: {v: 0.005, loc: "Methods"}, batchSize: {v: 1, loc: "Methods"}}, model: "Spin-Allegro BiFeO3"}
  allegro: {label: "Original Allegro for BiFeO3 with the same configuration (no spin input)", method: Allegro, dataset: bfo, settings: {cutoffRadius: {v: 6.0, loc: "Methods"}, numRadialBasis: {v: 8, loc: "Methods"}, learningRate: {v: 0.005, loc: "Methods"}, batchSize: {v: 1, loc: "Methods"}}, model: "Allegro BiFeO3 (no spin)"}
results:
  - {key: sd-spinh, model: sd-spinh, material: cumo2, role: test, eval_data: {label: "CuMO2 spin-Hamiltonian test split (10 %)", location: "Fig. 3a"}, metrics: [[MAE, Energy, 1.024e-5, null, "test energy MAE in meV/site on cumo2: Spin-DimeNet++", "Results"]]}
  - {key: hegnn-heis, model: hegnn-heis, material: abo3, role: test, eval_data: {label: "Heisenberg-type model test split (10 %)", location: "Fig. 3a"}, metrics: [[MAE, Energy, 5.04, null, "test energy MAE in meV/site on abo3: HEGNN-DimeNet++ (Heisenberg model)", "Results"]]}
  - {key: ens-heis, model: ens-heis, material: abo3, role: test, eval_data: {label: "Heisenberg-type model test split (10 %)", location: "Results"}, metrics: [[MAE, Energy, 5.57, null, "test energy MAE in meV/site on abo3: HEGNN+SEGNN-DimeNet++ (Heisenberg model)", "Results"]]}
  - {key: hegnn-high, model: hegnn-high, material: abo3, role: test, eval_data: {label: "Fourth-order model test split (10 %)", location: "Fig. 3b"}, metrics: [[MAE, Energy, 2.26, meV/atom, "test energy MAE on abo3: HEGNN-DimeNet++ (fourth-order model)", "Results"]]}
  - {key: segnn-high, model: segnn-high, material: abo3, role: test, eval_data: {label: "Fourth-order model test split (10 %)", location: "Fig. 3c"}, metrics: [[MAE, Energy, 0.596, meV/atom, "test energy MAE on abo3: SEGNN-DimeNet++ (fourth-order model)", "Results"]]}
  - {key: both-high, model: both-high, material: abo3, role: test, eval_data: {label: "Fourth-order model test split (10 %)", location: "Fig. 3d"}, metrics: [[MAE, Energy, 0.466, meV/atom, "test energy MAE on abo3: HEGNN+SEGNN-DimeNet++ (fourth-order model)", "Results"]]}
  - {key: spin-allegro, model: spin-allegro, material: bfo, role: test, eval_data: {label: "BiFeO3 test set (300 configurations)", location: "Methods"}, metrics: [[MAE, Energy, 1.40, null, "test energy MAE in meV/site on bfo: Spin-Allegro", "Results"], [MAE, Force, 23.2, meV/A, "test force MAE on bfo: Spin-Allegro", "Results"]]}
  - {key: allegro, model: allegro, material: bfo, role: test, eval_data: {label: "BiFeO3 test set (300 configurations)", location: "Methods"}, metrics: [[MAE, Energy, 3.55, null, "test energy MAE in meV/site on bfo: Allegro (no spin)", "Results"], [MAE, Force, 30.1, meV/A, "test force MAE on bfo: Allegro (no spin)", "Results"]]}
resources: |
  Training on one NVIDIA A100; BiFeO3 spin-lattice dynamics of 8,640 atoms on four A100 GPUs. No timings are given.
gaps:
  - "Energies given per 'site' (meV/site) are recorded with unit null because a site is a magnetic site, not every atom. The Allegro run's 'same configuration' is read as the Spin-Allegro settings without the spin layers; its layer count is not stated separately."
  - "The two spin-lattice models and the spin Hamiltonian are effective Hamiltonians, not DFT (reference type REF). The ML spin Hamiltonian MAE of Ref. 50 (1.03e-5 meV/site) is quoted and not encoded. Ground-state configuration and Neel temperature are properties."
