  pbe-d4: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 850, kpoints: "Gamma-centred 7x7x7", comment: "Grimme D4 dispersion (IVDW 13); EDIFF 1e-6 eV; Fermi smearing 0.05 eV; PREC High (Tables S4, S6)."}
sampling:
  aimd: {label: "NVT AIMD of eight polymorphs at 300-800 K, Langevin thermostat, 1 fs time step, 10,000 steps", comment: "Configurations extracted from each trajectory; force outliers filtered before training (Sec. 3.1.1)."}
