resources: |
  8 nodes with two 64-core Kunpeng 920 CPUs and 4 NVIDIA A100-40G GPUs each; PyTorch 2.6, CUDA 12.4.
gaps:
  - "Training throughput, bubble ratios and scalability are system metrics of the training framework, not of an MLIP. The correctness check compares MAE trajectories over 1,000 iterations (mean absolute percentage differences 0.84% energy, 0.21% force), which are not model errors."
