scope: |
  Encoding scope: none beyond the study record. The paper presents a
  pipeline-parallel training system (SymFold second-order scheduling,
  WaveK adaptive scheduling, graph-aware re-scheduling) evaluated by
  training throughput on UMA (1.2B, 2.3B) and eSEN (100M, 220M)
  configurations on up to 32 A100 GPUs; no model is trained to convergence
  or evaluated for accuracy.
