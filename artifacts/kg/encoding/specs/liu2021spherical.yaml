id: liu2021spherical
source:
  rank: 206
  year: "2021"
  first_author: "Yi Liu"
  title: "Spherical Message Passing for 3D Graph Networks"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2102.05013"
  kg_relevance: "Method/model"
  arxiv_id: "2102.05013v5"
