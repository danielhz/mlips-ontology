source:
  rank: 513
  year: "2026"
  first_author: "Bangchen Yin"
  title: "Hessian-informed machine learning interatomic potential towards bridging theory and experiments"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2603.25373"
  kg_relevance: "Application/model instance"
  arxiv_id: "2603.25373v1"
  pdf_version: "arxiv-preprint"
