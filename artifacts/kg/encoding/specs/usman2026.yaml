id: usman2026
source:
  rank: 249
  year: "2026"
  first_author: "M. Usman"
  title: "Benchmarking Machine-Learning Interatomic Potentials for Dynamical Stability in Inorganic Semiconductor Nanocrystals: A CdSe Case Study"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2609.15299"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2609.15299v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "33349db435dee3772c5b520de4a00e33c990075c2aa945fb0dcbca827258f50b"
study_label: "Usman et al. (2026): benchmarking five GNN potentials for dynamical stability of a CdSe nanocrystal"
scope: |
  Encoding scope: SchNet, PaiNN, NequIP, Allegro and MACE trained on the
  same 1,000 DFT configurations of a chloride-passivated Cd68Se55Cl26
  nanocluster for twelve combinations of hidden dimension and number of
  layers, with their validation force MAEs and training times (Table 1),
  and the MD time per step of each architecture (Table 2). The
  active-learning refinement of MACE (34 added configurations) and the
  stability classifications are not encoded as results.
materials:
  cdse: {label: "Chloride-passivated CdSe quantum dot Cd68Se55Cl26 (149 atoms, about 2 nm)", formula: "Cd68Se55Cl26", class: "Semiconductor nanocrystal"}
reference:
  hle17: {type: DFT, code: {local: "CP2K 2024.1"}, xc: {local: "HLE17"}, basis: "DZVP-MOLOPT", comment: "GPW with GTH pseudopotentials, 400 Ry density cutoff, non-periodic 32 A cell with a multipole Poisson solver."}
sampling:
  aimd-cluster: {label: "Born-Oppenheimer AIMD at 300 K (CSVR thermostat, 2.5 fs), 3,000 frames; isolation-forest screening and PCA/k-means selection of 1,000 training frames"}
datasets:
  cdse: {label: "Cd68Se55Cl26 training set (1,000 of 3,000 AIMD frames)", materials: [cdse], properties: [Energy, Forces], provenance: InHouse, n: {v: 1000, loc: "Sec. 2.1"}, calc: hle17, sampling: [aimd-cluster], comment: "The other 2,000 frames are held out for validation."}
methods:
  SchNet:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate, batchSize, numEpochs]
    loss: "Force-dominated energy and force loss (0.95:0.05)"
    algorithm: "AdamW"
    sims: [MolecularDynamics]
  PaiNN:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate, batchSize, numEpochs]
    loss: "Force-dominated energy and force loss (0.95:0.05)"
    algorithm: "AdamW"
    sims: [MolecularDynamics]
  NequIP:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate, batchSize, numEpochs]
    loss: "Force-dominated energy and force loss (0.95:0.05)"
    algorithm: "Adam"
    sims: [MolecularDynamics]
  Allegro:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate, batchSize, numEpochs]
    loss: "Force-dominated energy and force loss (0.95:0.05)"
    algorithm: "Adam"
    sims: [MolecularDynamics]
  MACE:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate, batchSize, numEpochs]
    loss: "Force-dominated energy and force loss (0.95:0.05)"
    algorithm: "Adam"
    sims: [MolecularDynamics]
runs:
