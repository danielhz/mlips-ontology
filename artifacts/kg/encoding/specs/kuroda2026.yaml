study_label: "Kuroda et al. (2026): MACE-Osaka26, a 97-element universal MLIP with the heavy-element data set HE26"
scope: |
  Encoding scope: the HE26 heavy-element data set (actinides and other
  heavy elements; built here), MACE-Osaka26 trained on MPtrj, OFF23 and
  HE26 (graph cutoff 6.0 A, 200 epochs), and the comparison with the
  earlier MACE-Osaka24, with energy, force and stress MAEs and RMSEs on the
  MPtrj and OFF23 training and test splits and on the HE26 training set
  (Table I). Lattice-parameter errors and thermal conductivities are
  properties, not energy/force/stress errors.
materials:
  mptrj: {label: "Inorganic crystals of MPtrj", class: "Inorganic crystals"}
  off23: {label: "Organic molecules of the MACE-OFF23 data (SPICE-based)", class: "Organic molecules (gas phase)"}
  he26: {label: "Heavy-element compounds including minor actinides (Am, Cm, Cf and others): elemental solids, oxides, multi-component and fluorite oxides", class: "Heavy-element and actinide materials"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, comment: "HE26 labels: PREC Accurate, EDIFF 1e-5, Gaussian smearing 0.05 eV, LMAXMIX 6, several initial magnetic configurations (lowest energy kept); MPtrj-compatible settings."}
datasets:
  he26: {label: "HE26 heavy-element data set (59,438 training structures; no separate test split)", materials: [he26], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 59438, loc: "Table I"}, calc: pbe}
  combined: {label: "MPtrj (1,502,422 training structures) + OFF23 (951,005) + HE26 (59,438)", materials: [mptrj, off23, he26], properties: [Energy, Forces, Stresses], provenance: Augmented, comment: "Combined training data of MACE-Osaka26."}
methods:
  MACE:
    hp: [cutoffRadius, numEpochs]
    impl: {lib: MACE}
    sims: [GeometryOptimization, PhononCalculation]
runs:
  osaka24: {label: "MACE-Osaka24 as published (graph cutoff 4.5 A; no heavy elements)", method: MACE, model: "MACE-Osaka24"}
  osaka26: {label: "MACE-Osaka26 trained on MPtrj + OFF23 + HE26 (97 elements)", method: MACE, dataset: combined, settings: {cutoffRadius: {v: 6.0, loc: "Fig. 2 caption"}, numEpochs: {v: 200, loc: "Fig. 7"}}, model: "MACE-Osaka26"}
