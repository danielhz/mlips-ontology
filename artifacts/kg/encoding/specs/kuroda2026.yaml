id: kuroda2026
source:
  rank: 317
  year: "2026"
  first_author: "Naoya Kuroda"
  title: "Expanding Universal Machine Learning Interatomic Potentials to 97 Elements Towards Nuclear Applications"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2603.03223"
  kg_relevance: "Application/model instance"
