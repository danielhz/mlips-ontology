id: bheemaguli2026
source:
  rank: 624
  year: "2026"
  first_author: "Achinthya Krishna Bheemaguli"
  title: "Evaluation of foundational machine learned interatomic potentials for migration barrier predictions"
  venue: "Digital Discovery"
  doi: "10.1039/d5dd00534e"
  kg_relevance: "Application/model instance"
  arxiv_id: "2512.03642v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "1c95b5ebba26e1b3e5d311999d8206f79257f8e601657ea29940c0c4bdefb3a0"
study_label: "Bheemaguli, Xiao and Sai Gautam (2026): foundational MLIPs for migration-barrier prediction in battery materials"
scope: |
  Encoding scope: the five universal MLIPs evaluated as distributed
  (MACE-MP-0 large, SevenNet-MF-ompa, Orb-v3-conservative-inf-omat, CHGNet
  v0.3.0, M3GNet MP-2021.2.8-EFS) in ASE NEB calculations on 60 + 574
  DFT migration barriers. All accuracy figures are migration-barrier
  errors and classification or geometry metrics, which are property
  errors, so there are no results.
materials:
  ionic: {label: "Battery-relevant ionic conductors and electrodes (layered oxides, weberites, spinels, olivines, perovskites, NaSICONs and literature systems)", class: "inorganic ionic conductors"}
external_models: [CHGNet-0.3.0, M3GNet-MPF-2021.2.8]
methods:
  MACE:
    sims: [NudgedElasticBand]
  NequIP:
    sims: [NudgedElasticBand]
  ORB:
    sims: [NudgedElasticBand]
  CHGNet:
    sims: [NudgedElasticBand]
  M3GNet:
    sims: [NudgedElasticBand]
runs:
  mace-mp0-l: {label: "MACE-MP-0 'large' foundation model as distributed (release not stated)", method: MACE, model: "MACE-MP-0 large"}
  sevennet-mf-ompa: {label: "SevenNet-MF-ompa as distributed (NequIP-based, multifidelity, MPtrj + OMat24 + sAlex)", method: NequIP, model: "SevenNet-MF-ompa"}
  orb-v3: {label: "Orb-v3-conservative-inf-omat as distributed", method: ORB, model: "Orb-v3-conservative-inf-omat"}
gaps:
  - "Migration-barrier MAEs (Dataset-2: MACE-MP-0 0.310, Orb-v3 0.336, CHGNet 0.343, SevenNet 0.344, M3GNet 0.349 eV; 0.239-0.290 eV without 17 common outliers), barrier-range and classification metrics, and geometry metrics of the NEB images are property errors and are not encoded."
  - "CHGNet v0.3.0 and M3GNet MP-2021.2.8-EFS are linked to registry models; the other three checkpoints have no registry rows and are paper-local runs. SevenNet is mapped to NequIP and Orb-v3 to ORB as before."
