study_label: "Han et al. (2025): DistMLIP, graph-partitioned multi-GPU inference for MLIPs, benchmarked with pretrained MACE, TensorNet, CHGNet and eSEN"
scope: |
  Encoding scope: the four public pretrained checkpoints run through
  DistMLIP (MACE-MP-0b-small 3.8M, TensorNet-MatPES 0.8M, CHGNet-MatPES
  2.7M, eSEN 3.2M) as paper-local runs, with the MD step times of
  Table 1 (1 and 8 GPUs, maximum-capacity cells of Li3PO4, water, GaN, a
  MOF and the 2w49 biomolecule). No accuracy metrics are reported;
  scaling curves are figure-only.
materials:
  li3po4: {label: "Li3PO4 battery-electrolyte supercells", formula: Li3PO4, class: "Inorganic crystals"}
  h2o: {label: "Water supercells", formula: H2O, class: "Molecular liquid"}
  gan: {label: "GaN semiconductor supercells", formula: GaN, class: "Inorganic crystals"}
  mof: {label: "Metal-organic framework supercells", class: "Metal-organic frameworks"}
  bio: {label: "Biomolecule 2w49 (69.3k atoms)", class: "Organic and biochemical molecules (C, N, O, H)"}
methods:
  MACE:
    impl: {lib: MACE, comment: "DistMLIP graph-parallel inference (pure PyTorch) or LAMMPS spatial partitioning"}
    sims: [MolecularDynamics]
  TensorNet:
    impl: {lib: {local: matgl}, comment: "DistMLIP"}
    sims: [MolecularDynamics]
  CHGNet:
    impl: {lib: CHGNet, comment: "DistMLIP"}
    sims: [MolecularDynamics]
  eSEN:
    impl: {lib: {local: fairchem}, comment: "DistMLIP"}
    sims: [MolecularDynamics]
runs:
  mace: {label: "MACE-MP-0b-small (3.8M parameters, as distributed)", method: MACE, model: "MACE-MP-0b-small"}
  tensornet: {label: "TensorNet-MatPES-0.8M (as distributed)", method: TensorNet, model: "TensorNet-MatPES-0.8M"}
  chgnet: {label: "CHGNet-MatPES-2.7M (as distributed)", method: CHGNet, model: "CHGNet-MatPES-2.7M"}
  esen: {label: "eSEN-3.2M (as distributed)", method: eSEN, model: "eSEN-3.2M"}
