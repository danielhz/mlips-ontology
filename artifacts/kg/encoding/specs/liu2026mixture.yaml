id: liu2026mixture
source:
  rank: 646
  year: "2026"
  first_author: "Yuzhi Liu"
  title: "Mixture of experts architectures for machine learning interatomic potentials"
  venue: "npj Artificial Intelligence"
  doi: "10.1038/s44387-026-00144-9"
  kg_relevance: "Application/model instance"
  arxiv_id: ""
  pdf_version: "publisher"
