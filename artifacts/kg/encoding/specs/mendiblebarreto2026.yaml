id: mendiblebarreto2026
source:
  rank: 631
  year: "2026"
  first_author: "Orlando A. Mendible-Barreto"
  title: "A Machine-Learned Interatomic Potential Free-Energy Surface for the First Step of MIL-101(Cr) Secondary Building Unit Formation"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2609.38518"
  kg_relevance: "Application/model instance"
  arxiv_id: "2609.38518v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "cc141f36122f46ee9e776013a4c2682f995b98aba0f1edf7c53e2285d2262f00"
study_label: "Mendible-Barreto and Colón (2026): fine-tuned MACE-POLAR free-energy surface for the first step of MIL-101(Cr) SBU formation"
scope: |
  Encoding scope: the MACE-POLAR-M foundation model evaluated zero-shot and
  its naive, LoRA and multi-head (replay) fine-tunes on 70 wB97M-V
  configurations from exploratory metadynamics of [Cr(H2O)6]3+ + BDC
  ligand exchange, with energy and force MAEs on the training data and the
  70-structure held-out test set (Sec. 3.2). Free-energy surfaces and
  binding energies are property results.
materials:
  crbdc: {label: "[Cr(H2O)6]3+ + terephthalate (BDC) ligand-exchange complex in a 30.5 A periodic box (charge 2, S = 1.5)", class: "metal-organic precursor complex"}
reference:
  wb97mv: {type: DFT, code: ORCA, xc: {local: wB97M-V}, basis: "def2-TZVPP", comment: "ORCA 6.1.0, RIJCOSX with def2/J, tight SCF, DEFGRID3; same level as the MACE-POLAR-M training data."}
sampling:
  metad-basins: {label: "Ten frames nearest to each of seven free-energy basins of an exploratory well-tempered metadynamics run with MACE-POLAR-M"}
datasets:
  ft: {label: "70 basin configurations with wB97M-V energies and forces (train/validation split in SI Table S1)", materials: [crbdc], properties: [Energy, Forces], provenance: InHouse, n: {v: 70, loc: "Sec. 2.5"}, calc: wb97mv, sampling: [metad-basins]}
  test: {label: "70 held-out configurations (ten further frames per basin)", materials: [crbdc], properties: [Energy, Forces], provenance: InHouse, n: {v: 70, loc: "Sec. 2.5; Sec. 3.2"}, calc: wb97mv, sampling: [metad-basins]}
methods:
  MACE-POLAR:
    algorithm: "Naive (all weights), LoRA (frozen weights with low-rank updates) and multi-head replay fine-tuning from the same checkpoint; hyperparameters in SI Table S2"
    impl: {lib: MACE, comment: "mace_run_train with cuEquivariance; ASE + PLUMED for metadynamics"}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  pre: {label: "MACE-POLAR-M foundation model as distributed", method: MACE-POLAR, model: "MACE-POLAR-M"}
  naive: {label: "MACE-POLAR-M naive fine-tune (all weights)", method: MACE-POLAR, dataset: ft, model: "MACE-POLAR-M naive FT (MIL-101 SBU step 1)", base_model: {run: pre, relation: fine-tuned, location: "Sec. 2.6"}}
  lora: {label: "MACE-POLAR-M LoRA fine-tune", method: MACE-POLAR, dataset: ft, model: "MACE-POLAR-M LoRA FT (MIL-101 SBU step 1)", base_model: {run: pre, relation: fine-tuned, location: "Sec. 2.6"}}
  mh: {label: "MACE-POLAR-M multi-head replay fine-tune", method: MACE-POLAR, dataset: ft, model: "MACE-POLAR-M multi-head FT (MIL-101 SBU step 1)", base_model: {run: pre, relation: fine-tuned, location: "Sec. 2.6"}}
results:
  - {key: pre-train, model: pre, material: crbdc, role: external, eval_data: {label: "Fine-tuning (training) data set", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 19.4, meV/atom, "training-set energy MAE on crbdc: pre-trained MACE-POLAR-M", "Sec. 3.2"], [MAE, Force, 108.1, meV/A, "training-set force MAE on crbdc: pre-trained MACE-POLAR-M", "Sec. 3.2"], [R2, Force, 0.93, null, "training-set force R2 on crbdc: pre-trained MACE-POLAR-M", "Sec. 3.2"]]}
  - {key: pre-test, model: pre, material: crbdc, role: external, eval_data: {label: "70-structure held-out test set", location: "Sec. 3.2; Fig. 4"}, metrics: [[MAE, Energy, 15.1, meV/atom, "test energy MAE on crbdc: pre-trained MACE-POLAR-M", "Sec. 3.2"], [MAE, Force, 102.8, meV/A, "test force MAE on crbdc: pre-trained MACE-POLAR-M", "Sec. 3.2"]]}
  - {key: naive-train, model: naive, material: crbdc, role: training, eval_data: {label: "Fine-tuning (training) data set", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 1.2, meV/atom, "training-set energy MAE on crbdc: naive FT", "Sec. 3.2"], [MAE, Force, 48.3, meV/A, "training-set force MAE on crbdc: naive FT", "Sec. 3.2"], [R2, Force, 0.975, null, "training-set force R2 on crbdc: naive FT", "Sec. 3.2"]]}
  - {key: naive-test, model: naive, material: crbdc, role: test, eval_data: {label: "70-structure held-out test set", location: "Sec. 3.2; Fig. 4"}, metrics: [[MAE, Energy, 1.5, meV/atom, "test energy MAE on crbdc: naive FT", "Sec. 3.2"], [MAE, Force, 37.1, meV/A, "test force MAE on crbdc: naive FT", "Sec. 3.2"]]}
  - {key: mh-train, model: mh, material: crbdc, role: training, eval_data: {label: "Fine-tuning (training) data set", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 2.4, meV/atom, "training-set energy MAE on crbdc: multi-head FT", "Sec. 3.2"], [MAE, Force, 41.0, meV/A, "training-set force MAE on crbdc: multi-head FT", "Sec. 3.2"], [R2, Force, 0.97, null, "training-set force R2 on crbdc: multi-head FT", "Sec. 3.2"]]}
  - {key: mh-test, model: mh, material: crbdc, role: test, eval_data: {label: "70-structure held-out test set", location: "Sec. 3.2; Fig. 4"}, metrics: [[MAE, Energy, 1.6, meV/atom, "test energy MAE on crbdc: multi-head FT", "Sec. 3.2"], [MAE, Force, 29.2, meV/A, "test force MAE on crbdc: multi-head FT", "Sec. 3.2"]]}
  - {key: lora-train, model: lora, material: crbdc, role: training, eval_data: {label: "Fine-tuning (training) data set", location: "Sec. 3.2"}, metrics: [[MAE, Energy, 9.1, meV/atom, "training-set energy MAE on crbdc: LoRA FT", "Sec. 3.2"], [MAE, Force, 61.3, meV/A, "training-set force MAE on crbdc: LoRA FT", "Sec. 3.2"], [R2, Force, 0.972, null, "training-set force R2 on crbdc: LoRA FT", "Sec. 3.2"]]}
  - {key: lora-test, model: lora, material: crbdc, role: test, eval_data: {label: "70-structure held-out test set", location: "Sec. 3.2; Fig. 4"}, metrics: [[MAE, Energy, 6.3, meV/atom, "test energy MAE on crbdc: LoRA FT", "Sec. 3.2"], [MAE, Force, 111.3, meV/A, "test force MAE on crbdc: LoRA FT", "Sec. 3.2"]]}
gaps:
  - "Energy Pearson correlation coefficients (e.g. r = 0.89 zero-shot) are not R2 values and are not encoded."
  - "Variants fine-tuned with dissociated-fragment configurations (on-reaction-coordinate force MAE 12.9 to 28.4 meV/A naive, 11.3 to 11.5 multi-head; energy 0.85 to 1.22 and 0.77 to 1.42 meV/atom) are not encoded as runs: the evaluation subset is not identified beyond 'on-reaction-coordinate'."
  - "Fine-tuning hyperparameters are in SI Table S2 (not read). Free-energy surfaces and the binding energy (SI Section S5) are property results."
