  rank: 220
  year: "2023"
  first_author: "Richard Tran"
  title: "The Open Catalyst 2022 (OC22) Dataset and Challenges for Oxide Electrocatalysts"
  venue: "ACS Catalysis"
  doi: "10.1021/acscatal.2c05426"
  kg_relevance: "Dataset/benchmark"
