source:
  rank: 598
  year: "2025"
  first_author: "Nada M. Alghamdi"
  title: "Comparing fine-tuning strategies of MACE machine learning force field for modeling Li-ion diffusion in LiF for batteries"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2510.05020"
  kg_relevance: "Training/reliability"
  arxiv_id: "2510.05020v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "5e5b641ad557758ae794e2b2ae182887332f56adb22f9110b15c598b5f64236a"
study_label: "Alghamdi et al. (2025): fine-tuning strategies of MACE-MPA-0 for Li-ion diffusion in LiF"
scope: |
  Encoding scope: MACE-MPA-0 as distributed and the MACE models fine-tuned
  from it, either on subsets of a published DeePMD active-learning LiF
  dataset with multi-head MPtrj replay, or naively on in-house
  configurations sampled from MACE-MPA-0 MD with committee active learning
  (FT1, FT2). The paper evaluates the models only through diffusivities
  and Arrhenius parameters of interstitial Li in LiF; it states no energy,
  force or stress errors, so there are no results.
materials:
  lif: {label: "Bulk LiF and interstitial Li in LiF", formula: LiF, class: "ionic solid (battery SEI component)"}
reference:
  pbe: {type: DFT, code: QuantumESPRESSO, xc: PBE, pp: PAW, kpoints: "Gamma point only", comment: "Kinetic-energy cutoff 110 Ry, charge-density cutoff 440 Ry; Gaussian smearing 0.005 Ry; SCF 5e-7 Ry; same settings as the published DeePMD dataset (ref. 38)."}
sampling:
  deepmd-al: {label: "DeePMD active-learning configurations of bulk LiF and interstitial Li (ref. 38)"}
  mace-al: {label: "MACE-MPA-0 NVT MD (300-600 K) sampling followed by committee active learning (four models; 1, 1.5 and 2 sigma force-disagreement bins)"}
datasets:
  deepmd-800: {label: "800-structure subset (100 bulk, 700 interstitial) of the DeePMD active-learning LiF dataset", materials: [lif], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 800, loc: "Table 1"}, calc: pbe, sampling: [deepmd-al]}
  ft1: {label: "FT1 training set: MACE-MPA-0 MD samples plus two active-learning steps on interstitial Li", materials: [lif], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 156, loc: "Table 2"}, calc: pbe, sampling: [mace-al]}
  ft2: {label: "FT2 training set: MACE-MPA-0 MD samples plus one active-learning step on bulk and interstitial configurations", materials: [lif], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 144, loc: "Table 2"}, calc: pbe, sampling: [mace-al]}
methods:
  MACE:
    hp: [numEpochs, batchSize]
    loss: "Weighted Huber loss on energies, forces (conditional Huber delta) and stresses; weights (1,10,1) for DeePMD-data fine-tuning and (1,1,10) for FT1/FT2"
    impl: {lib: MACE, comment: "Multi-head fine-tuning with 0-10,000 MPtrj replay structures, or naive fine-tuning; LAMMPS and ASE for MD"}
    sims: [MolecularDynamics]
runs:
  mpa0: {label: "MACE-MPA-0 as distributed", method: MACE, model: "MACE-MPA-0"}
  ft-800-1000: {label: "MACE-MPA-0 multi-head fine-tuned on 800 DeePMD structures with 1000 MPtrj replay structures", method: MACE, dataset: deepmd-800, settings: {numEpochs: {v: 800, loc: "Sec. 2.2"}, batchSize: {v: 2, loc: "Sec. 3.2"}}, model: "MACE-MPA-0 FT (800 fine-tuning + 1000 MPtrj)", base_model: {run: mpa0, relation: fine-tuned, location: "Sec. 2.2"}, trainingHardware: "8 NVIDIA A100 GPUs; 4.5 h for 800 epochs (Sec. 3.2)"}
  ft1: {label: "FT1: MACE-MPA-0 naively fine-tuned on the FT1 set", method: MACE, dataset: ft1, settings: {numEpochs: {v: 800, loc: "Sec. 2.4"}}, model: "FT1", base_model: {run: mpa0, relation: fine-tuned, location: "Sec. 2.4"}}
  ft2: {label: "FT2: MACE-MPA-0 naively fine-tuned on the FT2 set", method: MACE, dataset: ft2, settings: {numEpochs: {v: 800, loc: "Sec. 2.4"}}, model: "FT2", base_model: {run: mpa0, relation: fine-tuned, location: "Sec. 2.4"}}
gaps:
  - "No energy, force or stress errors are stated; models are compared through diffusivities (Fig. 3) and Arrhenius activation energies and prefactors (Table 3), which are property values."
  - "Only one of the DeePMD-data fine-tuning variants (800 + 1000 MPtrj, the one with stated training time and batch size) is encoded as a run; the others (110-1600 fine-tuning structures with 0-10,000 MPtrj replay, Table 1) differ only in training-set size. The 10,000-replay cases ran 200 epochs."
  - "MD cost is given only approximately ('approximately 0.24 seconds per step' on one A100), so no timing is encoded. MACE-MPA-0 has no registry row and is a paper-local run."
  - "The MPtrj replay subsets are random selections from MPtrj; they are not encoded as separate data sets."
