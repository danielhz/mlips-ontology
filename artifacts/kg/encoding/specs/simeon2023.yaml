id: simeon2023
source:
  rank: 209
  year: "2023"
  first_author: "Guillem Simeon"
  title: "TensorNet: Cartesian Tensor Representations for Efficient Learning of Molecular Potentials"
  venue: "neural information processing systems"
  doi: "10.52202/075280-1623"
  kg_relevance: "Method/model"
  arxiv_id: "2306.06482v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "18b8666f8eec0b7f4254aaf46d53ec9c82a64b8dc6629f24f3c2528e88d52fee"
study_label: "Simeon and De Fabritiis (2023): TensorNet, Cartesian tensor representations for molecular potentials"
scope: |
  Encoding scope: TensorNet (introduced here) with its energy and force
  errors on rMD17 with one and two interaction layers (Table 2), QM9 U0
  (Table 1), SPICE (text), ANI1x and the COMP6 benchmarks (Table 3) and
  ethanol in vacuum (Table 4). The other QM9 targets, the ablations
  (Table 5), dipole/polarisability/shielding errors and values quoted from
  other papers are not encoded.
materials:
  aspirin: {label: "Aspirin molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  azobenzene: {label: "Azobenzene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  benzene: {label: "Benzene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  paracetamol: {label: "Paracetamol molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  qm9: {label: "Small organic molecules with up to nine heavy atoms C, N, O, F (QM9)", class: "Small organic molecules (equilibrium geometries)"}
  spice: {label: "Drug-like molecules, dipeptides, solvated amino acids, dimers and ion pairs (SPICE 1.1.3)", class: "Small organic and biomolecular fragments"}
  ani1x: {label: "Organic molecules of C, N, O, H with up to 63 atoms (ANI1x)", class: "Small organic molecules (off-equilibrium conformations)"}
  ANI-MD: {label: "COMP6 ANI-MD benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  GDB7-9: {label: "COMP6 GDB7-9 benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  GDB10-13: {label: "COMP6 GDB10-13 benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  DrugBank: {label: "COMP6 DrugBank benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  Tripeptides: {label: "COMP6 Tripeptides benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  S66x8: {label: "COMP6 S66x8 benchmark molecules", class: "Organic and biochemical molecules (C, N, O, H)"}
  ethanol-vac: {label: "Ethanol molecule in vacuum (FieldSchNet data set)", formula: "C2H6O", class: "Small organic molecule (gas phase)", wikidata: Q153}
reference:
  rmd17: {type: DFT, xc: {local: "PBE"}, basis: "def2-SVP", comment: "rMD17 recomputation with a very dense integration grid and very tight SCF convergence (App. A.3)."}
  qm9: {type: DFT, xc: {local: "B3LYP"}, basis: "6-31G(2df,p)"}
  spice: {type: DFT, xc: {local: "wB97M-D3BJ"}, basis: "def2-TZVPPD"}
  ani1x: {type: DFT, xc: wB97X, basis: "6-31G(d)", comment: "ANI1x and COMP6 (App. A.3)."}
  ethanol-pbe0: {type: DFT, xc: PBE0, comment: "Ethanol-in-vacuum reference data of FieldSchNet (App. A.3)."}
datasets:
  rmd17-aspirin: {label: "rMD17 aspirin training set (950 conformations)", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-azobenzene: {label: "rMD17 azobenzene training set (950 conformations)", materials: [azobenzene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-benzene: {label: "rMD17 benzene training set (950 conformations)", materials: [benzene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-ethanol: {label: "rMD17 ethanol training set (950 conformations)", materials: [ethanol], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-malonaldehyde: {label: "rMD17 malonaldehyde training set (950 conformations)", materials: [malonaldehyde], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-naphthalene: {label: "rMD17 naphthalene training set (950 conformations)", materials: [naphthalene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-paracetamol: {label: "rMD17 paracetamol training set (950 conformations)", materials: [paracetamol], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-salicylic-acid: {label: "rMD17 salicylic acid training set (950 conformations)", materials: [salicylic-acid], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-toluene: {label: "rMD17 toluene training set (950 conformations)", materials: [toluene], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  rmd17-uracil: {label: "rMD17 uracil training set (950 conformations)", materials: [uracil], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "App. A.3"}, calc: rmd17, comment: "950 training and 50 validation conformations; errors on all remaining conformations; five random splits."}
  qm9: {label: "QM9 training set (110,000 structures)", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 110000, loc: "App. A.3"}, calc: qm9, comment: "10,000 validation; four random splits."}
  spice: {label: "SPICE 1.1.3 after force filtering (about 1M data points; 80% training)", materials: [spice], properties: [Energy, Forces], provenance: Published, calc: spice, comment: "Configurations with forces above 50.94 eV/A removed; three random 80/10/10 splits."}
  ani1x: {label: "ANI1x (about 5M data points; 80% training)", materials: [ani1x], properties: [Energy, Forces], provenance: Published, calc: ani1x, comment: "Three random 80/10/10 splits."}
  ethanol-vac: {label: "Ethanol in vacuum data set of FieldSchNet (8,000 training conformations)", materials: [ethanol-vac], properties: [Energy, Forces], provenance: Published, n: {v: 8000, loc: "App. A.3"}, calc: ethanol-pbe0, comment: "1,000 validation and 1,000 test conformations; three random splits; dipoles, polarisabilities and shielding tensors also computed."}
methods:
  TensorNet:
    hp: [cutoffRadius, numLayers, numFeatures, numRadialBasis, learningRate, batchSize]
    loss: "MSE on energies (QM9) or weighted MSE on energies and forces (weights 0.5 and 0.5; 1 and 100 for ANI1x)"
    algorithm: "Adam with linear warm-up and reduce-on-plateau learning-rate decay"
    impl: {lib: {local: "TorchMD-NET", comment: "TensorNet implemented within the TorchMD-NET framework (PyTorch 1.11.0, PyTorch Geometric 2.0.3, PyTorch Lightning 1.6.3)"}}
runs:
  tn1-aspirin: {label: "TensorNet 1L fit to rMD17 aspirin", method: TensorNet, dataset: rmd17-aspirin, settings: {cutoffRadius: {v: 4.5, loc: "App. A.3"}, numLayers: {v: 1, loc: "App. A.3"}, numFeatures: {v: 128, loc: "App. A.3"}, numRadialBasis: {v: 32, loc: "App. A.3"}, learningRate: {v: 0.001, loc: "App. A.3"}, batchSize: {v: 8, loc: "App. A.3"}}, model: "TensorNet 1L rMD17 aspirin model (535k parameters)", trainingHardware: "Single NVIDIA GeForce RTX 2080 Ti, float32"}
