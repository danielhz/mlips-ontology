resources: |
  Fitting an MF or MFRA MTP of level 14 on Mo-Nb-Ta-W takes 542-555 CPU minutes for ranks 4-10 (Table II, ensembles of five).
gaps:
  - "Table III values carry 1-sigma intervals over the ensemble (e.g. base 5.2 +- 0.4 meV/atom, 109 +- 5 meV/A); only the means are encoded. Stress errors are given in eV (no schema unit for this; recorded with unit null)."
  - "Mo-Nb-Ta-W (4,983 training and 546 validation configurations, PBE, 520 eV, 4x4x4) and FLiNaK (754 configurations, PBE+D3) MTPs at levels 12-18, the ETN comparison and the base and compressed ACE (FLiNaK) have errors in Figs. 5-10 only; these models are not encoded."
  - "FLiNaK densities (Table IV) and glycine polymorph energies (Fig. 11) are properties."
