id: vorotnikov2025
source:
  rank: 346
  year: "2025"
  first_author: "Igor Leonidovich Vorotnikov"
  title: "Low-rank matrix and tensor approximations for compression of machine-learning interatomic potentials"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0300163"
  kg_relevance: "Application/model instance"
  arxiv_id: "2509.04440v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "1157e1441a8368b398e5fbbef3eec1b0bda03b15e8599f2797eac76306b479ec"
study_label: "Vorotnikov et al. (2025): low-rank matrix and tensor compression of the radial parameters of moment tensor potentials (and ACE)"
scope: |
  Encoding scope: the 20th-level MTPs fitted on the glycine
  molecular-crystal training set (base and compressed by matrix
  factorisation MF, Riemannian R-MF, rank-augmented MFRA and tensor-train
  TF, each at the optimal rank and at ~50 % compression; ensembles of 10)
  with the energy, force and stress RMSEs of Table III. The compressed
  potentials keep the MTP functional form with a factorised tensor of
  radial parameters, so they stay under the registry method MTP. The
  Mo-Nb-Ta-W and FLiNaK MTPs, the ETN comparison and the compressed ACE are
  reported in figures only (gaps).
materials:
  glycine: {label: "Glycine molecular crystals (alpha, beta, gamma polymorphs)", formula: "C2H5NO2", class: "Molecular crystals"}
reference:
  pbed3: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 600, kpoints: "Gamma point", comment: "PBE+D3; data set taken from Ref. 27 (Table I)."}
datasets:
  gly: {label: "Glycine training set of Ref. 27", materials: [glycine], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 3127, loc: "Table I"}, calc: pbed3}
methods:
  MTP:
    hp: [cutoffRadius, momentLevel]
    loss: "Weighted energy, force and stress squared errors (w_e = 1 eV^-2, w_f = 0.01 (eV/A)^-2, w_s = 0.001 eV^-2 for glycine)"
    algorithm: "BFGS, 2,000 steps; Riemannian BFGS for R-MF; rank augmentation for MFRA"
    sims: [GeometryOptimization, MolecularDynamics]
runs:
