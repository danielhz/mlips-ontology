  mtp20-mf-opt: {label: "MTP level 20, MF opt, rank 9 (504 radial parameters, 288 linear) on glycine", method: MTP, dataset: gly, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, momentLevel: {v: 20, loc: "Table III"}}, model: "glycine MTP-20 MF opt"}
  mtp20-mf-50pc: {label: "MTP level 20, MF 50%, rank 6 (334 radial parameters, 288 linear) on glycine", method: MTP, dataset: gly, settings: {cutoffRadius: {v: 5, loc: "Sec. III A"}, momentLevel: {v: 20, loc: "Table III"}}, model: "glycine MTP-20 MF 50%"}
