  gn-noaug: {label: "GotenNet-S on HORM ts1x-train, no augmentation", method: GotenNet, dataset: horm, settings: {numLayers: {v: 4, loc: "SI Implementation details"}, numFeatures: {v: 256, loc: "SI Implementation details"}, numRadialBasis: {v: 64, loc: "SI Implementation details"}, cutoffRadius: {v: 5.0, loc: "SI Implementation details"}}, model: "GotenNet-S, no augmentation"}
