id: kwak2026
source:
  rank: 275
  year: "2026"
  first_author: "Bumju Kwak"
  title: "Hessian-Informed Conformation Augmentation for Potential Energy Surface Curvature in Machine Learning Interatomic Potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2609.05233"
  kg_relevance: "Application/model instance"
  arxiv_id: "2609.05233v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "da9f1cee67f53c572168a039c0bcda8f1cded28de4a414d5e8ecd99142122873"
study_label: "Kwak and Jo (2026): Hessian-informed conformation augmentation (UniAug, ModeAug) for MLIP training"
scope: |
  Encoding scope: EquiformerV2 (direct-force and autograd-force heads) and
  GotenNet-S trained on the HORM ts1x training split without augmentation
  or with the Hessian-derived UniAug and ModeAug augmentations (and, for
  GotenNet on 10% of the data, with Hessian row sampling), with the energy
  and force MAEs stated in the text for ts1x-val (in-domain) and RGD1
  (out-of-domain), and the zero-shot MD17 force MAEs of the direct-force
  EquiformerV2 models (Table 3). Values the text gives only as ranges over
  the two augmentations are not encoded; the HessianQM9 study (Table 2)
  does not name the architecture and is not encoded.
materials:
  t1x: {label: "Organic reactions of Transition-1x (C, H, N, O): reactants, products and NEB path structures", class: "Organic molecules off equilibrium (reaction paths)"}
  rgd1: {label: "RGD1 reactions with up to two bonds formed and broken (60k test set)", class: "Organic molecules off equilibrium (reaction paths)"}
  aspirin: {label: "Aspirin (MD17)", formula: "C9H8O4", class: "Small organic molecule (gas phase)", wikidata: Q18216}
  ethanol: {label: "Ethanol (MD17)", formula: "C2H6O", class: "Small organic molecule (gas phase)", wikidata: Q153}
  naphthalene: {label: "Naphthalene (MD17)", formula: "C10H8", class: "Small organic molecule (gas phase)", wikidata: Q179724}
  salicylic: {label: "Salicylic acid (MD17)", formula: "C7H6O3", class: "Small organic molecule (gas phase)", wikidata: Q193572}
  toluene: {label: "Toluene (MD17)", formula: "C7H8", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil (MD17)", formula: "C4H4N2O2", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde (MD17)", formula: "C3H4O2", class: "Small organic molecule (gas phase)"}
  benzene: {label: "Benzene (MD17)", formula: "C6H6", class: "Small organic molecule (gas phase)"}
reference:
  wb97x: {type: DFT, xc: wB97X, basis: "6-31G(d)", comment: "HORM energies, forces and Hessians (Table 1)."}
datasets:
  horm: {label: "HORM ts1x-train split (HORM has 1,836,206 structures in three splits)", materials: [t1x], properties: [Energy, Forces], provenance: Published, calc: wb97x, comment: "HORM also provides DFT Hessians, used to generate the augmented structures and labels by second-order Taylor expansion."}
  horm-aug-uni: {label: "ts1x-train with UniAug (isotropic Gaussian displacements, sigma 0.05 A, 12.5% of atoms; 1:1 original:augmented)", materials: [t1x], properties: [Energy, Forces], provenance: Augmented, calc: wb97x}
  horm-aug-mode: {label: "ts1x-train with ModeAug (normal-mode-weighted displacements, sigma 0.05 A; 1:1 original:augmented)", materials: [t1x], properties: [Energy, Forces], provenance: Augmented, calc: wb97x}
methods:
  EquiformerV2:
    hp: [numLayers, cutoffRadius]
    loss: "Weighted energy and force MAE (Eq. S1)"
    algorithm: "AdamW (weight decay 1e-3, gradient clipping 10), linear warm-up and cosine decay"
    impl: {lib: {local: "fairchem", comment: "Upstream EquiformerV2 implementation of the HORM benchmark"}}
    sims: [MolecularDynamics]
  GotenNet:
    hp: [numLayers, numFeatures, numRadialBasis, cutoffRadius]
    loss: "Weighted energy and force MAE (Eq. S1)"
runs:
  eq-df-noaug: {label: "EquiformerV2 (direct-force head) on HORM ts1x-train, no augmentation", method: EquiformerV2, dataset: horm, settings: {numLayers: {v: 4, loc: "SI Implementation details"}, cutoffRadius: {v: 12, loc: "SI Implementation details"}}, model: "EquiformerV2 direct-force head, no augmentation (13.9M parameters)"}
  eq-df-uni: {label: "EquiformerV2 (direct-force head) on HORM ts1x-train, UniAug", method: EquiformerV2, dataset: horm-aug-uni, settings: {numLayers: {v: 4, loc: "SI Implementation details"}, cutoffRadius: {v: 12, loc: "SI Implementation details"}}, model: "EquiformerV2 direct-force head, UniAug (13.9M parameters)"}
  eq-df-mode: {label: "EquiformerV2 (direct-force head) on HORM ts1x-train, ModeAug", method: EquiformerV2, dataset: horm-aug-mode, settings: {numLayers: {v: 4, loc: "SI Implementation details"}, cutoffRadius: {v: 12, loc: "SI Implementation details"}}, model: "EquiformerV2 direct-force head, ModeAug (13.9M parameters)"}
  eq-ag-noaug: {label: "EquiformerV2 (autograd forces) on HORM ts1x-train, no augmentation", method: EquiformerV2, dataset: horm, settings: {numLayers: {v: 4, loc: "SI Implementation details"}, cutoffRadius: {v: 12, loc: "SI Implementation details"}}, model: "EquiformerV2 autograd forces, no augmentation (13.9M parameters)"}
