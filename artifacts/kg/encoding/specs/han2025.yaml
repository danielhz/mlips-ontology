id: han2025
source:
  rank: 246
  year: "2025"
  first_author: "Bowen Han"
  title: "Benchmarking universal machine learning interatomic potentials for rapid analysis of inelastic neutron scattering data*"
  venue: "Machine Learning Science and Technology"
  doi: "10.1088/2632-2153/adfa68"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2506.01860v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "e899efdf55aa3a95f4b37e1d6864d006d4104f5443e98a8ccdfb2c4454348c34"
study_label: "Han and Cheng (2025): benchmarking universal MLIPs for phonons and inelastic neutron scattering"
scope: |
  Encoding scope: the twelve pretrained universal MLIPs of Table S7 and,
  as the one energy-valued error, the mean over about 5,000 crystals of the
  MAE of the phonon Helmholtz free energy against DFT (Table S4).
  Coordinate differences, phonon-frequency MAEs, DOS correlations, entropy
  and heat-capacity errors and the INS comparisons are not encoded.
materials:
  phonondb: {label: "Nearly 5,000 dynamically stable inorganic crystals from the Materials Project (phonon database built here)", class: "Inorganic crystalline materials"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, kpoints: "160 k-points per A^-3", comment: "Cutoff 1.6 x the largest ENMAX, PREC Accurate, 1e-8 eV; finite-displacement phonons with Phonopy, supercells of at least 12 A, Born charges for polar nonmetals (Methods)."}
datasets:
  phonondb: {label: "DFT phonon database of about 5,000 inorganic crystals (benchmark only)", materials: [phonondb], properties: [Energy, Forces], provenance: InHouse, calc: pbe}
external_models: [MatterSim-v1, SevenNet-0, MACE-MP-0-L2-2024.01.07, M3GNet-MPF-2021.2.8]
methods:
  CHGNet: {sims: [PhononCalculation, GeometryOptimization]}
  EquiformerV2: {sims: [PhononCalculation, GeometryOptimization]}
  GRACE: {sims: [PhononCalculation, GeometryOptimization]}
  MACE: {sims: [PhononCalculation, GeometryOptimization]}
  NequIP: {sims: [PhononCalculation, GeometryOptimization]}
  ORB: {sims: [PhononCalculation, GeometryOptimization]}
  eSEN: {sims: [PhononCalculation, GeometryOptimization]}
runs:
  esen-oam: {label: "eSEN-30M-OAM as distributed (esen 30m oam)", method: eSEN, model: "eSEN-30M-OAM (esen 30m oam)"}
  orb-v3: {label: "ORB v3 as distributed (orb v3 conservative inf omat)", method: ORB, model: "ORB v3 (orb v3 conservative inf omat)"}
  sevennet-mf-ompa: {label: "SevenNet-MF-ompa as distributed (7net-mf-ompa)", method: NequIP, model: "SevenNet-MF-ompa (7net-mf-ompa)"}
  grace-2l-oam: {label: "GRACE-2L-OAM as distributed (GRACE-2L-OAM)", method: GRACE, model: "GRACE-2L-OAM (GRACE-2L-OAM)"}
  mace-mpa-0: {label: "MACE-MPA-0 as distributed (mace-mpa-0-medium)", method: MACE, model: "MACE-MPA-0 (mace-mpa-0-medium)"}
  eqv2-m: {label: "eqV2 M as distributed (eqV2 153M omat mp salex)", method: EquiformerV2, model: "eqV2 M (eqV2 153M omat mp salex)"}
  orb-v1: {label: "ORB v1 as distributed (orbff-v1-20240827)", method: ORB, model: "ORB v1 (orbff-v1-20240827)"}
  chgnet: {label: "CHGNet as distributed (CHGNet-MPtrj-2024.2.13-PES-11M)", method: CHGNet, model: "CHGNet (CHGNet-MPtrj-2024.2.13-PES-11M)"}
