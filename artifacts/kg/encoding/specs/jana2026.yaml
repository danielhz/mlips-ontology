  first_author: "Asmita Jana"
  title: "Benchmarking machine-learned potentials for adsorption on Pt and $$\\textrm{IrO}_2$$ surfaces using OC20 and OMat24"
  venue: "Discover Chemistry."
  doi: "10.1007/s44371-026-00865-5"
