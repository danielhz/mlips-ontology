  iso17: {label: "ISO17 data set (645,000 conformations of 129 isomers; introduced here)", materials: [iso17], properties: [Energy, Forces], provenance: InHouse, n: {v: 645000, loc: "Sec. 5.3"}, sampling: [iso17-md], comment: "Training and validation: 4,000 steps from each of 80% of the trajectories; test sets: the remaining 1,000 conformations of those molecules, and all conformations of the remaining 20% of molecules."}
methods:
  SchNet:
    hp: [learningRate, batchSize]
    loss: "rho * squared energy error plus mean squared force error (Eq. 5), rho = 0.01 for combined training"
    algorithm: "Adam (mini-batches of 32), exponential learning-rate decay 0.96 every 100,000 steps, exponential moving average of weights (0.99)"
runs:
