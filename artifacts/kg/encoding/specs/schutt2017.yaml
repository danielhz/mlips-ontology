id: schutt2017
source:
  rank: 217
  year: "2017"
  first_author: "Kristof T. Schütt"
  title: "SchNet: A continuous-filter convolutional neural network for modeling quantum interactions"
  venue: "arXiv"
  doi: "10.48550/arxiv.1706.08566"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "1706.08566v5"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "5c537d6464ed412a4464066ffcd0153bc76221573e90b0ae024d0de4d6573cfc"
study_label: "Schütt et al. (2017): SchNet continuous-filter convolutional network, and the ISO17 data set"
scope: |
  Encoding scope: SchNet as introduced here (NeurIPS 2017) with its QM9
  U0 errors (Table 1), MD17 energy and force MAEs for models trained on
  energies only or on energies and forces with 1,000 and 50,000 examples
  (Table 2), and the ISO17 data set (introduced here) with the SchNet
  errors on its two test scenarios (Table 3). Values quoted for GDML, DTNN
  and MPNNs are not encoded.
materials:
  qm9: {label: "Small organic molecules with up to nine heavy atoms (QM9)", class: "Small organic molecules (equilibrium geometries)"}
  benzene: {label: "Benzene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde molecule (MD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (MD17)", class: "Small organic molecule (gas phase)"}
  aspirin: {label: "Aspirin molecule (MD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (MD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (MD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  iso17: {label: "C7O2H10 isomers (129 molecules from QM9)", formula: "C7O2H10", class: "Small organic molecules (MD trajectories)"}
sampling:
  iso17-md: {label: "Short MD trajectories of 129 C7O2H10 isomers (5,000 conformations each)", comment: "Isomers drawn randomly from the largest set of isomers in QM9 (Sec. 5.3)."}
datasets:
  qm9-50000: {label: "QM9 training set of 50,000 molecules", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 50000, loc: "Table 1"}, comment: "1,000 validation examples; the rest for testing."}
  qm9-100000: {label: "QM9 training set of 100,000 molecules", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 100000, loc: "Table 1"}, comment: "1,000 validation examples; the rest for testing."}
  qm9-110462: {label: "QM9 training set of 110,462 molecules", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 110462, loc: "Table 1"}, comment: "1,000 validation examples; the rest for testing."}
  md17-benzene-1000: {label: "MD17 benzene training set (1,000 examples)", materials: [benzene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
  md17-benzene-50000: {label: "MD17 benzene training set (50,000 examples)", materials: [benzene], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Table 2"}}
  md17-toluene-1000: {label: "MD17 toluene training set (1,000 examples)", materials: [toluene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
