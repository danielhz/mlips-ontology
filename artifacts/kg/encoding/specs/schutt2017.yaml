  md17-salicylic-acid-1000: {label: "MD17 salicylic acid training set (1,000 examples)", materials: [salicylic-acid], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
  md17-salicylic-acid-50000: {label: "MD17 salicylic acid training set (50,000 examples)", materials: [salicylic-acid], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Table 2"}}
  md17-aspirin-1000: {label: "MD17 aspirin training set (1,000 examples)", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
  md17-aspirin-50000: {label: "MD17 aspirin training set (50,000 examples)", materials: [aspirin], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Table 2"}}
  md17-ethanol-1000: {label: "MD17 ethanol training set (1,000 examples)", materials: [ethanol], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
  md17-ethanol-50000: {label: "MD17 ethanol training set (50,000 examples)", materials: [ethanol], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Table 2"}}
  md17-uracil-1000: {label: "MD17 uracil training set (1,000 examples)", materials: [uracil], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
  md17-uracil-50000: {label: "MD17 uracil training set (50,000 examples)", materials: [uracil], properties: [Energy, Forces], provenance: Published, n: {v: 50000, loc: "Table 2"}}
  md17-naphthalene-1000: {label: "MD17 naphthalene training set (1,000 examples)", materials: [naphthalene], properties: [Energy, Forces], provenance: Published, n: {v: 1000, loc: "Table 2"}}
