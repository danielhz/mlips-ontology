  kf-train: {label: "KF training set (14,964 configurations, 3,642,464 atoms)", materials: [kf], properties: [Energy, Forces], provenance: InHouse, n: {v: 14964, loc: "Sec. II A"}, calc: scan, sampling: [al]}
