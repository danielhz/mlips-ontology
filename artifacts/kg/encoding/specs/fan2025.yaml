study_label: "Fan, Whittaker and Asta (2025): ACE potentials for liquid and five solid polymorphs of NaF and KF trained on SCAN data"
scope: |
  Encoding scope: one linear ACE potential each for NaF and KF (268
  basis functions), trained by active learning (extrapolation grade,
  short bonds, uniform MD snapshots) on SCAN data for the liquid and the
  B1, B2, B3, B4 and H5 polymorphs up to 2000 K (NaF) or 1600 K (KF) and
  100 GPa; final training and test RMSEs (Sec. II C) and the 1-million-
  atom MD cost. Per-snapshot error bounds from long MD (Figs. 4-5),
  melting points, thermodynamic and transport properties are not metrics.
hyperparameters:
  nbasis: {label: "Number of ACE basis functions", name: "number of basis functions", datatype: integer}
materials:
  naf: {label: "NaF liquid and B1, B2, B3, B4, H5 polymorphs", formula: NaF, class: "Molten salts and ionic crystals"}
  kf: {label: "KF liquid and B1, B2, B3, B4, H5 polymorphs", formula: KF, class: "Molten salts and ionic crystals"}
reference:
  scan: {type: DFT, code: VASP, xc: SCAN, cutoff: 600, kpoints: "Gamma point (cells > 200 atoms)", comment: "No dispersion correction; SCF convergence 0.1 meV"}
sampling:
  al: {label: "Active learning from MD with intermediate ACE potentials: high extrapolation grade, short bond lengths or uniform time intervals, until the maximum energy error is below 5 meV/atom; 4:1 train/test split per MD run"}
datasets:
