  ace-kf: {label: "ACE potential for KF", method: ACE, dataset: kf-train, settings: {cutoffRadius: {v: 6.5, loc: "Sec. II C"}, nbasis: {v: 268, loc: "Sec. II C"}}, model: "ACE KF (SCAN)"}
