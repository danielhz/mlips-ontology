id: shaidu2024
source:
  rank: 446
  year: "2024"
  first_author: "Yusuf Shaidu"
  title: "Incorporating long-range electrostatics in neural network potentials via variational charge equilibration from shortsighted ingredients"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-024-01225-6"
  kg_relevance: "Application/model instance"
  arxiv_id: ""
  pdf_version: "publisher"
  pdf_sha256: "06357e847a0ef15f9f7344a40f0f4e49f563a3c136e89ba370f09771d81d9108"
study_label: "Shaidu et al. (2024): long-range electrostatics in neural-network potentials via variational charge equilibration from short-range ingredients"
scope: |
  Encoding scope: short-range (SR, 2G-like) and long-range (LR) PANNA
  potentials, the LR model trained with Hirshfeld-charge targets
  (gamma_q > 0) or without (gamma_q = 0), on the four 4G-HDNNP benchmark
  data sets of Ref. 20 (Tables 1-4), on a molten-NaCl data set (Ref. 11)
  and on Li adsorbed on graphene, with the training and validation RMSEs
  stated. Rows for 2G- and 4G-HDNNP in Tables 1-4 are quoted from Ref. 20
  and not encoded. Charges in milli-e are not energy/force metrics.
materials:
  cc: {label: "Carbon chains C10H2 and C10H3+", class: "Small organic molecule (gas phase)"}
  ag: {label: "Silver trimers Ag3+ and Ag3-", class: "Metal cluster"}
  nacl: {label: "NaCl clusters Na9Cl8+ and Na8Cl8", class: "Metal cluster"}
  au: {label: "Au dimer on MgO(001)", class: "Supported metal nanoparticle catalyst / oxide surface"}
  molten: {label: "Crystalline and molten NaCl and NaCl dimers", formula: "NaCl", class: "Molten salt"}
  ligr: {label: "Li adsorbed on graphene", class: "2D material"}
reference:
  ref20: {type: DFT, comment: "Reference energies, forces and Hirshfeld charges of the 4G-HDNNP benchmark sets (Ref. 20)."}
  ref11: {type: DFT, comment: "Molten-NaCl data set of Ref. 11 (no atomic charges)."}
  ligr-dft: {type: DFT, xc: PBE, comment: "Li/graphene data; details in Supplementary Note 3."}
datasets:
  cc: {label: "Carbon-chain benchmark data (Ref. 20)", materials: [cc], properties: [Energy, Forces], provenance: Published, calc: ref20}
  ag: {label: "Silver-trimer benchmark data (Ref. 20)", materials: [ag], properties: [Energy, Forces], provenance: Published, calc: ref20}
  nacl: {label: "NaCl-cluster benchmark data (Ref. 20)", materials: [nacl], properties: [Energy, Forces], provenance: Published, calc: ref20}
  au: {label: "Au2/MgO(001) benchmark data (Ref. 20)", materials: [au], properties: [Energy, Forces], provenance: Published, calc: ref20}
  molten: {label: "Molten-salt NaCl data (about 112,000 configurations; 80/20 split)", materials: [molten], properties: [Energy, Forces], provenance: Published, calc: ref11}
  ligr: {label: "Li/graphene data", materials: [ligr], properties: [Energy, Forces], provenance: InHouse, calc: ligr-dft}
methods:
  HDNNP:
    impl: {lib: {local: PANNA}}
    sims: [MolecularDynamics]
  PANNA-LR:
    hp: [cutoffRadius]
    impl: {lib: {local: PANNA}}
    sims: [MolecularDynamics]
runs:
  cc-sr: {label: "short-range PANNA NNP (2G-like) for carbon chains C10H2 and C10H3+ (ref. 20 data)", method: HDNNP, dataset: cc, model: "cc sr (Shaidu 2024)"}
  cc-lrq: {label: "long-range PANNA model trained with charges (gamma_q > 0) for carbon chains C10H2 and C10H3+ (ref. 20 data)", method: PANNA-LR, dataset: cc, model: "cc lrq (Shaidu 2024)"}
  cc-lr0: {label: "long-range PANNA model trained without charges (gamma_q = 0) for carbon chains C10H2 and C10H3+ (ref. 20 data)", method: PANNA-LR, dataset: cc, model: "cc lr0 (Shaidu 2024)"}
  ag-sr: {label: "short-range PANNA NNP (2G-like) for silver trimers Ag3+ and Ag3- (ref. 20 data)", method: HDNNP, dataset: ag, model: "ag sr (Shaidu 2024)"}
  ag-lrq: {label: "long-range PANNA model trained with charges (gamma_q > 0) for silver trimers Ag3+ and Ag3- (ref. 20 data)", method: PANNA-LR, dataset: ag, model: "ag lrq (Shaidu 2024)"}
  ag-lr0: {label: "long-range PANNA model trained without charges (gamma_q = 0) for silver trimers Ag3+ and Ag3- (ref. 20 data)", method: PANNA-LR, dataset: ag, model: "ag lr0 (Shaidu 2024)"}
  nacl-sr: {label: "short-range PANNA NNP (2G-like) for NaCl clusters Na9Cl8+ and Na8Cl8 (ref. 20 data)", method: HDNNP, dataset: nacl, model: "nacl sr (Shaidu 2024)"}
  nacl-lrq: {label: "long-range PANNA model trained with charges (gamma_q > 0) for NaCl clusters Na9Cl8+ and Na8Cl8 (ref. 20 data)", method: PANNA-LR, dataset: nacl, model: "nacl lrq (Shaidu 2024)"}
  nacl-lr0: {label: "long-range PANNA model trained without charges (gamma_q = 0) for NaCl clusters Na9Cl8+ and Na8Cl8 (ref. 20 data)", method: PANNA-LR, dataset: nacl, model: "nacl lr0 (Shaidu 2024)"}
  au-sr: {label: "short-range PANNA NNP (2G-like) for Au dimer on MgO(001) (ref. 20 data)", method: HDNNP, dataset: au, model: "au sr (Shaidu 2024)"}
  au-lrq: {label: "long-range PANNA model trained with charges (gamma_q > 0) for Au dimer on MgO(001) (ref. 20 data)", method: PANNA-LR, dataset: au, model: "au lrq (Shaidu 2024)"}
