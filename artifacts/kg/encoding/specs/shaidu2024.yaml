  molten-sr: {label: "Short-range PANNA NNP for molten NaCl", method: HDNNP, dataset: molten, model: "molten NaCl SR (Shaidu 2024)"}
  molten-lr: {label: "Long-range PANNA model for molten NaCl (descriptor cutoff 10 Bohr; total charge only)", method: PANNA-LR, dataset: molten, model: "molten NaCl LR (Shaidu 2024)"}
  ligr-sr: {label: "Short-range PANNA NNP for Li on graphene", method: HDNNP, dataset: ligr, model: "Li/graphene SR (Shaidu 2024)"}
  ligr-lr: {label: "Long-range PANNA model for Li on graphene", method: PANNA-LR, dataset: ligr, model: "Li/graphene LR (Shaidu 2024)"}
