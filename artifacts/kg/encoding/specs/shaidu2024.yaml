gaps:
  - "Tables 1-4 label their rows train/test while the captions and text call them training and validation; the role follows the captions. Charge RMSEs (milli-e) and the 2G/4G-HDNNP rows (quoted from Ref. 20) are not encoded. The molten-NaCl RMSEs do not say whether they are training or validation errors (role null)."
  - "Equations of state, RDFs, Li diffusion coefficients and dimer energy curves are properties. Reference-level details for the Ref. 20 and Ref. 11 data are in those papers."
