  ala-b-woh: {label: "GM-NN for alanine dipeptide after AL with biased MD (300 K, tau = 0.25, without H)", method: GMNN, dataset: ala-al, model: "alanine dipeptide GM-NN (biased MD (300 K, tau = 0.25, without H))"}
