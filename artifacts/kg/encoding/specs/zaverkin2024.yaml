  mil600-meta: {label: "GM-NN for MIL-53(Al) after AL with 600 K metadynamics (0 MPa)", method: GMNN, dataset: mil-al, model: "MIL-53(Al) GM-NN (600 K metadynamics (0 MPa))"}
