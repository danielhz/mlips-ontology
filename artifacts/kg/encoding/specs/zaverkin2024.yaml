id: zaverkin2024
source:
  rank: 444
  year: "2024"
  first_author: "Viktor Zaverkin"
  title: "Uncertainty-biased molecular dynamics for learning uniformly accurate interatomic potentials"
  venue: "npj Computational Materials"
  doi: "10.1038/s41524-024-01254-1"
  kg_relevance: "Training/reliability"
  arxiv_id: "2312.01416v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "3c9b4fc0e922611e3058af73fa7b183ae88aa5c711fbbbb85812a43af5371632"
study_label: "Zaverkin et al. (2024): uncertainty-biased molecular dynamics with calibrated gradient-based uncertainties for active learning of GM-NN potentials"
scope: |
  Encoding scope: Gaussian moment neural network (GM-NN) potentials
  obtained by active learning (up to 512 configurations; five repeats)
  with candidate pools from random selection, unbiased MD, metadynamics
  or uncertainty-biased MD (bias forces and bias stress), for alanine
  dipeptide (AMBER ff19SB labels) and MIL-53(Al) (CP2K PBE-D3(BJ)), and
  the test RMSEs of the final models of each experiment (Tables 1-2;
  means over five runs). CV-space coverage and auto-correlation times
  are exploration diagnostics.
materials:
  ala: {label: "Alanine dipeptide in vacuum", formula: "C6H12N2O3", class: "Biomolecule (peptide)"}
  mil53: {label: "Flexible metal-organic framework MIL-53(Al) (closed- and large-pore states)", class: "Metal-organic frameworks"}
reference:
  amber: {type: REF, comment: "AMBER ff19SB force field as the reference for alanine dipeptide."}
  pbed3: {type: DFT, code: {local: CP2K}, xc: PBE, pp: {local: GTH}, comment: "PBE-D3(BJ), TZVP/plane-wave hybrid basis, 1000 Ry cutoff, CP2K 2023.1."}
datasets:
  ala-al: {label: "Alanine-dipeptide configurations acquired by active learning (at most 512 per experiment)", materials: [ala], properties: [Energy, Forces], provenance: InHouse, calc: amber}
  mil-al: {label: "MIL-53(Al) configurations acquired by active learning from 32 perturbed closed-pore structures (at most 512 per experiment)", materials: [mil53], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: pbed3}
methods:
  GMNN:
    algorithm: "Adam with early stopping; batch selection maximising distances in sketched gradient-feature space"
    sims: [MolecularDynamics]
runs:
  ala-rs300: {label: "GM-NN for alanine dipeptide after AL with random sel. (300 K)", method: GMNN, dataset: ala-al, model: "alanine dipeptide GM-NN (random sel. (300 K))"}
  ala-rs600: {label: "GM-NN for alanine dipeptide after AL with random sel. (600 K)", method: GMNN, dataset: ala-al, model: "alanine dipeptide GM-NN (random sel. (600 K))"}
