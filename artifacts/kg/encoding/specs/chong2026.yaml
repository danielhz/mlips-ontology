id: chong2026
source:
  rank: 643
  year: "2026"
  first_author: "Sanggyu Chong"
  title: "Resolving the body-order paradox of machine learning interatomic potentials"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0303302"
  kg_relevance: "Application/model instance"
  arxiv_id: "2509.14146v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "4d3738fe97fface2dfac0e77afce38c6662ef7a09b8cd1f9db9b492a54eb50cd"
study_label: "Chong et al. (2026): resolving the body-order paradox of machine-learning interatomic potentials"
scope: |
  Encoding scope: SOAP-BPNN, MACE and PET models trained on FHI-aims PBE
  hydrogen 8-mers sampled from low- and high-density bulk hydrogen, on
  the mixed data set and on each density regime separately, with the test
  RMSEs of SI Tables S1-S3. The body-order decompositions and DMRG
  benchmarks are analyses of the reference and the models, not metrics.
materials:
  h8: {label: "Hydrogen 8-mers cut from low-density (molecular, insulating) and high-density (atomic, metallic) bulk hydrogen", formula: H, class: "hydrogen clusters"}
reference:
  pbe: {type: DFT, code: FHIaims, xc: PBE, basis: "tight species defaults", comment: "FHI-aims 221103.1; Gaussian smearing 0.025 eV."}
sampling:
  clusters: {label: "8-mers cut around random atoms (high density: 7 nearest neighbours; low density: nearest bonded pairs) from the 100 highest- and 100 lowest-density FPS configurations of the Cheng et al. bulk-hydrogen AIMD set"}
datasets:
  mixed: {label: "10,000 hydrogen 8-mers, low and high density 1:1 (8:1:1 split, stratified)", materials: [h8], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. IV"}, calc: pbe, sampling: [clusters]}
  low: {label: "Low-density hydrogen 8-mers only", materials: [h8], properties: [Energy, Forces], provenance: InHouse, calc: pbe, sampling: [clusters]}
  high: {label: "High-density hydrogen 8-mers only", materials: [h8], properties: [Energy, Forces], provenance: InHouse, calc: pbe, sampling: [clusters]}
methods:
  HDNNP:
    hp: [cutoffRadius]
    algorithm: "SOAP-BPNN: Behler-Parrinello atomic networks on SOAP descriptors"
  MACE:
    hp: [cutoffRadius]
    loss: "Energy:force 1:100 then reweighted in the second stage (default routine)"
  PET:
    hp: [cutoffRadius]
runs:
  bpnn-mixed: {label: "SOAP-BPNN trained on hydrogen 8-mers (both densities)", method: HDNNP, dataset: mixed, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "SOAP-BPNN H 8-mers (both densities)"}
  mace-mixed: {label: "MACE trained on hydrogen 8-mers (both densities)", method: MACE, dataset: mixed, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "MACE H 8-mers (both densities)"}
  pet-mixed: {label: "PET trained on hydrogen 8-mers (both densities)", method: PET, dataset: mixed, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "PET H 8-mers (both densities)"}
  bpnn-low: {label: "SOAP-BPNN trained on hydrogen 8-mers (low density only)", method: HDNNP, dataset: low, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "SOAP-BPNN H 8-mers (low density only)"}
  mace-low: {label: "MACE trained on hydrogen 8-mers (low density only)", method: MACE, dataset: low, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "MACE H 8-mers (low density only)"}
  pet-low: {label: "PET trained on hydrogen 8-mers (low density only)", method: PET, dataset: low, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "PET H 8-mers (low density only)"}
  bpnn-high: {label: "SOAP-BPNN trained on hydrogen 8-mers (high density only)", method: HDNNP, dataset: high, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "SOAP-BPNN H 8-mers (high density only)"}
  mace-high: {label: "MACE trained on hydrogen 8-mers (high density only)", method: MACE, dataset: high, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "MACE H 8-mers (high density only)"}
  pet-high: {label: "PET trained on hydrogen 8-mers (high density only)", method: PET, dataset: high, settings: {cutoffRadius: {v: 5.5, loc: "Sec. II C"}}, model: "PET H 8-mers (high density only)"}
results:
  - {key: bpnn-mixed-test, model: bpnn-mixed, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (both densities)", location: "Table S1"}, metrics: [[RMSE, Energy, 24.2, meV/atom, "test energy RMSE on h8 (both densities): SOAP-BPNN", "Table S1 (0.0242 eV/atom)"], [RMSE, Force, 367.2, meV/A, "test force RMSE on h8 (both densities): SOAP-BPNN", "Table S1 (0.3672 eV/A)"]]}
  - {key: mace-mixed-test, model: mace-mixed, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (both densities)", location: "Table S1"}, metrics: [[RMSE, Energy, 4.0, meV/atom, "test energy RMSE on h8 (both densities): MACE", "Table S1 (0.004 eV/atom)"], [RMSE, Force, 95.1, meV/A, "test force RMSE on h8 (both densities): MACE", "Table S1 (0.0951 eV/A)"]]}
  - {key: pet-mixed-test, model: pet-mixed, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (both densities)", location: "Table S1"}, metrics: [[RMSE, Energy, 2.4, meV/atom, "test energy RMSE on h8 (both densities): PET", "Table S1 (0.0024 eV/atom)"], [RMSE, Force, 66.5, meV/A, "test force RMSE on h8 (both densities): PET", "Table S1 (0.0665 eV/A)"]]}
  - {key: bpnn-low-test, model: bpnn-low, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (low density only)", location: "Table S2"}, metrics: [[RMSE, Energy, 18.3, meV/atom, "test energy RMSE on h8 (low density only): SOAP-BPNN", "Table S2 (0.0183 eV/atom)"], [RMSE, Force, 2350.1, meV/A, "test force RMSE on h8 (low density only): SOAP-BPNN", "Table S2 (2.3501 eV/A)"]]}
  - {key: mace-low-test, model: mace-low, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (low density only)", location: "Table S2"}, metrics: [[RMSE, Energy, 1.8, meV/atom, "test energy RMSE on h8 (low density only): MACE", "Table S2 (0.0018 eV/atom)"], [RMSE, Force, 60.1, meV/A, "test force RMSE on h8 (low density only): MACE", "Table S2 (0.0601 eV/A)"]]}
  - {key: pet-low-test, model: pet-low, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (low density only)", location: "Table S2"}, metrics: [[RMSE, Energy, 1.2, meV/atom, "test energy RMSE on h8 (low density only): PET", "Table S2 (0.0012 eV/atom)"], [RMSE, Force, 30.6, meV/A, "test force RMSE on h8 (low density only): PET", "Table S2 (0.0306 eV/A)"]]}
  - {key: bpnn-high-test, model: bpnn-high, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (high density only)", location: "Table S3"}, metrics: [[RMSE, Energy, 23.2, meV/atom, "test energy RMSE on h8 (high density only): SOAP-BPNN", "Table S3 (0.0232 eV/atom)"], [RMSE, Force, 405.5, meV/A, "test force RMSE on h8 (high density only): SOAP-BPNN", "Table S3 (0.4055 eV/A)"]]}
  - {key: mace-high-test, model: mace-high, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (high density only)", location: "Table S3"}, metrics: [[RMSE, Energy, 2.6, meV/atom, "test energy RMSE on h8 (high density only): MACE", "Table S3 (0.0026 eV/atom)"], [RMSE, Force, 70.4, meV/A, "test force RMSE on h8 (high density only): MACE", "Table S3 (0.0704 eV/A)"]]}
  - {key: pet-high-test, model: pet-high, material: h8, role: test, eval_data: {label: "Test split of the hydrogen 8-mer data (high density only)", location: "Table S3"}, metrics: [[RMSE, Energy, 3.3, meV/atom, "test energy RMSE on h8 (high density only): PET", "Table S3 (0.0033 eV/atom)"], [RMSE, Force, 71.9, meV/A, "test force RMSE on h8 (high density only): PET", "Table S3 (0.0719 eV/A)"]]}
gaps:
  - "SOAP-BPNN is mapped to the registry method HDNNP (Behler-Parrinello networks on SOAP descriptors). Sizes of the single-density training sets are not stated in the text read."
  - "Per-body-order RMSEs (Fig. S1), body-order energy decompositions, prediction spreads and the DFT/DMRG many-body expansions are analyses, not metrics."
