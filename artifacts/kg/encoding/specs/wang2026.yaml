id: wang2026
source:
  rank: 294
  year: "2026"
  first_author: "Meiyan Wang"
  title: "Dataset-aware entropy-maximized active learning for machine-learned interatomic potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2605.20384"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2605.20384v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "ae6cbfbe7582119110df582256d2d9141775095efe4009317138a2aff28f5cbc"
study_label: "Wang, Rao and Zhu (2026): dataset-aware entropy-maximised active learning with Allegro-OAM-L fine-tuning"
scope: |
  Encoding scope: Allegro-OAM-L fine-tuned on N = 100, 250, 500 or 800
  structures drawn either from the entropy-driven active-learning pool or
  from random-MD pools for carbon (r2SCAN+rVV10), silicon and NaCl (PBE),
  with in-distribution test MAEs (Tables 1-3; means over three seeds), the
  curated independent-test MAEs at N = 800 (Table 4) and the carbon mixed
  80/20 pool (Table 5). Phonon comparisons are not error metrics.
materials:
  C: {label: "Carbon polymorphs (diamond, graphite, lonsdaleite, M-carbon and other allotropes) at 0-100 GPa", formula: "C", class: "Elemental covalent solid", wikidata: Q623}
  Si: {label: "Silicon (diamond cubic, beta-tin, Imma, simple hexagonal) at 0-20 GPa", formula: "Si", class: "Elemental semiconductor", wikidata: Q670}
  NaCl: {label: "Sodium chloride (B1 rocksalt and B2 CsCl-type) at 0-40 GPa", formula: "NaCl", class: "Ionic crystal", wikidata: Q2314}
reference:
  r2scan-rvv10: {type: DFT, code: VASP, xc: {local: "r2SCAN+rVV10"}, pp: PAW, cutoff: 600, kpoints: "Gamma-centred, density 40 1/A", comment: "BPARAM 11.95; Gaussian smearing 0.05 eV; EDIFF 1e-6 (carbon)."}
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 600, kpoints: "Gamma-centred, density 40 1/A", comment: "Gaussian smearing 0.05 eV; EDIFF 1e-6 (silicon, NaCl)."}
sampling:
  entropy: {label: "Entropy-biased NVT MD (local fingerprint entropy) with global log-det dataset-entropy filtering, started from Allegro-OAM-L and pre-scaled seed cells over a temperature-pressure grid"}
  random-md: {label: "Unbiased NVT Langevin MD with Allegro-OAM-L over the same condition grid"}
datasets:
  C-entropy: {label: "Carbon entropy-driven pool (814 DFT-labelled structures)", materials: [C], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 814, loc: "Sec. 4.1"}, calc: r2scan-rvv10, sampling: [entropy]}
  C-random: {label: "Carbon random-MD pool (1536 DFT-labelled structures)", materials: [C], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 1536, loc: "Sec. 4.1"}, calc: r2scan-rvv10, sampling: [random-md]}
  Si-entropy: {label: "Silicon entropy-driven pool (645 DFT-labelled structures)", materials: [Si], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 645, loc: "Sec. 4.1"}, calc: pbe, sampling: [entropy]}
  Si-random: {label: "Silicon random-MD pool (594 DFT-labelled structures)", materials: [Si], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 594, loc: "Sec. 4.1"}, calc: pbe, sampling: [random-md]}
  NaCl-entropy: {label: "NaCl entropy-driven pool (524 DFT-labelled structures)", materials: [NaCl], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 524, loc: "Sec. 4.1"}, calc: pbe, sampling: [entropy]}
  NaCl-random: {label: "NaCl random-MD pool (557 DFT-labelled structures)", materials: [NaCl], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 557, loc: "Sec. 4.1"}, calc: pbe, sampling: [random-md]}
  C-mixed: {label: "Carbon mixed pool: 640 entropy-driven plus 160 near-equilibrium (max |F| < 2 eV/A) random-MD structures", materials: [C], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 800, loc: "Sec. 4.4.5"}, calc: r2scan-rvv10, sampling: [entropy, random-md]}
methods:
  Allegro:
    hp: [learningRate, batchSize]
    loss: "Huber loss, energy 1.0, forces 1.0, stress 0.01; energy-binned sample weights (3.0, 1.0, 0.5)"
    algorithm: "Full fine-tuning with Adam, ReduceLROnPlateau (patience 15, factor 0.5), EMA 0.999, gradient clipping 0.015, early stopping (patience 30)"
    impl: {lib: NequIP, comment: "NequIP framework with PyTorch Lightning"}
    sims: [MolecularDynamics, PhononCalculation]
runs:
  C-entropy-100: {label: "Allegro-OAM-L fine-tuned on 100 Carbon structures from the entropy pool (three seeds)", method: Allegro, dataset: C-entropy, settings: {learningRate: {v: 0.00005, loc: "Sec. 3.2"}, batchSize: {v: 4, loc: "Sec. 3.2 (effective)"}}, model: "Allegro-OAM-L fine-tuned, Carbon, entropy, N = 100", base_model: {label: "Allegro-OAM-L", relation: fine-tuned, location: "Sec. 3.2"}}
  C-entropy-250: {label: "Allegro-OAM-L fine-tuned on 250 Carbon structures from the entropy pool (three seeds)", method: Allegro, dataset: C-entropy, settings: {learningRate: {v: 0.00005, loc: "Sec. 3.2"}, batchSize: {v: 4, loc: "Sec. 3.2 (effective)"}}, model: "Allegro-OAM-L fine-tuned, Carbon, entropy, N = 250", base_model: {label: "Allegro-OAM-L", relation: fine-tuned, location: "Sec. 3.2"}}
