id: bochkarev2024
source:
  rank: 202
  year: "2024"
  first_author: "Anton S. Bochkarev"
  title: "Graph Atomic Cluster Expansion for Semilocal Interactions beyond Equivariant Message Passing"
  venue: "Physical Review X"
  doi: "10.1103/physrevx.14.021036"
  kg_relevance: "Method/model"
  arxiv_id: "2311.16326v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "efbf1fe3cbc5d93f4f05d7f3c8a9942665992d99d495ccbad8fe16464e5686f2"
study_label: "Bochkarev, Lysogorskiy and Drautz (2024): graph atomic cluster expansion (GRACE)"
scope: |
  Encoding scope: graph ACE (ACE(g), called GRACE in the registry; introduced
  here) and the ACE(g) fits whose errors are tabulated: the ten revised MD17
  molecules trained on 1,000 and on 50 configurations (Table I) and 3BPA
  (Table II). The four-atom Si cluster and carbon fits, and the carbon MACE
  model trained for comparison, have errors only in figures (Figs. 10, 11);
  their data sets and runs are encoded without results. Errors of other
  models quoted from the literature in Tables I and II are not encoded.
materials:
  aspirin: {label: "Aspirin molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  azobenzene: {label: "Azobenzene molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  benzene: {label: "Benzene molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  paracetamol: {label: "Paracetamol molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (revised MD17)", class: "Small organic molecule (gas phase)"}
  3BPA: {label: "3-(benzyloxy)pyridin-2-amine (3BPA) molecule", class: "Flexible drug-like organic molecule (gas phase)"}
  Si4: {label: "Four-atom silicon clusters with randomised atomic positions", formula: "Si4", class: "Atomic clusters"}
  C: {label: "Carbon (sp2 and sp3 bonded, amorphous and liquid, crystalline bulk, clusters of two to six atoms)", formula: "C", class: "Elemental solid, liquid and clusters", wikidata: Q623}
reference:
  si-dft: {type: DFT, code: FHIaims, xc: PBE, comment: "FHI-aims with tight settings, non-magnetic calculations (Sec. IX A)."}
sampling:
  md17-aimd: {label: "Configurations from ab initio molecular dynamics (MD17)", comment: "1,000 (or 50) training configurations drawn at random per molecule; the remaining 99,000 used for testing (Sec. IX B, Table I)."}
  bpa-300K: {label: "3BPA training configurations from ab initio MD at 300 K", comment: "Test sets: MD at 300 K, 600 K and 1200 K, and relaxed dihedral slices (Sec. IX B)."}
  si-random: {label: "Randomised four-atom Si clusters", comment: "Unrelaxed clusters with completely randomised positions, all interatomic distances below 8 A (Sec. IX A)."}
