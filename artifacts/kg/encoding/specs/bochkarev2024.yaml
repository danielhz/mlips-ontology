hyperparameters:
  lmax: {label: "Maximum angular momentum lmax of the atomic base and intermediate couplings", name: "lmax", datatype: integer}
  nmax: {label: "Number of radial basis functions nmax", name: "nmax", datatype: integer}
methods:
  GRACE:
    hp: [cutoffRadius, numLayers, lmax, nmax, learningRate, batchSize]
    loss: "Weighted sum of squared energy and force errors with L2 regularisation of the expansion coefficients (Eqs. C4, C5)"
    algorithm: "L-BFGS-B (scipy); for carbon the AMSGrad variant of Adam followed by L-BFGS-B"
    impl: {lib: {local: "tensorpotential", comment: "TensorFlow implementation of ACE(g) fitting and evaluation, double precision; MD through a LAMMPS pair style calling the TensorFlow graph on the GPU"}}
    sims: [MolecularDynamics]
  MACE:
    hp: [cutoffRadius, numFeatures, lmax, learningRate, batchSize]
    algorithm: "AMSGrad variant of Adam"
runs:
  grace-aspirin-1000: {label: "ACE(g) fit to rMD17 aspirin, 1000 training configurations", method: GRACE, dataset: aspirin-1000, settings: {cutoffRadius: {v: 4, loc: "App. C e"}, numLayers: {v: 2, loc: "App. C e"}, lmax: {v: 3, loc: "App. C e"}}, model: "ACE(g) rMD17 aspirin model (1000 configurations)"}
