methods:
  GMNN:
    hp: [cutoffRadius, numLayers, learningRate, batchSize, numEpochs]
    loss: "Squared energy error plus force error weighted by wF/(3 Nat), wE = 1 and wF = 100 A^2 (Eq. 16); wF = 0 for QM9"
    algorithm: "AMSGrad with constant learning rate and early stopping on a validation set"
    impl: {lib: {local: "GM-NN (TensorFlow)", comment: "TensorFlow implementation with ASE neighbour lists"}}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  qm9-1000: {label: "GM-sNN trained on 1,000 QM9 energies", method: GMNN, dataset: qm9-1000, settings: {cutoffRadius: {v: 3.0, loc: "Secs. 2.2, 2.3, 3"}, numLayers: {v: 2, loc: "Sec. 2.2"}, learningRate: {v: 0.001, loc: "Sec. 2.3"}, batchSize: {v: 32, loc: "Sec. 2.3"}, numEpochs: {v: 5000, loc: "Sec. 2.3"}}, model: "GM-sNN QM9 model (1,000 training structures)", trainingHardware: "NVIDIA Tesla V100-SXM2-32GB; 5,000 epochs took from 1 hour (1,000 structures) to 3 days (110,426 structures)"}
