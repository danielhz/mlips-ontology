id: zaverkin2020
source:
  rank: 211
  year: "2020"
  first_author: "Viktor Zaverkin"
  title: "Gaussian Moments as Physically Inspired Molecular Descriptors for Accurate and Scalable Machine Learning Potentials"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.0c00347"
  kg_relevance: "Method/model"
  arxiv_id: "2109.07421v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "2be9bd3314ba8f470e485389887c1012b49c058f249dcb821b3dd9536da7769d"
study_label: "Zaverkin and Kästner (2020): Gaussian moments as molecular descriptors for neural network potentials (GM-NN)"
scope: |
  Encoding scope: the GM-NN method (Gaussian moment descriptor with
  atomistic feed-forward networks; GMNN in the registry; introduced here)
  with its shallow (GM-sNN) and deep (GM-dNN) networks: QM9 energy errors
  for seven training-set sizes (Table 1) and the size-transfer test, MD17
  energy and force MAEs (Table 2), ISO17 (Table 3), and the two ethanol
  models trained on new PBE-D3(BJ) data at 500 K and 1000 K (barriers in
  Table 4, no error metric). Learning curves shown only in figures and
  values quoted from other papers are not encoded.
materials:
  qm9: {label: "Small organic molecules with up to nine heavy atoms (QM9)", class: "Small organic molecules (equilibrium geometries)"}
  qm9-large: {label: "QM9 molecules with more than 15 atoms", class: "Small organic molecules (equilibrium geometries)"}
  benzene: {label: "Benzene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde molecule (MD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (MD17)", class: "Small organic molecule (gas phase)"}
  aspirin: {label: "Aspirin molecule (MD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (MD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (MD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (MD17)", class: "Small organic molecule (gas phase)"}
  iso17: {label: "C7O2H10 isomers (ISO17)", formula: "C7O2H10", class: "Small organic molecules (MD trajectories)"}
reference:
  md17: {type: DFT, xc: {local: "PBE+vdW-TS"}, comment: "Level of the MD17 data set as stated in Sec. 3.4; the basis is not given."}
  ethanol: {type: DFT, code: {local: "Turbomole 7.1"}, xc: {local: "PBE-D3(BJ)"}, basis: "6-31G*", comment: "Single points within ChemShell on geometries from GFN2-xTB Born-Oppenheimer MD (Sec. 3.4)."}
sampling:
  xtb-md: {label: "GFN2-xTB Born-Oppenheimer MD at 500 K or 1000 K, every 10th step recomputed with DFT", comment: "NVT, Berendsen thermostat, 0.5 fs, 50,000 steps (25 ps); 5,000 structures per data set."}
