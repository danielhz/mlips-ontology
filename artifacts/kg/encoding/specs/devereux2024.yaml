source:
  rank: 615
  year: "2024"
  first_author: "Christian Devereux"
  title: "Force training neural network potential energy surface models"
  venue: "International Journal of Chemical Kinetics"
  doi: "10.1002/kin.21759"
  kg_relevance: "Method/model"
