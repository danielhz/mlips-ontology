  first_author: "Akram Ibrahim"
  title: "Modeling Chemical Exfoliation of Non-van der Waals Chromium Sulfides by Machine Learning Interatomic Potentials and Monte Carlo Simulations"
  venue: "The Journal of Physical Chemistry C"
  doi: "10.1021/acs.jpcc.3c06168"
