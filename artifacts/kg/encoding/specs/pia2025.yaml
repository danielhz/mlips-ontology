methods:
  MACE:
    hp: [numEpochs]
    algorithm: "Iterative fine-tuning from MACE-MP-0 medium (each cycle restarts from the foundation parameters)"
    impl: {lib: MACE}
    sims: [MolecularDynamics, PhononCalculation]
