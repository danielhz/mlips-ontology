id: pia2025
source:
  rank: 312
  year: "2025"
  first_author: "Flaviano Della Pia"
  title: "Accurate and efficient machine learning interatomic potentials for finite temperature modelling of molecular crystals"
  venue: "Chemical Science"
  doi: "10.1039/d5sc01325a"
  kg_relevance: "Application/model instance"
  arxiv_id: "2502.15530v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "e90a8127e4567ce65fce0924347e9cb8643ce50b986c67cfeb159ae2abd198d8"
study_label: "Della Pia et al. (2025): fine-tuned MACE-MP-0 potentials for finite-temperature sublimation enthalpies of molecular crystals"
scope: |
  Encoding scope: MACE-MP-0 (medium) fine-tuned with about 150-360
  vdW-DF2 structures per system for the 23 X23 molecular crystals, for
  paracetamol, aspirin and squaric acid, for the ice polymorphs (revPBE-D3)
  and as one general X23 model, with training and validation energy,
  force and stress RMSEs (Tables S27, S33, S34, S36). Sublimation
  enthalpies, lattice energies and equations of state are properties, not
  error metrics.
