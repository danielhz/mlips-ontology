resources: |
  Training times are listed in Table I (e.g. SchNet 2.5 h for malondialdehyde N=1k, 12 d 15 h on two Tesla P100 for ANI-1 N=19.8M); SchNet MD of malondialdehyde takes about 11 ms per time step on a Tesla P100.
gaps:
  - "QM9 dipole moments and Materials Project formation energies (Table I) are not interatomic-potential targets; not encoded. Reference levels of theory are not restated in the text read."
