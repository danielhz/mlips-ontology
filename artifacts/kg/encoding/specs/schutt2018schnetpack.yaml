id: schutt2018schnetpack
source:
  rank: 543
  year: "2018"
  first_author: "Kristof T. Schütt"
  title: "SchNetPack: A Deep Learning Toolbox For Atomistic Systems"
  venue: "Journal of Chemical Theory and Computation"
  doi: "10.1021/acs.jctc.8b00908"
  kg_relevance: "Application/model instance"
  arxiv_id: "1809.01072v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "d97dbe2309a9d70683c1c00ab5752b0f655e0a4aaad26e129b4a94eaf69e4833"
study_label: "Schutt et al. (2018): SchNetPack, a deep-learning toolbox for atomistic systems, with SchNet and Behler-Parrinello (ACSF, wACSF) benchmarks on MD17, QM9 and ANI-1"
scope: |
  Encoding scope: the Table I benchmarks of SchNet and Behler-Parrinello
  networks with standard (ACSF) or weighted (wACSF) symmetry functions on
  MD17 malondialdehyde and acetylsalicylic acid (1k and 50k training
  sizes, energies and forces), QM9 U0 and ANI-1 energies (SchNet only),
  all on held-out test sets (Table II). Dipole moments and Materials
  Project formation energies are not interatomic-potential targets and
  are not encoded. wACSF is a descriptor setting of the HDNNP method.
materials:
  mal: {label: "Malondialdehyde MD trajectory (MD17)", class: "Small organic molecules (MD trajectories)"}
  asp: {label: "Acetylsalicylic acid MD trajectory (MD17)", class: "Small organic molecules (MD trajectories)"}
  qm9: {label: "QM9 small organic molecules (equilibrium geometries)", class: "Small organic molecules (equilibrium geometries)"}
  ani1: {label: "ANI-1 off-equilibrium conformations of small organic molecules", class: "Organic molecules (gas phase)"}
reference:
  md17: {type: DFT, comment: "MD17 reference as published"}
  qm9ref: {type: DFT, comment: "QM9 reference as published"}
  ani1ref: {type: DFT, comment: "ANI-1 reference as published"}
sampling:
  rand: {label: "Random training/validation/test splits of the published data sets (Table II)"}
datasets:
  mal1k: {label: "Malondialdehyde (MD17) training split, 950 structures", materials: [mal], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Table II"}, calc: md17, sampling: [rand]}
  mal50k: {label: "Malondialdehyde (MD17) training split, 49,000 structures", materials: [mal], properties: [Energy, Forces], provenance: Published, n: {v: 49000, loc: "Table II"}, calc: md17, sampling: [rand]}
  asp1k: {label: "Acetylsalicylic acid (MD17) training split, 950 structures", materials: [asp], properties: [Energy, Forces], provenance: Published, n: {v: 950, loc: "Table II"}, calc: md17, sampling: [rand]}
  asp50k: {label: "Acetylsalicylic acid (MD17) training split, 49,000 structures", materials: [asp], properties: [Energy, Forces], provenance: Published, n: {v: 49000, loc: "Table II"}, calc: md17, sampling: [rand]}
  qm9: {label: "QM9 (QM9) training split, 109,000 structures", materials: [qm9], properties: [Energy], provenance: Published, n: {v: 109000, loc: "Table II"}, calc: qm9ref, sampling: [rand]}
  ani10m: {label: "ANI-1 training split, 10,000,000 structures", materials: [ani1], properties: [Energy], provenance: Published, n: {v: 10000000, loc: "Table II"}, calc: ani1ref, sampling: [rand]}
  ani17m: {label: "ANI-1 training split, 17,600,000 structures", materials: [ani1], properties: [Energy], provenance: Published, n: {v: 17600000, loc: "Table II"}, calc: ani1ref, sampling: [rand]}
methods:
  SchNet:
    hp: [learningRate, batchSize]
    loss: "Energies, and forces with trade-off rho = 0.1 for MD17"
    algorithm: "Adam with learning-rate decay on plateau (factor 0.5, minimum 1e-6)"
    impl: {lib: SchNet, comment: "SchNetPack"}
    sims: [MolecularDynamics]
  HDNNP:
    hp: [learningRate, batchSize]
    loss: "Energies, and forces with trade-off rho = 0.1 for MD17"
    algorithm: "Adam with learning-rate decay on plateau"
    impl: {lib: {local: SchNetPack}, comment: "ACSF or weighted ACSF (wACSF) inputs, standardized (Table V)"}
runs:
  schnet-mal1k: {label: "SchNet for Malondialdehyde (N=1k)", method: SchNet, dataset: mal1k, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 100, loc: "Table III"}}, model: "SchNetPack SchNet Malondialdehyde (N=1k)"}
  acsf-mal1k: {label: "Behler-Parrinello NN with ACSFs for Malondialdehyde (N=1k)", method: HDNNP, dataset: mal1k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 20, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with ACSFs Malondialdehyde (N=1k)"}
  wacsf-mal1k: {label: "Behler-Parrinello NN with wACSFs for Malondialdehyde (N=1k)", method: HDNNP, dataset: mal1k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 20, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with wACSFs Malondialdehyde (N=1k)"}
  schnet-mal50k: {label: "SchNet for Malondialdehyde (N=50k)", method: SchNet, dataset: mal50k, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 100, loc: "Table III"}}, model: "SchNetPack SchNet Malondialdehyde (N=50k)"}
  acsf-mal50k: {label: "Behler-Parrinello NN with ACSFs for Malondialdehyde (N=50k)", method: HDNNP, dataset: mal50k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with ACSFs Malondialdehyde (N=50k)"}
  wacsf-mal50k: {label: "Behler-Parrinello NN with wACSFs for Malondialdehyde (N=50k)", method: HDNNP, dataset: mal50k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with wACSFs Malondialdehyde (N=50k)"}
  schnet-asp1k: {label: "SchNet for Acetylsalicylic acid (N=1k)", method: SchNet, dataset: asp1k, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 100, loc: "Table III"}}, model: "SchNetPack SchNet Acetylsalicylic acid (N=1k)"}
  acsf-asp1k: {label: "Behler-Parrinello NN with ACSFs for Acetylsalicylic acid (N=1k)", method: HDNNP, dataset: asp1k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 20, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with ACSFs Acetylsalicylic acid (N=1k)"}
  wacsf-asp1k: {label: "Behler-Parrinello NN with wACSFs for Acetylsalicylic acid (N=1k)", method: HDNNP, dataset: asp1k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 20, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with wACSFs Acetylsalicylic acid (N=1k)"}
  schnet-asp50k: {label: "SchNet for Acetylsalicylic acid (N=50k)", method: SchNet, dataset: asp50k, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 100, loc: "Table III"}}, model: "SchNetPack SchNet Acetylsalicylic acid (N=50k)"}
  acsf-asp50k: {label: "Behler-Parrinello NN with ACSFs for Acetylsalicylic acid (N=50k)", method: HDNNP, dataset: asp50k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with ACSFs Acetylsalicylic acid (N=50k)"}
  wacsf-asp50k: {label: "Behler-Parrinello NN with wACSFs for Acetylsalicylic acid (N=50k)", method: HDNNP, dataset: asp50k, settings: {learningRate: {v: 0.01, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with wACSFs Acetylsalicylic acid (N=50k)"}
  schnet-qm9: {label: "SchNet for QM9 (N=110k)", method: SchNet, dataset: qm9, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 100, loc: "Table III"}}, model: "SchNetPack SchNet QM9 (N=110k)"}
  acsf-qm9: {label: "Behler-Parrinello NN with ACSFs for QM9 (N=110k)", method: HDNNP, dataset: qm9, settings: {learningRate: {v: 0.001, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with ACSFs QM9 (N=110k)"}
  wacsf-qm9: {label: "Behler-Parrinello NN with wACSFs for QM9 (N=110k)", method: HDNNP, dataset: qm9, settings: {learningRate: {v: 0.001, loc: "Table IV"}, batchSize: {v: 100, loc: "Table IV"}}, model: "SchNetPack Behler-Parrinello NN with wACSFs QM9 (N=110k)"}
  schnet-ani10m: {label: "SchNet for ANI-1 (N=10.1M)", method: SchNet, dataset: ani10m, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 400, loc: "Table III"}}, model: "SchNetPack SchNet ANI-1 (N=10.1M)"}
  schnet-ani17m: {label: "SchNet for ANI-1 (N=19.8M)", method: SchNet, dataset: ani17m, settings: {learningRate: {v: 0.0001, loc: "Table III"}, batchSize: {v: 400, loc: "Table III"}}, model: "SchNetPack SchNet ANI-1 (N=19.8M)"}
results:
