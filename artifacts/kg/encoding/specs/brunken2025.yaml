id: brunken2025
source:
  rank: 355
  year: "2025"
  first_author: "Christoph Brunken"
  title: "Machine Learning Interatomic Potentials: library for efficient training, model development and simulation of molecular systems"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2505.22397"
  kg_relevance: "Software/implementation"
  arxiv_id: "2505.22397v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "bae2fccfd359a0351d2daf8b06b9f7bfe94ac07e2a63a19dfdadb8c7e4a9e227"
study_label: "Brunken et al. (2025): the InstaDeep mlip library (JAX) for training and simulating MACE, NequIP and ViSNet potentials, with SPICE2 pre-trained models"
scope: |
  Encoding scope: the curated SPICE2 data set (filtered for bonding,
  neutral charge and forces; 1,737,896 training and 87,922 validation
  structures, 95:5 split by SMILES), the three pre-trained models
  (MACE-large, NequIP, ViSNet; 220 epochs on H100 GPUs), the MACE-medium
  comparison and the speed-optimised modified MACE, the MACE-medium model
  on curated SPICE1, and the MD speed benchmarks of Tables 2 and 6.
  Validation MAEs are shown only in Fig. 2 (gaps).
materials:
  mol: {label: "Drug-like molecules, dimers, amino acids, dipeptides and solvated systems of SPICE2; chignolin (1UAO) and alpha-bungarotoxin complex (1ABT) for speed tests", class: "Organic and biochemical molecules (C, N, O, H)"}
reference:
  spice: {type: DFT, xc: {local: "wB97M-D3(BJ)"}, basis: "def2-TZVPPD", comment: "SPICE2 level of theory."}
datasets:
  spice2: {label: "Curated SPICE2 (H-bond, neutral-charge and force filters; 95:5 split at SMILES level)", materials: [mol], properties: [Energy, Forces], provenance: Augmented, n: {v: 1737896, loc: "Sec. Model training methodology (training structures)"}, calc: spice}
  spice1: {label: "Curated SPICE1", materials: [mol], properties: [Energy, Forces], provenance: Augmented, calc: spice}
methods:
  MACE:
    hp: [numLayers, numFeatures, numRadialBasis, cutoffRadius, batchSize, learningRate, numEpochs]
    loss: "MSE on energy and forces, weights 40 and 1000 flipped at epoch 115"
    algorithm: "AMSGrad Adam, EMA 0.99, 4000 warm-up steps"
    impl: {lib: {local: "mlip (InstaDeep, JAX)"}}
    sims: [MolecularDynamics]
  NequIP:
    hp: [numLayers, numRadialBasis, cutoffRadius, batchSize, learningRate, numEpochs]
    loss: "Huber loss on energy and forces"
    impl: {lib: {local: "mlip (InstaDeep, JAX)"}}
    sims: [MolecularDynamics]
  ViSNet:
    hp: [numLayers, numFeatures, numRadialBasis, cutoffRadius, batchSize, learningRate, numEpochs]
    loss: "Huber loss on energy and forces"
    impl: {lib: {local: "mlip (InstaDeep, JAX)"}}
    sims: [MolecularDynamics]
runs:
  mace-large: {label: "MACE-large pre-trained on curated SPICE2 (2 layers, 128 channels, correlation 2, node symmetry 3; 2,139,152 parameters)", method: MACE, dataset: spice2, settings: {numLayers: {v: 2, loc: "Table 5"}, numFeatures: {v: 128, loc: "Table 5"}, numRadialBasis: {v: 8, loc: "Table 5"}, cutoffRadius: {v: 5, loc: "Table 5"}, batchSize: {v: 64, loc: "Table 5"}, learningRate: {v: 0.01, loc: "Table 5"}, numEpochs: {v: 220, loc: "App. A"}}, model: "mlip MACE-large SPICE2", trainingHardware: "NVIDIA H100 GPUs"}
  nequip: {label: "NequIP pre-trained on curated SPICE2 (5 layers, lmax 2; 1,327,792 parameters)", method: NequIP, dataset: spice2, settings: {numLayers: {v: 5, loc: "Table 3"}, numRadialBasis: {v: 8, loc: "Table 3"}, cutoffRadius: {v: 5, loc: "Table 3"}, batchSize: {v: 16, loc: "Table 3"}, learningRate: {v: 0.002, loc: "Table 3"}, numEpochs: {v: 220, loc: "App. A"}}, model: "mlip NequIP SPICE2", trainingHardware: "NVIDIA H100 GPUs"}
  visnet: {label: "ViSNet pre-trained on curated SPICE2 (4 layers, 128 channels, 8 heads, 32 RBF, lmax 2; 1,137,922 parameters)", method: ViSNet, dataset: spice2, settings: {numLayers: {v: 4, loc: "Table 4"}, numFeatures: {v: 128, loc: "Table 4"}, numRadialBasis: {v: 32, loc: "Table 4"}, cutoffRadius: {v: 5, loc: "Table 4"}, batchSize: {v: 16, loc: "Table 4"}, learningRate: {v: 0.0001, loc: "Table 4"}, numEpochs: {v: 220, loc: "App. A"}}, model: "mlip ViSNet SPICE2", trainingHardware: "NVIDIA H100 GPUs"}
  mace-medium: {label: "MACE-medium (MACE-OFF medium hyperparameters) trained on curated SPICE2", method: MACE, dataset: spice2, model: "mlip MACE-medium SPICE2"}
  mace-mod: {label: "Modified MACE (gated symmetric-contraction scalars and species-pair edge weights; 2,203,504 parameters) trained on curated SPICE2", method: MACE, dataset: spice2, model: "mlip modified MACE SPICE2"}
  mace-medium-s1: {label: "MACE-medium (MACE-OFF medium hyperparameters) trained on curated SPICE1 (1,911,568 parameters)", method: MACE, dataset: spice1, model: "mlip MACE-medium SPICE1"}
