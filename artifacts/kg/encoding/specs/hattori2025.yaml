scope: |
  Encoding scope: this is the arXiv preprint (2506.07579) of the study
  published as hattori2026 (Nature Communications), which is encoded in
  full. The preprint describes the same Allegro models (tensor sizes 32,
  64, 128; lmax = 2; cutoff 5.2 A) trained on SPICE 2, MatPES and their
  hybrid, and its Table 2 gives the same Transition1x activation- and
  reaction-energy MAEs as Table 1 of the version of record. To avoid
  counting the same results twice, the runs are recorded here and the
  results only in hattori2026.
