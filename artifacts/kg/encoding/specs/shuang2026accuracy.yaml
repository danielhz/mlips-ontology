gaps:
  - "The Fig. 2 caption gives the RMSEs without saying whether they are training (A+B) or test (C+E+F) errors, so the role is null."
  - "The four intermediate ACE models, the A+D-trained models and the clustering-enhanced local D-optimality have errors in figures only (Figs. 3-7, S1-S2); Spearman correlations, thresholds and selection rates are UQ diagnostics, not energy/force errors."
