source:
  rank: 280
  year: "2026"
  first_author: "Jonas Hänseroth"
  title: "Data-Efficient Construction of Material-Specific Machine-Learning Interatomic Potentials from Ab Initio Molecular Dynamics Trajectories"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2608.14899"
  kg_relevance: "Application/model instance"
  arxiv_id: "2608.14899v1"
  pdf_version: "arxiv-preprint"
