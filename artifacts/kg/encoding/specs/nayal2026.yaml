id: nayal2026
source:
  rank: 238
  year: "2026"
  first_author: "Kamal Singh Nayal"
  title: "Critical benchmarking of machine-learned interatomic potentials for intermolecular and noncovalent interactions"
  venue: "Machine Learning Science and Technology"
  doi: "10.1088/2632-2153/aea39f"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: ""
  pdf_version: "publisher"
  pdf_sha256: "b43573c1fe4ad894e0222c5f157f5f89ea932fc4918e0b2a1e7326f8615a38e3"
study_label: "Nayal, Cho and Isayev (2026): benchmarking MLIPs for intermolecular and noncovalent interactions; AIMNet2(2025)"
scope: |
  Encoding scope: the five MLIPs of Table 3 (AIMNet2(2023) B97-3c,
  AIMNet2(2025) trained here by continual pretraining, MACE-OFF23(M),
  MACE-OMol, UMA-S-OMol) with their R2, RMSE and MAE of interaction
  energies against CCSD(T)/CBS references on 21 benchmark data sets (with
  element/charge-compatible subsets marked as separate rows). The other
  AIMNet2 and MACE-OFF variants (SI), overlap analysis and dimer curves
  are not encoded.
materials:
  organics: {label: "Organic molecules, ions and noncovalent complexes of up to 14 elements (AIMNet2 training domain)", class: "Organic molecules and molecular complexes"}
  HB104: {label: "Noncovalent complexes of the HB104 benchmark", class: "Molecular dimers and noncovalent complexes"}
  NCIA_HB300SPXx10: {label: "Noncovalent complexes of the NCIA_HB300SPXx10 benchmark", class: "Molecular dimers and noncovalent complexes"}
