  NCIA_Rep739x5-b: {label: "Noncovalent complexes of the NCIA_Rep739x5 (subset for MACE-OFF) benchmark", class: "Molecular dimers and noncovalent complexes"}
reference:
  b97-3c: {type: DFT, code: ORCA, xc: {local: "B97-3c"}, comment: "ORCA 5, restricted Kohn-Sham, TightSCF/SlowConv, RIJCOSX, DEFGRID2 (Sec. 2.1.3)."}
sampling:
  aimnet25-data: {label: "SPICE v2.0.1 and CREMP geometries, normal-mode and metadynamics sampling of PubChem molecules, and random CSD monomer pairs loosely optimised with AIMNet2", comment: "3.8 million new structures (Sec. 2.1.3)."}
datasets:
  aimnet25: {label: "Extended AIMNet2(2025) data set (3.8 million B97-3c structures)", materials: [organics], properties: [Energy, Forces], provenance: InHouse, calc: b97-3c, sampling: [aimnet25-data], comment: "Added to the about 20 million B97-3c structures of AIMNet2(2023); doi:10.1184/R1/31141138."}
methods:
  AIMNet2:
    hp: [cutoffRadius, learningRate, numEpochs]
    loss: "Weighted MSE of energy (1.0), forces (0.2) and partial charges (0.5)"
    algorithm: "RAdam with cosine annealing from 4e-4 to 1e-6 over 400 epochs, weight decay 1e-8"
    impl: {lib: {local: "aimnetcentral", comment: "https://github.com/isayevlab/aimnetcentral"}}
  MACE: {impl: {lib: MACE}}
  UMA: {}
runs:
  a23: {label: "AIMNet2(2023) B97-3c as distributed", method: AIMNet2, model: "AIMNet2-B97-3c (2023)"}
  a25: {label: "AIMNet2(2025): AIMNet2(2023) continually pretrained on 3.8 million additional B97-3c structures", method: AIMNet2, dataset: aimnet25, settings: {cutoffRadius: {v: 5.0, loc: "Sec. 2.1.3"}, learningRate: {v: 0.0004, loc: "Sec. 2.1.3"}, numEpochs: {v: 400, loc: "Sec. 2.1.3"}}, model: "AIMNet2(2025)", trainingHardware: "Single H200 GPU; about 4 million steps", base_model: {run: a23, relation: fine-tuned, location: "Sec. 2.1.3 (continual pretraining from the original AIMNet2 weights)"}}
  moff: {label: "MACE-OFF23(M) as distributed", method: MACE, model: "MACE-OFF23 medium"}
  momol: {label: "MACE-OMol as distributed", method: MACE, model: "MACE-OMol (trained on OMol25)"}
  uma: {label: "UMA-S (OMol task) as distributed", method: UMA, model: "UMA-S, OMol task"}
