study_label: "Edwards and Evans (2026): benchmarking universal MLIPs on high-temperature AIMD of nine MOFs"
scope: |
  Encoding scope: the new 40 ps PBE-D3 AIMD data set of nine Zn and Zr
  MOFs at 300, 1000 and 2000 K, and the energy, force and stress MAEs of
  the universal models ORB-v3, MACE-MP-0a and MACE-MPA-0 on it (Table 1,
  averaged over MOFs and temperatures; 300 K values of ORB-v3 from the
  Conclusion). The two fairchem models are not encoded (architecture not
  named). Per-temperature and per-MOF errors (Fig. 3) and the ORB-v3 ramp
  MD losses (Fig. 4) are figure-only.
materials:
  mofs: {label: "Nine MOFs: ZIF-8, CALF-20, MOF-10, MOF-5, MIP-206, UiO-66, UiO-67, UiO-66-NH2 and NU-1000", class: "Zn and Zr metal-organic frameworks"}
reference:
  pbe-d3: {type: DFT, code: {local: "CP2K"}, xc: {local: "PBE-D3"}, pp: NormConserving, comment: "CP2K 2023.2 Quickstep, TZV2P-type triple-zeta valence polarised basis, GTH pseudopotentials; 500 Ry cutoff and 50 Ry relative cutoff for MD (1000/60 Ry for optimisation); SCF 1e-6 Ha."}
sampling:
  aimd: {label: "NVT AIMD of each MOF at 300, 1000 and 2000 K for 40 ps (0.5 fs step, CSVR thermostat)"}
datasets:
  mof-aimd: {label: "High-temperature MOF AIMD data set (nine MOFs x three temperatures, 40 ps each)", materials: [mofs], properties: [Energy, Forces, Stresses], provenance: InHouse, calc: pbe-d3, sampling: [aimd], comment: "Extends the 16 ps ZIF-8 and CALF-20 trajectories of Ref. [16]; Figshare 10.25909/32061111."}
