  mace-mp-0a: {label: "MACE-MP-0a as distributed (MACE-torch 0.3.14)", method: MACE, model: "MACE-MP-0a"}
  mace-mpa-0: {label: "MACE-MPA-0 as distributed (MACE-torch 0.3.14)", method: MACE, model: "MACE-MPA-0"}
