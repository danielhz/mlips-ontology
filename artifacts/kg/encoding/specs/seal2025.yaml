source:
  rank: 391
  year: "2025"
  first_author: "Aniruddha Seal"
  title: "Weighted active space protocol for multireference machine-learned potentials"
  venue: "Proceedings of the National Academy of Sciences"
  doi: "10.1073/pnas.2513693122"
  kg_relevance: "Application/model instance"
  arxiv_id: "2505.10505v1"
  pdf_version: "arxiv-preprint"
