methods:
  TorchMD-ET:
    hp: [cutoffRadius, numLayers, numRadialBasis, numFeatures, learningRate, batchSize]
    loss: "Mean squared error; for MD17 a combined energy and force loss weighted 0.2 and 0.8"
    algorithm: "Adam with linear warm-up and reduce-on-plateau learning-rate decay"
    impl: {lib: {local: "TorchMD-NET", comment: "PyTorch; distributed training across two NVIDIA RTX 2080 Ti GPUs"}}
