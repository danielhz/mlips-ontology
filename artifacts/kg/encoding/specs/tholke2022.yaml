id: tholke2022
source:
  rank: 205
  year: "2022"
  first_author: "Philipp Thölke"
  title: "TorchMD-NET: Equivariant Transformers for Neural Network based Molecular Potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2202.02541"
  kg_relevance: "Method/model"
  arxiv_id: "2202.02541v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "34842c95d3dd202e284b8d293e68a45fe34da413cf2426acb3a7b0e828b437c0"
study_label: "Thölke and De Fabritiis (2022): TorchMD-NET equivariant Transformer (ET)"
scope: |
  Encoding scope: the equivariant Transformer of TorchMD-NET (introduced
  here; TorchMD-ET in the registry) and its energy and force errors on the
  eight MD17 molecules (Table 2), the CCSD/CCSD(T) MD17 trajectories
  (Table 8), the QM9 U0 target (Table 1) and ANI-1 (Fig. 2). The other QM9
  targets, the reduced-size ET variants (Table 7), the hydrogen ablation
  (Table 5) and values quoted from other papers are not encoded.
