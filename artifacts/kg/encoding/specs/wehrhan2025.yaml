study_label: "Wehrhan et al. (2025): MLIPAudit, a benchmarking suite for MLIPs on molecular, liquid, biomolecular and reactivity tasks"
scope: |
  Encoding scope: the models benchmarked with MLIPAudit v0.1.0: eight
  internal models trained with the InstaDeep mlip library (ViSNet, MACE
  and NequIP on curated SPICE2 or Transition-1x; two ViSNet models on
  SPICE2 + T1x recomputed in OMol25) and three external pretrained models
  (UMA-Small, MACE-OFF, MACE-MP). Results are normalised benchmark scores
  (Tables 2-3, 7-10) and figure-only errors, so no error metrics are
  encoded.
materials:
  mol: {label: "Small organic molecules, molecular liquids, biomolecules and reactions (MLIPAudit benchmark sets)", class: "Organic and biochemical molecules (C, N, O, H)"}
datasets:
  spice2: {label: "Curated SPICE2 (neutral systems; as in Brunken et al.)", materials: [mol], properties: [Energy, Forces], provenance: Published}
  t1x: {label: "Transition-1x (1M samples; 95/5 train/validation)", materials: [mol], properties: [Energy, Forces], provenance: Published}
  omol-c: {label: "SPICE2 + Transition-1x as recomputed in OMol25 (charged; 50k T1x samples)", materials: [mol], properties: [Energy, Forces], provenance: Published}
  omol-n: {label: "SPICE2 + Transition-1x as recomputed in OMol25 (neutral; 1M T1x samples)", materials: [mol], properties: [Energy, Forces], provenance: Published}
