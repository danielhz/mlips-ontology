id: fischer2026
source:
  rank: 587
  year: "2026"
  first_author: "Mirko Fischer"
  title: "From oligomers to entangled polymers: How to train a transferable machine learning interatomic potential"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2608.01162"
  kg_relevance: "Training/reliability"
  arxiv_id: "2608.01162v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "a532fb8577ffeeb701abfc37c03ea2c0fa560dc82ff3cd9502439cdec9fd56fb"
study_label: "Fischer and Heuer (2026): training a transferable ACE potential for polyethylene from oligomers to entangled polymers by active learning"
scope: |
  Encoding scope: linear ACE potentials (606 basis functions up to
  four-body, 7 A cutoff) fitted with the ACELearner active-learning
  workflow to OPLS-AA reference energies and forces of polyethylene
  chains (C2H6 to C512H1026); the refined potentials after iterations
  8, 12, 16 and 20 with total force and energy RMSEs on a common test
  set (Table 1). Intra/intermolecular and normalized RMSEs are not
  schema metrics; densities and structure are properties.
hyperparameters:
  nfunc: {label: "Number of ACE basis functions", name: "number of basis functions", datatype: integer}
materials:
  pe: {label: "Polyethylene chains (single molecules, oligomer and polymer melts, volume scans)", class: "Polymers"}
reference:
  opls: {type: REF, comment: "OPLS-AA classical force field as the reference method"}
sampling:
  al: {label: "Active learning from single-molecule and bulk MD with extrapolation-grade selection and volume scans (ACELearner)"}
datasets:
  it8: {label: "Active-learning data after iteration 8 (21,644 atomic environments)", materials: [pe], properties: [Energy, Forces], provenance: InHouse, calc: opls, sampling: [al]}
  it12: {label: "Active-learning data after iteration 12 (58,230 atomic environments)", materials: [pe], properties: [Energy, Forces], provenance: InHouse, calc: opls, sampling: [al]}
  it16: {label: "Active-learning data after iteration 16 (139,584 atomic environments)", materials: [pe], properties: [Energy, Forces], provenance: InHouse, calc: opls, sampling: [al]}
  it20: {label: "Active-learning data after iteration 20 (246,238 atomic environments)", materials: [pe], properties: [Energy, Forces], provenance: InHouse, calc: opls, sampling: [al]}
methods:
  ACE:
    hp: [cutoffRadius, nfunc]
    loss: "Weighted energies and forces with kappa = 0.95"
    impl: {lib: PACE, comment: "ACELearner workflow; one atomic property (linear)"}
    sims: [MolecularDynamics]
runs:
  ace-it8: {label: "Refined ACE potential after iteration 8", method: ACE, dataset: it8, settings: {cutoffRadius: {v: 7, loc: "Sec. 2.2"}, nfunc: {v: 606, loc: "Sec. 2.2"}}, model: "ACE polyethylene (iteration 8)"}
  ace-it12: {label: "Refined ACE potential after iteration 12", method: ACE, dataset: it12, settings: {cutoffRadius: {v: 7, loc: "Sec. 2.2"}, nfunc: {v: 606, loc: "Sec. 2.2"}}, model: "ACE polyethylene (iteration 12)"}
  ace-it16: {label: "Refined ACE potential after iteration 16", method: ACE, dataset: it16, settings: {cutoffRadius: {v: 7, loc: "Sec. 2.2"}, nfunc: {v: 606, loc: "Sec. 2.2"}}, model: "ACE polyethylene (iteration 16)"}
  ace-it20: {label: "Refined ACE potential after iteration 20", method: ACE, dataset: it20, settings: {cutoffRadius: {v: 7, loc: "Sec. 2.2"}, nfunc: {v: 606, loc: "Sec. 2.2"}}, model: "ACE polyethylene (iteration 20)"}
results:
  - {key: ace-it8-test, model: ace-it8, material: pe, role: test, eval_data: {label: "Common test set (test set of the refined potential after iteration 20)", location: "Table 1"}, metrics: [[RMSE, Force, 42.6, meV/A, "test total force RMSE on polyethylene: ACE iteration 8", "Table 1"], [RMSE, Energy, 1.4, meV/atom, "test total energy RMSE on polyethylene: ACE iteration 8", "Table 1"]]}
  - {key: ace-it12-test, model: ace-it12, material: pe, role: test, eval_data: {label: "Common test set (test set of the refined potential after iteration 20)", location: "Table 1"}, metrics: [[RMSE, Force, 34.8, meV/A, "test total force RMSE on polyethylene: ACE iteration 12", "Table 1"], [RMSE, Energy, 0.62, meV/atom, "test total energy RMSE on polyethylene: ACE iteration 12", "Table 1"]]}
  - {key: ace-it16-test, model: ace-it16, material: pe, role: test, eval_data: {label: "Common test set (test set of the refined potential after iteration 20)", location: "Table 1"}, metrics: [[RMSE, Force, 34.5, meV/A, "test total force RMSE on polyethylene: ACE iteration 16", "Table 1"], [RMSE, Energy, 0.5, meV/atom, "test total energy RMSE on polyethylene: ACE iteration 16", "Table 1"]]}
  - {key: ace-it20-test, model: ace-it20, material: pe, role: test, eval_data: {label: "Common test set (test set of the refined potential after iteration 20)", location: "Table 1"}, metrics: [[RMSE, Force, 33.4, meV/A, "test total force RMSE on polyethylene: ACE iteration 20", "Table 1"], [RMSE, Energy, 0.52, meV/atom, "test total energy RMSE on polyethylene: ACE iteration 20", "Table 1"]]}
gaps:
  - "The reference is the classical OPLS-AA force field, not DFT. Training-set sizes are given as atomic environments, not configurations; no n. Intra- and intermolecular RMSEs and normalized RMSEs (Table 1) are not encoded."
