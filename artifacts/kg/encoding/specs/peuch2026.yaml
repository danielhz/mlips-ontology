  mace-mh-1-omat: {label: "MACE-MH-1 (OMat head) as distributed", method: MACE, model: "MACE-MH-1-OMAT"}
  matris-10m-oam: {label: "MatRIS-10M-OAM as distributed", method: MatRIS, model: "MatRIS-10M-OAM"}
