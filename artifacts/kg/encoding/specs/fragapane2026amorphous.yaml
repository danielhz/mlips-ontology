source:
  rank: 656
  year: "2026"
  first_author: "Natascia L. Fragapane"
  title: "Amorphous materials as a frontier challenge for universal interatomic potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2607.11384"
  kg_relevance: "Application/model instance"
  arxiv_id: "2607.11384v1"
