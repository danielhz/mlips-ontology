scope: |
  Encoding scope: the previously reported 4G-HDNNP for aqueous FeCl2 and
  FeCl3 (Ref. 38, as distributed), run with the new iterative charge
  equilibration in LAMMPS. The reported errors compare iQEq with the
  direct matrix solution (e.g. charge RMSE 0.0132 me after 10
  iterations, forces within 0.001 eV/A), not model with DFT; scaling is
  figure-only.
