id: fang2026
source:
  rank: 433
  year: "2026"
  first_author: "Lixin Fang"
  title: "Transfer Learning from Homogeneous to Heterogeneous: Fine-Tuning a Pretrained Interatomic Potential for Multicomponent Mo Alloys with Localized Substitutional Alloying"
  venue: "Materials"
  doi: "10.3390/ma19091715"
  kg_relevance: "Training/reliability"
  arxiv_id: ""
  pdf_version: "publisher"
  pdf_sha256: "587f5a2197ec03aad65c48b77d62dd692707c533477ba00d134b4275cb812ffc"
study_label: "Fang et al. (2026): fine-tuning MACE-MP-0 from homogeneous crystals to dilute multicomponent Mo alloys (zero-shot, scratch and fine-tuned models)"
scope: |
  Encoding scope: the DFT (PBE, spin-polarised) data of dilute single-
  and double-site substituted BCC (128 atoms) and FCC (108 atoms) Mo with
  11 dopants (FT-E: 420 near-equilibrium structures; FT-E_NE: 6,970
  including relaxation frames), MACE models at small, medium and large
  scale in zero-shot, scratch and fine-tuned settings, and the mean test
  MAEs and RMSEs of Table 1 (IID splits) and the per-element
  leave-one-dopant-out test errors of the medium fine-tuned FT-E model
  (Table 2, strict and relaxed protocols).
materials:
  modope: {label: "Dilute Mo alloys (0.78-1.85 at.%) with Cr, Fe, Mn, Nb, Re, Ta, Ti, V, W, Y or Zr in BCC and FCC Mo supercells", class: "Metals"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, comment: "VASP 6.3.0, spin polarisation, fixed lattice of optimised pure Mo; further settings in SI Text S2."}
datasets:
  fte: {label: "FT-E: near-equilibrium doped-Mo structures (IID (81:9):10 splits, 10 repeats)", materials: [modope], properties: [Energy, Forces], provenance: InHouse, n: {v: 420, loc: "Sec. 2.1"}, calc: pbe}
  ftne: {label: "FT-E_NE: equilibrium and relaxation-trajectory doped-Mo structures (IID splits, 5 repeats)", materials: [modope], properties: [Energy, Forces], provenance: InHouse, n: {v: 6970, loc: "Sec. 2.1"}, calc: pbe}
  ftne-sm: {label: "FT-E_NE subsample size-matched to FT-E", materials: [modope], properties: [Energy, Forces], provenance: InHouse, calc: pbe}
methods:
  MACE:
    loss: "Per-atom energy MAE plus force MSE (weights lambda_E, lambda_F)"
    impl: {lib: MACE}
    sims: [GeometryOptimization]
runs:
  mp0-s: {label: "MACE-MP-0 S checkpoint (zero-shot; release not stated)", method: MACE, model: "MACE-MP-0 (S)"}
  mp0-m: {label: "MACE-MP-0 M checkpoint (zero-shot; release not stated)", method: MACE, model: "MACE-MP-0 (M)"}
  mp0-l: {label: "MACE-MP-0 L checkpoint (zero-shot; release not stated)", method: MACE, model: "MACE-MP-0 (L)"}
  fte-s: {label: "FT-E(S): MACE fine-tuned from MACE-MP-0 (S scale)", method: MACE, dataset: fte, model: "Mo-alloy MACE FT-E(S)", base_model: {run: mp0-s, relation: fine-tuned, location: "Sec. 2.2"}}
  fte-m: {label: "FT-E(M): MACE fine-tuned from MACE-MP-0 (M scale)", method: MACE, dataset: fte, model: "Mo-alloy MACE FT-E(M)", base_model: {run: mp0-m, relation: fine-tuned, location: "Sec. 2.2"}}
  fte-l: {label: "FT-E(L): MACE fine-tuned from MACE-MP-0 (L scale)", method: MACE, dataset: fte, model: "Mo-alloy MACE FT-E(L)", base_model: {run: mp0-l, relation: fine-tuned, location: "Sec. 2.2"}}
