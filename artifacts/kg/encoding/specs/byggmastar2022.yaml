id: byggmastar2022
source:
  rank: 357
  year: "2022"
  first_author: "Jesper Byggmästar"
  title: "Simple machine-learned interatomic potentials for complex alloys"
  venue: "Physical Review Materials"
  doi: "10.1103/physrevmaterials.6.083801"
  kg_relevance: "Application/model instance"
  arxiv_id: "2203.08458v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "c43dc09333330914a1c1ec70114071067c0706b8d30f443bda397131a6a69845"
study_label: "Byggmästar et al. (2022): learning curves of low-dimensional (2b, 3b, EAM) versus SOAP descriptors in GAPs for Mo-Nb-Ta-V-W, and the 2b+3b+EAM tabGAP"
scope: |
  Encoding scope: GAPs (QUIP, screened-Coulomb repulsion) with descriptor
  combinations 2b, 2b+EAM, 2b+N EAM, 2b+3b, 2b+3b+EAM, 2b+SOAP and
  2b+cSOAP trained on the Mo-Nb-Ta-V-W data of Ref. 9 (2,859 structures),
  with the one test error stated in the text (liquid energy RMSE of the
  2b+3b+EAM GAP on the full data), and the final 2b+3b+EAM tabGAP.
  Learning curves (Figs. 1, 3, 4), speed-accuracy curves (Fig. 5) and the
  per-class test errors of the final potentials (Fig. 6) are figure-only;
  Table I material properties are properties.
materials:
  hea: {label: "Mo-Nb-Ta-V-W alloys over the full composition range: random and ordered bcc crystals, vacancies and interstitials in equiatomic MoNbTaVW, liquids, surfaces, dimers, short-distance structures and pure-element data", class: "High-entropy alloys"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, comment: "Settings as in Ref. 9 (not repeated here)."}
datasets:
  full: {label: "Mo-Nb-Ta-V-W training data of Ref. 9 (1,614 alloy and 1,245 pure-element structures, 146,101 atoms)", materials: [hea], properties: [Energy, Forces, Virials], provenance: Published, n: {v: 2859, loc: "Sec. II D"}, calc: pbe}
methods:
  GAP:
    hp: [cutoffRadius, angularCutoff, numSparseConfigs]
    impl: {lib: QUIP}
  tabGAP:
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  gap-2b3beam: {label: "GAP 2b+3b+EAM trained on the full Mo-Nb-Ta-V-W data (mean of three potentials)", method: GAP, dataset: full, settings: {cutoffRadius: {v: 5, loc: "Sec. II E (2b and EAM)"}, angularCutoff: {v: 4.1, loc: "Sec. II E (3b)"}, numSparseConfigs: {v: 300, loc: "Sec. II E (3b descriptor)"}}, model: "MoNbTaVW GAP 2b+3b+EAM"}
  tabgap-2b3beam: {label: "tabGAP 2b+3b+EAM for Mo-Nb-Ta-V-W (tabulated cubic-spline version of the 2b+3b+EAM GAP)", method: tabGAP, dataset: full, model: "MoNbTaVW tabGAP 2b+3b+EAM (2022)"}
results:
  - {key: gap-2b3beam-liq, model: gap-2b3beam, material: hea, role: test, eval_data: {label: "Liquid alloy test set (11 structures, 1,408 atoms)", location: "Sec. II D"}, metrics: [[RMSE, Energy, 12.4, meV/atom, "test energy RMSE on liquid hea: MoNbTaVW GAP 2b+3b+EAM", "Sec. III A"]]}
resources: |
  Speeds are given per time step per atom for a 1024-atom MoNbTaVW lattice on one i5-7500 CPU core with LAMMPS (Fig. 5, figure-only).
gaps:
  - "The crystal test error of 2b+3b+EAM is stated only as 'down to 2 meV/atom', so it is not encoded. All other errors (learning curves, Fig. 6 per-class errors of the final tabGAP and GAPs) are figure-only."
  - "tabGAP is named in the authors' earlier work (Ref. 9, byggmastar2021 in the corpus); its registry origin and any derivation from GAP wait for that paper. Short-range order parameters and Table I properties are properties."
  - "The registry method GAP carries mlips:SOAPDescriptor (label 'GAP with SOAP kernel'), but the encoded GAP here uses 2b, 3b and EAM descriptors; the registry row is a legacy shared IRI and is flagged for review rather than changed here."
