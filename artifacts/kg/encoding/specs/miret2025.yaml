  metrology and efficient MLIPs); it trains no models and reports no new
  error metrics. The MPtrj vs AMCSD element-frequency comparison (Fig. 6)
  is a data-set analysis, and the training/inference times of Fig. 5 are
  reproduced from Bihani et al. (2024a).
