gaps:
  - "Table 1 does not say on which split the errors are computed (the data are split 7:2:1 into train, test and validation), so the role is left null."
  - "Literature values in Table 1 (ANI-AL, MEAM, TorchMD-NET, NequIP, DeepMD) are not encoded. Maximum system sizes (Table 2), strong and weak scaling and runtimes are framework benchmarks (mostly figures)."
