id: podryabinkin2023
source:
  rank: 344
  year: "2023"
  first_author: "Evgeny V. Podryabinkin"
  title: "MLIP-3: Active learning on atomic environments with moment tensor potentials"
  venue: "The Journal of Chemical Physics"
  doi: "10.1063/5.0155887"
  kg_relevance: "Training/reliability"
  arxiv_id: "2304.13144v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "3728bb26a31a336087325104d55f8bdfa7f3d21bacd1174da9947b0a59978f27"
study_label: "Podryabinkin et al. (2023): MLIP-3, active learning of moment tensor potentials on atomic neighbourhoods (Cu deposition on Cu<111>)"
scope: |
  Encoding scope: the MLIP-3 example (Sec. IV): MTPs of levels 8, 12
  and 16 (26, 54 and 125 parameters; cutoff 5 A) actively trained on
  spherical atomic neighbourhoods (radius 8 A, 9 A vacuum) cut from an MD
  simulation of Cu deposition on a 1,620-atom Cu<111> substrate, with VASP
  PBE energies and forces, and the training-set RMSEs of Table I. The
  package description (Sec. III) is software, not a result.
materials:
  cu: {label: "Copper atoms deposited on a six-layer Cu<111> substrate (1,620 atoms)", formula: "Cu", class: "Metals"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 300, kpoints: "1x1x1", comment: "Non-periodic spherical neighbourhoods placed in a box with 9 A of vacuum along each direction (Sec. IV B)."}
datasets:
  al8: {label: "Actively selected neighbourhoods for the level-8 MTP", materials: [cu], properties: [Energy, Forces], provenance: InHouse, n: {v: 48, loc: "Table I"}, calc: pbe, sampling: [al-nbh]}
  al12: {label: "Actively selected neighbourhoods for the level-12 MTP", materials: [cu], properties: [Energy, Forces], provenance: InHouse, n: {v: 65, loc: "Table I"}, calc: pbe, sampling: [al-nbh]}
  al16: {label: "Actively selected neighbourhoods for the level-16 MTP", materials: [cu], properties: [Energy, Forces], provenance: InHouse, n: {v: 117, loc: "Table I"}, calc: pbe, sampling: [al-nbh]}
sampling:
  al-nbh: {label: "Active learning on atomic neighbourhoods during Cu deposition MD (extrapolation-grade thresholds gamma_save = 2, gamma_break = 10; spherical neighbourhoods of radius 8 A)"}
methods:
  MTP:
    hp: [cutoffRadius, momentLevel]
    loss: "Energies and forces of the non-periodic neighbourhoods (no stresses)"
    impl: {lib: MLIP}
    sims: [MolecularDynamics]
runs:
  mtp8: {label: "MTP level 8 (26 parameters) actively trained on Cu neighbourhoods", method: MTP, dataset: al8, settings: {cutoffRadius: {v: 5.0, loc: "Sec. IV C"}, momentLevel: {v: 8, loc: "Table I"}}, model: "MLIP-3 Cu MTP level 8"}
  mtp12: {label: "MTP level 12 (54 parameters) actively trained on Cu neighbourhoods", method: MTP, dataset: al12, settings: {cutoffRadius: {v: 5.0, loc: "Sec. IV C"}, momentLevel: {v: 12, loc: "Table I"}}, model: "MLIP-3 Cu MTP level 12"}
  mtp16: {label: "MTP level 16 (125 parameters) actively trained on Cu neighbourhoods", method: MTP, dataset: al16, settings: {cutoffRadius: {v: 5.0, loc: "Sec. IV C"}, momentLevel: {v: 16, loc: "Table I"}}, model: "MLIP-3 Cu MTP level 16"}
results:
  - {key: mtp8-train, model: mtp8, material: cu, role: training, eval_data: {label: "Level-8 active-learning training set (48 neighbourhoods)", location: "Table I"}, metrics: [[RMSE, Energy, 16.200, meV/atom, "train energy RMSE on cu: MLIP-3 Cu MTP level 8", "Table I"], [RMSE, Force, 98.878, meV/A, "train force RMSE on cu: MLIP-3 Cu MTP level 8", "Table I"]]}
  - {key: mtp12-train, model: mtp12, material: cu, role: training, eval_data: {label: "Level-12 active-learning training set (65 neighbourhoods)", location: "Table I"}, metrics: [[RMSE, Energy, 10, meV/atom, "train energy RMSE on cu: MLIP-3 Cu MTP level 12", "Table I"], [RMSE, Force, 89, meV/A, "train force RMSE on cu: MLIP-3 Cu MTP level 12", "Table I"]]}
  - {key: mtp16-train, model: mtp16, material: cu, role: training, eval_data: {label: "Level-16 active-learning training set (117 neighbourhoods)", location: "Table I"}, metrics: [[RMSE, Energy, 5, meV/atom, "train energy RMSE on cu: MLIP-3 Cu MTP level 16", "Table I"], [RMSE, Force, 68, meV/A, "train force RMSE on cu: MLIP-3 Cu MTP level 16", "Table I"]]}
resources: |
  No timings are given.
gaps:
  - "Table I gives 95 % confidence intervals from an ensemble of five potentials per level (one actively and four passively trained): 16.200 +- 0.003 and 98.878 +- 0.002 (level 8), 10 +- 1 and 89 +- 1 (level 12), 5 +- 2 and 68 +- 1 (level 16); only the central values are encoded."
