methods:
  ORB:
    loss: "Continuous Ranked Probability Score on energies and forces (P-Orb); MSE + KL (BLIP-Orb)"
runs:
  orbv3: {label: "Orb-v3 pretrained model (variant not stated)", method: ORB, model: "Orb-v3 (variant not stated)"}
  p-orb: {label: "P-Orb: Orb-v3 fine-tuned with learned functional perturbations and CRPS", method: ORB, dataset: sio2, model: "P-Orb (silica)", base_model: {run: orbv3, relation: fine-tuned, location: "Sec. 4.2"}}
  blip-orb: {label: "BLIP-Orb: Orb-v3 fine-tuned with the BLIP variational method", method: ORB, dataset: sio2, model: "BLIP-Orb (silica)", base_model: {run: orbv3, relation: fine-tuned, location: "Sec. 4.2"}}
results:
  - {key: p-orb-test, model: p-orb, material: sio2, role: test, eval_data: {label: "Silica-glass test set (mean over 4 seeds, n = 1,024)", location: "Table 2"}, metrics: [[MAE, Force, 1.38, meV/A, "test force MAE on sio2: P-Orb", "Table 2"]]}
  - {key: blip-orb-test, model: blip-orb, material: sio2, role: test, eval_data: {label: "Silica-glass test set (mean over 4 seeds, n = 1,024)", location: "Table 2"}, metrics: [[MAE, Force, 1.61, meV/A, "test force MAE on sio2: BLIP-Orb", "Table 2"]]}
