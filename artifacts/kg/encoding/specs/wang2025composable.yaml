id: wang2025composable
source:
  rank: 551
  year: "2025"
  first_author: "Weishi Wang"
  title: "Composable and adaptive design of machine learning interatomic potentials guided by Fisher-information analysis"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2504.19372"
  kg_relevance: "Application/model instance"
  arxiv_id: "2504.19372v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "84beb0d51a24fe02db2a2a3757c3b1086ac7855b22be6182585b8ed65502402e"
study_label: "Wang et al. (2025): composable and adaptive design of MLIPs guided by Fisher-information analysis, demonstrated on niobium"
scope: |
  Encoding scope: the single-term (linear Gaussian or Chebyshev
  pair-cluster, exponentiated and nested-exponentiated) and dual-term
  (product and sum) cluster-basis models fitted to the GEAM niobium
  dataset; training energy and force RMSEs of Tables V and VI. Force
  amplitude and angle RMSEs and Fisher-information condition numbers are
  not schema metrics.
hyperparameters:
  nlin: {label: "Number of linear coefficients c", name: "c", datatype: integer}
  nnonlin: {label: "Number of nonlinear coefficients d", name: "d", datatype: integer}
materials:
  nb: {label: "Niobium (bcc, fcc, hcp under compression and shear, point defects, stacking faults, grain boundaries, liquid)", formula: Nb, class: "Metals"}
reference:
  vasp: {type: DFT, code: VASP, comment: "Nb ground-truth dataset of the GEAM potential (Ref. 6)"}
sampling:
  geam: {label: "Published Nb dataset of Ref. 6 (112,613 total energies; Table II)"}
datasets:
  nb: {label: "Nb ground-truth dataset (112,613 total energies, 37,496 force vectors)", materials: [nb], properties: [Energy, Forces], provenance: Published, n: {v: 112613, loc: "Table II (total energies)"}, calc: vasp, sampling: [geam]}
methods:
  ComposableMLIP:
    hp: [nlin, nnonlin]
    loss: "Equal-weight least squares on total energies and forces"
    algorithm: "Dual-bipartite training: linear regression for linear coefficients, Bayesian optimization for nonlinear coefficients"
runs:
  m-g4: {label: "G4 model for Nb", method: ComposableMLIP, dataset: nb, settings: {nlin: {v: 5, loc: "Tables V-VI"}, nnonlin: {v: 2, loc: "Tables V-VI"}}, model: "Composable MLIP Nb G4"}
  m-g6: {label: "G6 model for Nb", method: ComposableMLIP, dataset: nb, settings: {nlin: {v: 7, loc: "Tables V-VI"}, nnonlin: {v: 2, loc: "Tables V-VI"}}, model: "Composable MLIP Nb G6"}
