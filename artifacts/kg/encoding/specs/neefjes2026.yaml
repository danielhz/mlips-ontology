gaps:
  - "Table 3 energy MAEs are per structure in kcal/mol (Table 3 units read as kcal/mol). The Delta-PaiNN rows trained on GFN1-xTB are a sanity check (correction to the same level); Delta-PaiNN at GFN1-xTB was not trained for the two other systems."
  - "PMF RMSEs (Table 4, at most 0.20 kcal/mol) and collision rate coefficients (Table 5) are properties; distance-resolved errors are figure-only (Fig. 2)."
