  - {key: aa-aimnet-wb, model: aa-aimnet-wb, material: aa, role: test, eval_data: {label: "Independent test set (about 2,000 structures) at the training level of theory", location: "Table 3"}, metrics: [[MAE, Energy, 0.056, kcal/mol, "test energy MAE on aa: H2SO4-H2SO4 AIMNet2 (wb)", "Table 3"], [MAE, Force, 0.076, kcal/mol/A, "test force MAE (component-wise) on aa: H2SO4-H2SO4 AIMNet2 (wb)", "Table 3"]]}
