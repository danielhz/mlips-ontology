study_label: "Nasir et al. (2025): modelling silica polymorphs and zeolites with the pretrained MACE-MP-0 (0b, medium) plus D3"
scope: |
  Encoding scope: the pretrained MACE-MP-0 medium model (0b 'agnesi'
  release, L=1, 6 A cutoff, 10 Bessel functions, two layers) with an
  empirical D3 correction, used for geometry optimisation of zeolite
  frameworks and silica polymorphs (janus-core, ASE). Results are
  relative framework energies, formation-enthalpy changes and transition
  pressures compared with DFT, interatomic potentials and experiment,
  which are properties.
materials:
  silica: {label: "Silica polymorphs (quartz, cristobalite, high-pressure phases) and siliceous zeolite frameworks", formula: "SiO2", class: "Zeolites"}
methods:
  MACE:
    hp: [cutoffRadius, numLayers, numRadialBasis]
    impl: {lib: MACE, comment: "via janus-core"}
    sims: [GeometryOptimization]
runs:
  mp0b-d3: {label: "MACE-MP-0 medium, release 0b (agnesi), with D3 dispersion, as distributed", method: MACE, settings: {cutoffRadius: {v: 6, loc: "Methodology"}, numLayers: {v: 2, loc: "Methodology"}, numRadialBasis: {v: 10, loc: "Methodology"}}, model: "MACE-MP-0b medium (agnesi) + D3"}
results: []
resources: |
  No timings are given.
gaps:
  - "No energy or force errors: relative framework energies per T-site (Table 1), quartz-cristobalite enthalpy changes (Table 2) and phase-transition pressures (Table 3) are properties. The 0b 'agnesi' medium release is not one of the registry MACE-MP checkpoints, so it is a paper-local run."
