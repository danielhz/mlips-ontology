methods:
  FCHL19:
    loss: "Kernel ridge regression on energies, forces (via kernel derivatives) or both; hyperparameters chosen with the score of Eq. 19"
    algorithm: "Closed-form kernel regression with nested cross-validation grid search over kernel width and regularisation"
    impl: {lib: {local: "QML", comment: "QML machine learning package (Python)"}}
runs:
