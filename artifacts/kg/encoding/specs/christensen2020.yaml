  rmd17-ethanol: {label: "rMD17 ethanol (100,000 structures; training sets of up to 1,000)", materials: [ethanol], properties: [Energy, Forces], provenance: InHouse, n: {v: 100000, loc: "Sec. 4.3.1"}, calc: rmd17, sampling: [md17-random], comment: "Published at doi:10.6084/m9.figshare.12672038 with the indices of the outer 5-fold cross-validation."}
