id: christensen2020
source:
  rank: 218
  year: "2020"
  first_author: "Anders S Christensen"
  title: "On the role of gradients for machine learning of molecular energies and forces"
  venue: "Machine Learning: Science and Technology"
  doi: "10.1088/2632-2153/abba6f"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2007.09593v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "83fb601349f18d80542188f4494ec39cd91c2903775d8a290c813950c1e96e21"
study_label: "Christensen and von Lilienfeld (2020): the role of gradients in machine learning of molecular energies and forces; revised MD17"
scope: |
  Encoding scope: the revised MD17 (rMD17) data set introduced here and the
  FCHL19 kernel models trained on its ten molecules with energies only,
  forces only, or both, at the largest training-set size N = 1,000
  (Table S1). The smaller training-set sizes of Table S1, the Himmelblau
  toy model and the small-organic-molecule study (learning-curve fits,
  Table 3) are not encoded.
materials:
  aspirin: {label: "Aspirin molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  azobenzene: {label: "Azobenzene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  benzene: {label: "Benzene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  ethanol: {label: "Ethanol molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  malonaldehyde: {label: "Malonaldehyde molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  naphthalene: {label: "Naphthalene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  paracetamol: {label: "Paracetamol molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  salicylic-acid: {label: "Salicylic acid molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  toluene: {label: "Toluene molecule (rMD17)", class: "Small organic molecule (gas phase)"}
  uracil: {label: "Uracil molecule (rMD17)", class: "Small organic molecule (gas phase)"}
reference:
  rmd17: {type: DFT, code: ORCA, xc: PBE, basis: "def2-SVP", comment: "ORCA 4.0.1 with the RI approximation for the Coulomb integrals, VeryTightSCF, Grid7 and NoFinalGrid (Sec. 4.3.1)."}
sampling:
  md17-random: {label: "100,000 structures drawn at random from each MD17 trajectory", comment: "Single-point recomputation of energies and forces at PBE/def2-SVP (Sec. 4.3.1)."}
datasets:
  rmd17-aspirin: {label: "rMD17 aspirin (100,000 structures; training sets of up to 1,000)", materials: [aspirin], properties: [Energy, Forces], provenance: InHouse, n: {v: 100000, loc: "Sec. 4.3.1"}, calc: rmd17, sampling: [md17-random], comment: "Published at doi:10.6084/m9.figshare.12672038 with the indices of the outer 5-fold cross-validation."}
  rmd17-azobenzene: {label: "rMD17 azobenzene (100,000 structures; training sets of up to 1,000)", materials: [azobenzene], properties: [Energy, Forces], provenance: InHouse, n: {v: 100000, loc: "Sec. 4.3.1"}, calc: rmd17, sampling: [md17-random], comment: "Published at doi:10.6084/m9.figshare.12672038 with the indices of the outer 5-fold cross-validation."}
