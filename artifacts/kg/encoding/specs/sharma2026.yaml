resources: |
  Wall times for 1,000 energy/force/stress evaluations of (H2O)64 (192
  atoms, float32) are given in the text for an Intel Core i9-12900K CPU and
  an NVIDIA GeForce RTX 5070 GPU (Fig. 10); per-atom times are value /
  (1,000 x 192) where the value is stated exactly, and left out where the
  text says around or approximately. The medium MACE models (about 1,000 s
  CPU, 66-69 s GPU) and the UMA s1.1 models (roughly 5,400 s CPU, 225-233 s
  GPU) are given only as approximate values or ranges and are not encoded.
gaps:
  - "Table 5 energies are relative energies per atom referenced to the first frame. The text gives the UMA force MAE as '51.8 eV/A', which Table 5 shows in meV/A; the Table 5 unit is used."
  - "All universal models are paper-local runs except MatterSim V1 Large (registry model MatterSim-v1, 5M parameters), which appears only in the timings; MatterSim V1 Small is a separate checkpoint."
  - "The water-box potential-energy profiles (Fig. 8), bulk Al2O3 properties (Table 3), surface energies (Table 4), the CrCl3 dimer rotation curve (Fig. 12) and the DFT pre-optimisation savings (Table 2) are not error metrics and are not encoded. The DFT settings of the CrCl3/sapphire AIMD are those of Ref. 95 and are not restated here."
