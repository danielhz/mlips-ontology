  year: "2026"
  first_author: "Martin Hoffmann Petersen"
  title: "Importance of Configurational Charge Ordering for Machine Learning Interatomic Potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2603.26471"
