scope: |
  Encoding scope: this is the PNAS version of record of the study whose
  arXiv preprint (2502.07293) is encoded in full as hu2025 (rank 194);
  the PDF read here is that same arXiv v1. To avoid counting the same
  results twice, only the SUS2-MLIP runs are recorded here; datasets,
  errors (main-text M3GNet-dataset MAEs, Tables S2-S3) and the origin of
  the SUS2-MLIP registry method stay with hu2025.
