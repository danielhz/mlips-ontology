  - {key: nano-amorph, model: nano, material: aln, role: external, eval_data: {label: "Held-out frames vs omni-mpa labels: AlN melt-quench MD (amorphous)", location: "SI Table S3"}, metrics: [[RMSE, Energy, 13.6, meV/atom, "held-out energy RMSE vs omni-mpa (AlN melt-quench MD (amorphous)): SevenNet-Nano before fine-tuning", "SI Table S3"], [RMSE, Force, 84, meV/A, "held-out force RMSE vs omni-mpa (AlN melt-quench MD (amorphous)): SevenNet-Nano before fine-tuning", "SI Table S3"]]}
