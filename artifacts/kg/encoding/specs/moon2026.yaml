id: moon2026
source:
  rank: 426
  year: "2026"
  first_author: "Minseok Moon"
  title: "Defect-limited thermal transport in AlN using pretrained machine-learning interatomic potentials"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2610.08013"
  kg_relevance: "Application/model instance"
  arxiv_id: "2610.08013v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "89d34d0ca376342cd398991b37e99bfd254e855c65bbd20dd2b0a6d919d15406"
study_label: "Moon et al. (2026): defect-limited thermal transport in AlN with pretrained SevenNet and MACE potentials and a fine-tuned SevenNet-Nano"
scope: |
  Encoding scope: five MLIPs used for AlN phonons and spectral-energy-
  density MD (SevenNet-Omni mpa channel, SevenNet-Nano 5 A, ft-nano
  fine-tuned from nano on omni-mpa labels, MACE-MH-1 omat_pbe head,
  MACE-MPA-0), the ft-nano training data (omni-mpa single points of AlN
  bulk, oxygen-defect, amorphous Y-Al-O and interface configurations;
  2,992 training frames, stratified 12 % validation) and the held-out
  errors of nano and ft-nano against the teacher labels (SI Table S3,
  Fig. S2). Lattice parameters, phonons and thermal conductivities are
  properties.
materials:
  aln: {label: "Wurtzite AlN: pristine, with V_Al(O_N)3 complexes, amorphous, grain boundaries and Y-O intergranular films", formula: "AlN", class: "Inorganic crystals"}
reference:
  teacher: {type: REF, comment: "Energies, forces and stresses from single-point SevenNet-Omni (mpa channel) evaluations used as fine-tuning labels (SI Table S2)."}
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 520, kpoints: "9x9x6 (four-atom cell)", comment: "Reference lattice parameters and force constants (Sec. 2.4)."}
datasets:
  ftdata: {label: "ft-nano training data labelled by omni-mpa (2,992 frames; stratified 12 % validation; family weights 1-4)", materials: [aln], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 2992, loc: "SI Table S3 note"}, calc: teacher}
methods:
  NequIP:
    hp: [cutoffRadius, numLayers, numFeatures, learningRate, batchSize, numEpochs]
    loss: "Huber (delta 0.01) with force coefficient 1.0 and stress 0.01"
    algorithm: "Adam, learning rate 2e-4 decayed by 0.985 per epoch"
    impl: {lib: {local: "SevenNet (FlashTP kernels)"}}
    sims: [MolecularDynamics, PhononCalculation, GeometryOptimization]
  MACE:
    sims: [MolecularDynamics, PhononCalculation, GeometryOptimization]
runs:
  omni-mpa: {label: "SevenNet-Omni, mpa channel, as distributed", method: NequIP, model: "SevenNet-Omni (mpa channel)"}
  nano: {label: "SevenNet-Nano (5.0 A cutoff variant), as distributed; distilled from the mpa channel of SevenNet-Omni", method: NequIP, model: "SevenNet-Nano (5 A)", base_model: {run: omni-mpa, relation: distilled, location: "Sec. 2.3"}}
  ft-nano: {label: "ft-nano: SevenNet-Nano fine-tuned on omni-mpa-labelled AlN configurations (3 layers, 32 channels, lmax 2)", method: NequIP, dataset: ftdata, settings: {cutoffRadius: {v: 5.0, loc: "SI Table S2"}, numLayers: {v: 3, loc: "SI Table S2"}, numFeatures: {v: 32, loc: "SI Table S2"}, learningRate: {v: 0.0002, loc: "SI Table S2"}, batchSize: {v: 4, loc: "SI Table S2"}, numEpochs: {v: 300, loc: "SI Table S2"}}, model: "ft-nano (AlN)", base_model: {run: nano, relation: fine-tuned, location: "SI Table S2"}}
  mace-mh1: {label: "MACE-MH-1, omat_pbe head, as distributed", method: MACE, model: "MACE-MH-1 (omat_pbe head)"}
  mace-mpa0: {label: "MACE-MPA-0 as distributed", method: MACE, model: "MACE-MPA-0"}
results:
  - {key: nano-cmd300, model: nano, material: aln, role: external, eval_data: {label: "Held-out frames vs omni-mpa labels: AlN crystal MD, 300 K", location: "SI Table S3"}, metrics: [[RMSE, Energy, 10.9, meV/atom, "held-out energy RMSE vs omni-mpa (AlN crystal MD, 300 K): SevenNet-Nano before fine-tuning", "SI Table S3"], [RMSE, Force, 50, meV/A, "held-out force RMSE vs omni-mpa (AlN crystal MD, 300 K): SevenNet-Nano before fine-tuning", "SI Table S3"]]}
  - {key: ftnano-cmd300, model: ft-nano, material: aln, role: validation, eval_data: {label: "Held-out frames vs omni-mpa labels: AlN crystal MD, 300 K", location: "SI Table S3"}, metrics: [[RMSE, Energy, 0.01, meV/atom, "held-out energy RMSE vs omni-mpa (AlN crystal MD, 300 K): ft-nano", "SI Table S3"], [RMSE, Force, 3.9, meV/A, "held-out force RMSE vs omni-mpa (AlN crystal MD, 300 K): ft-nano", "SI Table S3"]]}
  - {key: nano-cmd1100, model: nano, material: aln, role: external, eval_data: {label: "Held-out frames vs omni-mpa labels: AlN crystal MD, 1100 K", location: "SI Table S3"}, metrics: [[RMSE, Energy, 6.6, meV/atom, "held-out energy RMSE vs omni-mpa (AlN crystal MD, 1100 K): SevenNet-Nano before fine-tuning", "SI Table S3"], [RMSE, Force, 117, meV/A, "held-out force RMSE vs omni-mpa (AlN crystal MD, 1100 K): SevenNet-Nano before fine-tuning", "SI Table S3"]]}
