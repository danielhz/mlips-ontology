study_label: "Lahouari et al. (2026): MolCryst-MLIPs, fine-tuned MACE potentials for nine molecular crystals"
scope: |
  Encoding scope: the nine MACE models fine-tuned from MACE-MH-1 (omol head)
  for the molecular crystals of the MolCryst-MLIPs database, with their
  validation MAEs (Table 2), and their PBE-D4 training data built with AMLP.
  Lattice-energy ranking metrics against foundation models (Table 3),
  structural agreement (Table 4) and MD stability are not energy or force
  errors of the schema and are not encoded.
materials:
  benzoic-acid: {label: "Benzoic acid molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  benzamide: {label: "Benzamide molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  coumarin: {label: "Coumarin molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  durene: {label: "Durene molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  isonicotinamide: {label: "Isonicotinamide molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  nicotinic-acid: {label: "Nicotinic acid molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  niacinamide: {label: "Niacinamide molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  pyrazinamide: {label: "Pyrazinamide molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
  resorcinol: {label: "Resorcinol molecular crystal polymorphs (CSD structures)", class: "Organic molecular crystal"}
reference:
  pbe-d4: {type: DFT, code: VASP, xc: PBE, cutoff: 650, comment: "Grimme D4 dispersion; Gamma-centred Monkhorst-Pack meshes scaled to the cell; EDIFF 1e-7 eV; Fermi smearing 0.05 eV (Tables S1, S2)."}
sampling:
  amlp: {label: "DFT cell optimisations, Langevin AIMD at 25-600 K (0.75 fs, 50,000 steps) and active learning on structures that failed in NVT runs (AMLP)"}
datasets:
  benzoic-acid: {label: "Benzoic acid PBE-D4 training set (MolCryst-MLIPs)", materials: [benzoic-acid], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  benzamide: {label: "Benzamide PBE-D4 training set (MolCryst-MLIPs)", materials: [benzamide], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
