  ft-benzamide: {label: "MACE-MH-1 (omol head) fine-tuned on Benzamide", method: MACE, dataset: benzamide, model: "MolCryst-MLIPs MACE model for Benzamide", trainingHardware: "Single NVIDIA A100 GPU; about 22 to over 100 h depending on the data set", base_model: {run: mace-mh-1, relation: fine-tuned, location: "Sec. 2"}}
  ft-coumarin: {label: "MACE-MH-1 (omol head) fine-tuned on Coumarin", method: MACE, dataset: coumarin, model: "MolCryst-MLIPs MACE model for Coumarin", trainingHardware: "Single NVIDIA A100 GPU; about 22 to over 100 h depending on the data set", base_model: {run: mace-mh-1, relation: fine-tuned, location: "Sec. 2"}}
