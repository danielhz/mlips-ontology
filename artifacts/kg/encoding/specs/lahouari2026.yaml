  ft-nicotinic-acid: {label: "MACE-MH-1 (omol head) fine-tuned on Nicotinic acid", method: MACE, dataset: nicotinic-acid, model: "MolCryst-MLIPs MACE model for Nicotinic acid", trainingHardware: "Single NVIDIA A100 GPU; about 22 to over 100 h depending on the data set", base_model: {run: mace-mh-1, relation: fine-tuned, location: "Sec. 2"}}
