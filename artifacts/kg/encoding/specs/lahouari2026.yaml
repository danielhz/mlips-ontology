  durene: {label: "Durene PBE-D4 training set (MolCryst-MLIPs)", materials: [durene], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  isonicotinamide: {label: "Isonicotinamide PBE-D4 training set (MolCryst-MLIPs)", materials: [isonicotinamide], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  nicotinic-acid: {label: "Nicotinic acid PBE-D4 training set (MolCryst-MLIPs)", materials: [nicotinic-acid], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  niacinamide: {label: "Niacinamide PBE-D4 training set (MolCryst-MLIPs)", materials: [niacinamide], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  pyrazinamide: {label: "Pyrazinamide PBE-D4 training set (MolCryst-MLIPs)", materials: [pyrazinamide], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
  resorcinol: {label: "Resorcinol PBE-D4 training set (MolCryst-MLIPs)", materials: [resorcinol], properties: [Energy, Forces], provenance: InHouse, calc: pbe-d4, sampling: [amlp]}
methods:
  MACE:
    algorithm: "Adam with AMSGrad, early stopping, then stochastic weight averaging; float64"
    impl: {lib: MACE}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
