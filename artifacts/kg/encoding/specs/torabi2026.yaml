id: torabi2026
source:
  rank: 544
  year: "2026"
  first_author: "Tina Torabi"
  title: "Scalable data-driven basis selection for linear machine learning interatomic potentials"
  venue: "Machine Learning Science and Technology"
  doi: "10.1088/2632-2153/ae49e2"
  kg_relevance: "Software/implementation"
  arxiv_id: "2504.16418v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "91df11c827b866c0019fce2a31ccf6acfce535a9c923e9b8aa91e14093e5ffe0"
study_label: "Torabi et al. (2026): scalable data-driven basis selection (ASP, OMP, ARD) for linear ACE potentials, benchmarked on single-element datasets and liquid water"
scope: |
  Encoding scope: linear ACE models fitted with dense (RRQR, BLR) and
  sparse (ASP homotopy LASSO, OMP, ARD) solvers: small (about 300) and
  large (about 1000) basis models for the six single-element datasets of
  Zuo et al. (Ni, Cu, Li, Mo, Si, Ge; Table 2) and OMP/BLR models for a
  liquid-water dataset (Table 6). Test MAEs as printed. Literature MTP,
  GAP and CACE values, the silicon (PRX 2018) property comparisons and
  diffusivities are not encoded.
materials:
  ni: {label: "Ni (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Ni, class: "Metals"}
  cu: {label: "Cu (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Cu, class: "Metals"}
  li: {label: "Li (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Li, class: "Metals"}
  mo: {label: "Mo (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Mo, class: "Metals"}
  si: {label: "Si (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Si, class: "Elemental semiconductor"}
  ge: {label: "Ge (ground state, strained, slab and AIMD configurations of the Zuo et al. benchmark)", formula: Ge, class: "Elemental semiconductor"}
  water: {label: "Liquid water (dataset of Ref. 19)", formula: H2O, class: "Molecular liquid"}
reference:
  zuo: {type: DFT, comment: "Single-element benchmark datasets of Ref. 65 as published"}
  waterref: {type: DFT, comment: "Liquid-water dataset of Ref. 19 as published"}
sampling:
  pub: {label: "Published datasets with the published or stated splits"}
datasets:
  d-ni: {label: "Ni single-element benchmark dataset (Ref. 65) training split", materials: [ni], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-cu: {label: "Cu single-element benchmark dataset (Ref. 65) training split", materials: [cu], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-li: {label: "Li single-element benchmark dataset (Ref. 65) training split", materials: [li], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-mo: {label: "Mo single-element benchmark dataset (Ref. 65) training split", materials: [mo], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-si: {label: "Si single-element benchmark dataset (Ref. 65) training split", materials: [si], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-ge: {label: "Ge single-element benchmark dataset (Ref. 65) training split", materials: [ge], properties: [Energy, Forces], provenance: Published, calc: zuo, sampling: [pub]}
  d-water: {label: "Liquid-water dataset (Ref. 19), 1,354 training configurations", materials: [water], properties: [Energy, Forces], provenance: Published, n: {v: 1354, loc: "Sec. 3.3"}, calc: waterref, sampling: [pub]}
methods:
  ACE:
    hp: [cutoffRadius]
    loss: "Linear least squares on energies and forces with solver-specific regularization or sparsity"
    algorithm: "RRQR, BLR, ARD, ASP (homotopy LASSO with TSVD de-biasing) or OMP basis selection"
    impl: {lib: {local: ACEpotentials.jl}, comment: "ActiveSetPursuit.jl for ASP and OMP"}
    sims: [MolecularDynamics]
