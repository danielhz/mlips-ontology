  q4-fw: {label: "qSNAP (2Jmax = 10) on convergence level 4, higher force weight (wE:wF = 12:1)", method: qSNAP, dataset: train4, settings: {twoJmax: {v: 10, loc: "Tables 4, 5"}}, model: "qSNAP Be potential, level 4, higher force weight (wE:wF = 12:1)"}
