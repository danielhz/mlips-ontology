id: baghishov2025
source:
  rank: 282
  year: "2025"
  first_author: "Ilgar Baghishov"
  title: "Application-specific machine-learned interatomic potentials: exploring the trade-off between DFT convergence, MLIP expressivity, and computational cost"
  venue: "Digital Discovery"
  doi: "10.1039/d5dd00294j"
  kg_relevance: "Application/model instance"
  arxiv_id: "2506.05646v2"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "82faa2c6132dd4529e1443a24045645d3c8e58d867b7a62a470e951819f67075"
study_label: "Baghishov et al. (2025): trade-offs between DFT convergence, qSNAP expressivity and cost for beryllium"
scope: |
  Encoding scope: qSNAP potentials (2Jmax = 10) fitted to 10,000
  entropy-maximised beryllium configurations computed at six DFT
  convergence levels, with higher energy weight (wE:wF = 150:1) or higher
  force weight (12:1), and their training, same-level test and level-6
  test RMSEs (Tables 4 and 5). Leverage sub-sampling, lower 2Jmax and
  training-set-size studies (Figs. 4-8) are figure-only; the DFT-level
  differences of Table 3 are not MLIP errors.
materials:
  Be: {label: "Beryllium configurations from information-entropy maximisation (about 50 atoms each)", formula: "Be", class: "Elemental metal, highly diverse configurations"}
reference:
  conv1: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 300, kpoints: "Gamma point only", comment: "Convergence level 1 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
  conv2: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 300, kpoints: "1.00 1/A spacing", comment: "Convergence level 2 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
  conv3: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 400, kpoints: "0.75 1/A spacing", comment: "Convergence level 3 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
  conv4: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 500, kpoints: "0.50 1/A spacing", comment: "Convergence level 4 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
  conv5: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 700, kpoints: "0.25 1/A spacing", comment: "Convergence level 5 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
  conv6: {type: DFT, code: VASP, xc: PBE, pp: PAW, cutoff: 900, kpoints: "0.10 1/A spacing", comment: "Convergence level 6 (Table 1); Methfessel-Paxton smearing 0.2 eV; pyiron workflow."}
sampling:
  entropy: {label: "Information-entropy maximisation of beryllium configurations (20,000 configurations, half for training, half for testing)"}
datasets:
  train1: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 1", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv1, sampling: [entropy]}
  train2: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 2", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv2, sampling: [entropy]}
  train3: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 3", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv3, sampling: [entropy]}
  train4: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 4", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv4, sampling: [entropy]}
  train5: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 5", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv5, sampling: [entropy]}
  train6: {label: "Beryllium training half (10,000 configurations) at DFT convergence level 6", materials: [Be], properties: [Energy, Forces], provenance: InHouse, n: {v: 10000, loc: "Sec. 3.2"}, calc: conv6, sampling: [entropy]}
hyperparameters:
  twoJmax: {label: "SNAP/qSNAP angular order 2Jmax of the bispectrum expansion", name: "2Jmax", datatype: integer}
methods:
  qSNAP:
    hp: [twoJmax]
    loss: "Weighted least squares on per-atom energies and force components (Eq. 1); energy:force weights 150:1 or 12:1"
    algorithm: "Linear least squares (weighted), descriptors from FitSNAP"
    impl: {lib: {local: "FitSNAP"}}
runs:
  q1-ew: {label: "qSNAP (2Jmax = 10) on convergence level 1, higher energy weight (wE:wF = 150:1)", method: qSNAP, dataset: train1, settings: {twoJmax: {v: 10, loc: "Tables 4, 5"}}, model: "qSNAP Be potential, level 1, higher energy weight (wE:wF = 150:1)"}
  q1-fw: {label: "qSNAP (2Jmax = 10) on convergence level 1, higher force weight (wE:wF = 12:1)", method: qSNAP, dataset: train1, settings: {twoJmax: {v: 10, loc: "Tables 4, 5"}}, model: "qSNAP Be potential, level 1, higher force weight (wE:wF = 12:1)"}
  q2-ew: {label: "qSNAP (2Jmax = 10) on convergence level 2, higher energy weight (wE:wF = 150:1)", method: qSNAP, dataset: train2, settings: {twoJmax: {v: 10, loc: "Tables 4, 5"}}, model: "qSNAP Be potential, level 2, higher energy weight (wE:wF = 150:1)"}
