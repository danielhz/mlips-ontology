study_label: "Kim et al. (2025): a universal augmentation framework (LES library) for long-range electrostatics in MLIPs, and MACELES-OFF"
scope: |
  Encoding scope: the LES library and its combination with MACE
  (MACE-LES; MACELES-OFF), trained on SPICE, with its test MAEs and RMSEs
  on the seven SPICE-derived test subsets (Table III). The baseline and
  LES-augmented MACE, NequIP, CACE and CHGNet models for bulk water,
  dipeptides and Au2 on MgO(001) have errors only in figures (Figs. 2-4)
  and are not encoded; the MACE-OFF23 values of Table III are taken from
  the MACE-OFF paper.
materials:
  pubchem: {label: "PubChem (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  des-mono: {label: "DES370K monomers (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  des-dimers: {label: "DES370K dimers (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  dipeptides: {label: "Dipeptides (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  aa: {label: "Solvated amino acids (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  water: {label: "Water clusters (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
  qmugs: {label: "QMugs (SPICE / MACE-OFF test subset)", class: "Organic molecules and molecular clusters"}
datasets:
  spice: {label: "SPICE version 1 (MACE-OFF training split)", materials: [pubchem, des-mono, des-dimers, dipeptides, aa, water, qmugs], properties: [Energy, Forces], provenance: Published}
hyperparameters:
  ell: {label: "MACE irrep (rotation) order l of the messages", name: "l", datatype: integer}
  les-sigma: {label: "LES Ewald smearing factor sigma (A)", name: "sigma", datatype: double}
methods:
