id: ito2026
source:
  rank: 316
  year: "2026"
  first_author: "Shusuke Ito"
  title: "Benchmarking Universal Interatomic Potentials on Zeolite"
  venue: "The Journal of Physical Chemistry C"
  doi: "10.1021/acs.jpcc.5c06812"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2509.07417v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "c248b42ee48e1cf190c33c3832df5c7ae928f1ccb791bc397e3f43e84430fcb4"
study_label: "Ito, Muraoka and Nakayama (2026): benchmarking universal interatomic potentials on zeolite structures"
scope: |
  Encoding scope: six pretrained universal MLIPs (CHGNet, ORB-v3,
  MatterSim, eSEN-30M-OAM, PFP v7, EquiformerV2-lE4-lF100-S2EFS-OC22) with
  D3 correction, and their RMSEs of zeolite relative energies against
  experiment (Table 2) and PBE+D3 (Tables 3, 4). Analytic and tailor-made
  force fields (GFN-FF, UFF, Dreiding, SLC, ClayFF, BSFF) are not MLIPs and
  are not encoded.
materials:
  silica: {label: "Pure-silica zeolite frameworks (IZA topologies) relative to alpha-quartz", formula: "SiO2", class: "Zeolite (pure silica)"}
  cu-cha: {label: "347 Cu2+/[Cu(OH)]+ exchanged aluminosilicate CHA zeolites", class: "Metal-exchanged zeolite"}
  k-eri: {label: "1,190 ERI zeolites with potassium and hexane-1,6-bis(trimethylazanium) OSDA", class: "As-synthesised zeolite with organic template"}
reference:
  pbe-d3: {type: DFT, code: VASP, xc: {local: "PBE-D3"}, pp: PAW, cutoff: 520, comment: "VASP 6.2.1, MPRelax settings (pymatgen 2025.5.2, custodian), energy convergence 5e-5 eV/atom."}
methods:
  CHGNet: {sims: [GeometryOptimization]}
  ORB: {sims: [GeometryOptimization]}
  M3GNet: {sims: [GeometryOptimization]}
  eSEN: {sims: [GeometryOptimization]}
  TeaNet: {sims: [GeometryOptimization]}
  EquiformerV2: {}
runs:
  chgnet: {label: "CHGNet as distributed", method: CHGNet, model: "CHGNet"}
  orb-v3: {label: "ORB-v3 as distributed", method: ORB, model: "ORB-v3"}
  mattersim: {label: "MatterSim as distributed (version not stated)", method: M3GNet, model: "MatterSim"}
  esen: {label: "eSEN-30M-OAM as distributed", method: eSEN, model: "eSEN-30M-OAM"}
  pfp-v7: {label: "PFP v7 as distributed", method: TeaNet, model: "PFP v7"}
  eqv2-oc22: {label: "EquiformerV2-lE4-lF100-S2EFS-OC22 as distributed", method: EquiformerV2, model: "EquiformerV2-lE4-lF100-S2EFS-OC22"}
