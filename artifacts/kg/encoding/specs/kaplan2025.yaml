  tensornet-omat24: {label: "TensorNet trained on OMat24", method: TensorNet, dataset: omat24, settings: {cutoffRadius: {v: 5, loc: "Table 2"}, numFeatures: {v: 128, loc: "Table 2"}, numLayers: {v: 2, loc: "Table 2"}, learningRate: {v: 0.001, loc: "Table 2"}}, model: "TensorNet trained on OMat24 (MatGL)"}
