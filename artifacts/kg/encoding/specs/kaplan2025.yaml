id: kaplan2025
source:
  rank: 223
  year: "2025"
  first_author: "Aaron D. Kaplan"
  title: "A Foundational Potential Energy Surface Dataset for Materials"
  venue: "arXiv"
  doi: "10.48550/arxiv.2503.04070"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2503.04070v1"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "4d3e14476a18f92b228f4bd2a58f071b46210ba4e4343fd8dd03124e5dd5b8f3"
study_label: "Kaplan et al. (2025): MatPES, a foundational potential energy surface data set for materials"
scope: |
  Encoding scope: the MatPES data set introduced here (PBE and r2SCAN
  subsets) and the universal MLIPs trained in MatGL on MatPES, MPF, MPtrj
  and OMat24 (Table 1): validation and test MAEs of energy, force and
  stress; the CPU timings of Table S5. The property benchmarks
  (MatCalc-Benchmark, Table S4 and figures), magnetic-moment errors and
  training-set MAEs are not encoded.
materials:
  inorganic: {label: "Inorganic materials across the periodic table (Materials Project ground states and their 300 K MD snapshots)", class: "Inorganic crystalline materials (equilibrium and 300 K MD)"}
reference:
  pbe: {type: DFT, code: VASP, xc: PBE, pp: PAW, comment: "VASP 6.4.x, PBE 64 pseudopotentials, MatPESStaticSet (pymatgen) settings, Gaussian smearing with pseudo-entropy below 1 meV/atom (Methods; Tables S6, S7)."}
  r2scan: {type: DFT, code: VASP, xc: {local: "r2SCAN"}, pp: PAW, comment: "r2SCAN started from self-consistent PBE orbitals; same settings otherwise."}
sampling:
  md-2direct: {label: "M3GNet NpT MD at 300 K of Materials Project structures and supercells, 2DIRECT sampling", comment: "281,853,572 MD snapshots of 281,572 initial structures, clustered in M3GNet structural and atomic feature space (15,192 structural clusters); the smallest structure per cluster was computed with DFT (Methods)."}
datasets:
  matpes-pbe: {label: "MatPES PBE (434,712 structures; 90% training)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 434712, loc: "Results; Table S3"}, calc: pbe, sampling: [md-2direct], comment: "Random 90/5/5 training/validation/test split; the test set has 21,737 structures."}
  matpes-r2scan: {label: "MatPES r2SCAN (387,897 structures; 90% training)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: InHouse, n: {v: 387897, loc: "Results; Table S3"}, calc: r2scan, sampling: [md-2direct]}
  mpf: {label: "MPF (185,877 structures)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 185877, loc: "Table S3"}}
  mptrj: {label: "MPtrj (1,580,395 structures)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 1580395, loc: "Table S3"}}
  omat24: {label: "OMat24 training split (100,824,585 structures)", materials: [inorganic], properties: [Energy, Forces, Stresses], provenance: Published, n: {v: 100824585, loc: "Table S3"}}
methods:
  M3GNet:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate]
    loss: "L1 loss on energy, force and stress (stress weight 0.1)"
    algorithm: "AMSGrad AdamW, learning rate 1e-3 down to 1e-5"
    impl: {lib: {local: "MatGL", comment: "Materials Graph Library 1.13"}}
    sims: [MolecularDynamics, GeometryOptimization]
  TensorNet:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate]
    loss: "L1 loss on energy, force and stress (stress weight 0.1)"
    algorithm: "AMSGrad AdamW, learning rate 1e-3 down to 1e-5"
    impl: {lib: {local: "MatGL", comment: "Materials Graph Library 1.13"}}
    sims: [MolecularDynamics, GeometryOptimization]
  CHGNet:
    hp: [cutoffRadius, numFeatures, numLayers, learningRate]
    loss: "Huber loss (delta 0.1) on energy, force, stress (0.05) and magnetic moments"
    algorithm: "Adam, learning rate 1e-3 down to 1e-5"
    impl: {lib: {local: "MatGL", comment: "Materials Graph Library 1.13"}}
    sims: [MolecularDynamics, GeometryOptimization]
runs:
  m3gnet-pbe: {label: "M3GNet trained on MatPES PBE", method: M3GNet, dataset: matpes-pbe, settings: {cutoffRadius: {v: 5, loc: "Table 2"}, numFeatures: {v: 128, loc: "Table 2"}, numLayers: {v: 3, loc: "Table 2"}, learningRate: {v: 0.001, loc: "Table 2"}}, model: "M3GNet trained on MatPES PBE (MatGL)"}
  chgnet-pbe: {label: "CHGNet trained on MatPES PBE", method: CHGNet, dataset: matpes-pbe, settings: {cutoffRadius: {v: 6, loc: "Table 2"}, numFeatures: {v: 128, loc: "Table 2"}, numLayers: {v: 5, loc: "Table 2"}, learningRate: {v: 0.001, loc: "Table 2"}}, model: "CHGNet trained on MatPES PBE (MatGL)"}
  tensornet-pbe: {label: "TensorNet trained on MatPES PBE", method: TensorNet, dataset: matpes-pbe, settings: {cutoffRadius: {v: 5, loc: "Table 2"}, numFeatures: {v: 128, loc: "Table 2"}, numLayers: {v: 2, loc: "Table 2"}, learningRate: {v: 0.001, loc: "Table 2"}}, model: "TensorNet trained on MatPES PBE (MatGL)"}
