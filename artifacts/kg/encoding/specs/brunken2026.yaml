study_label: "Brunken et al. (2026): mlip v2, open-source software for efficient and scalable MLIP simulation"
scope: |
  Encoding scope: the four pre-trained models released with mlip v2
  (MACE, NequIP, ViSNet, eSEN, with partial-charge heads) trained on a
  curated SPICE2 subset of OMol25, with their hyperparameters (Appendix F)
  and MD speed on a single H100 (Table 7). Validation MAEs and RMSEs are
  shown only in Figs. 2 and 6, so there are no results. Hessian-trained
  vibrational frequencies (Table 1) and MLIPAudit scores (Table 6) are
  property benchmarks.
materials:
  organics: {label: "Organic and biomolecular systems of 17 elements (SPICE2 subset of OMol25, including charged systems)", class: "organic molecules"}
  chignolin: {label: "1UAO chignolin (138 atoms)", class: "protein"}
  1abt: {label: "1ABT system (1205 atoms)", class: "biomolecular system"}
reference:
  omol: {type: DFT, comment: "OMol25 published labels (level of theory not restated; Hessian references in Sec. 5.2 use wB97M-V/def2-TZVPD with PySCF)."}
datasets:
  spice2-omol: {label: "Curated SPICE2 subset of OMol25 (1,763,962 train / 172,838 validation / 17,477 test structures; SMILES-based split)", materials: [organics], properties: [Energy, Forces], provenance: Augmented, n: {v: 1763962, loc: "Appendix E"}, calc: omol}
methods:
  MACE:
    hp: [numLayers, numFeatures, cutoffRadius, batchSize, learningRate, numEpochs]
    loss: "MSE with energy 40 / force 1000 weights flipped at epoch 115, charge and partial-charge terms"
    impl: {lib: {local: mlip}, comment: "InstaDeep mlip v2 (JAX) with e3j kernels; AMSGrad, EMA 0.99"}
    sims: [MolecularDynamics]
  NequIP:
    hp: [numLayers, cutoffRadius, batchSize, learningRate, numEpochs]
    impl: {lib: {local: mlip}}
    sims: [MolecularDynamics]
  ViSNet:
    hp: [numLayers, numFeatures, cutoffRadius, batchSize, learningRate, numEpochs]
    impl: {lib: {local: mlip}}
    sims: [MolecularDynamics]
  eSEN:
    hp: [numLayers, numFeatures, numEpochs]
    impl: {lib: {local: mlip}}
    sims: [MolecularDynamics]
runs:
