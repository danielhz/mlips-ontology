id: dai2026
source:
  rank: 461
  year: "2026"
  first_author: "Zhenxing Dai"
  title: "Small-supercell and Small-dataset Training Strategy of Machine Learning Interatomic Potentials for Point Defects"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2609.24293"
  kg_relevance: "Dataset/benchmark"
  arxiv_id: "2609.24293v1"
  pdf_version: "arxiv-preprint"
