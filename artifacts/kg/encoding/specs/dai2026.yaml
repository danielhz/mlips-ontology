  r-do-sio22: {label: "Allegro for V_O2+ in SiO2, Defect-Only (training set III)", method: Allegro, dataset: do-sio22, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_O2+ in SiO2, Defect-Only"}
  r-do-czts: {label: "Allegro for Cu_Zn- in Cu2ZnSnS4, Defect-Only (training set III)", method: Allegro, dataset: do-czts, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro Cu_Zn- in Cu2ZnSnS4, Defect-Only"}
  r-dh-gan1: {label: "Allegro for V_N+ in GaN, Defect+Host (training set IV)", method: Allegro, dataset: dh-gan1, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_N+ in GaN, Defect+Host"}
  r-dh-gan2: {label: "Allegro for V_N2+ in GaN, Defect+Host (training set IV)", method: Allegro, dataset: dh-gan2, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_N2+ in GaN, Defect+Host"}
  r-dh-gan3: {label: "Allegro for V_N3+ in GaN, Defect+Host (training set IV)", method: Allegro, dataset: dh-gan3, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_N3+ in GaN, Defect+Host"}
  r-dh-sio21: {label: "Allegro for V_O+ in SiO2, Defect+Host (training set III)", method: Allegro, dataset: dh-sio21, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_O+ in SiO2, Defect+Host"}
  r-dh-sio22: {label: "Allegro for V_O2+ in SiO2, Defect+Host (training set III)", method: Allegro, dataset: dh-sio22, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro V_O2+ in SiO2, Defect+Host"}
  r-dh-czts: {label: "Allegro for Cu_Zn- in Cu2ZnSnS4, Defect+Host (training set III)", method: Allegro, dataset: dh-czts, settings: {cutoffRadius: {v: 6, loc: "Methods"}, numLayers: {v: 2, loc: "Methods"}, learningRate: {v: 0.002, loc: "Methods"}, lmax: {v: 2, loc: "Methods"}}, model: "Allegro Cu_Zn- in Cu2ZnSnS4, Defect+Host"}
results: []
gaps:
  - "No MAE/RMSE/R2 metrics: accuracy is reported as the total-energy error and the RMSD of single relaxed structures in larger test supercells (e.g. 0.216 eV for the 323-atom SiO2 V_O2+ supercell, Defect-Only set III), in the text and Figs. 1-4. These single-structure errors are not encoded."
  - "Smaller incremental training sets (I-III) of Tables II-IV are not separate runs. The maximum of 100,000 epochs is a cap with early stopping, so no epoch count is encoded. Train/validation splits: 8.5:1.5 (SiO2, Cu2ZnSnS4), 8:2 (GaN)."
