id: liao2023
source:
  rank: 204
  year: "2023"
  first_author: "Yi-Lun Liao"
  title: "EquiformerV2: Improved Equivariant Transformer for Scaling to Higher-Degree Representations"
  venue: "arXiv (Cornell University)"
  doi: "10.48550/arxiv.2306.12059"
  kg_relevance: "Method/model"
  arxiv_id: "2306.12059v3"
  pdf_version: "arxiv-preprint"
  pdf_sha256: "b6100110d9b4a65aa220f2e13f955975f86ff153cd2e8b401ca6db750b622a29"
study_label: "Liao et al. (2024): EquiformerV2, an improved equivariant transformer scaling to higher-degree representations"
scope: |
  Encoding scope: the EquiformerV2 architecture (introduced here) and its
  energy and force errors on OC20 S2EF (Tables 1, 2, 6), OC22 S2EF-Total
  (Table 4) and the QM9 U0 task (Table 5), plus the Equiformer model the
  authors trained on OC20 S2EF-2M for comparison (Table 6). Ablation
  variants of Table 1 other than the base setting, the eSCN ablation
  baselines, IS2RS/IS2RE and AdsorbML results, the other eleven QM9 targets
  and values quoted from other papers are not encoded.
materials:
  oc20: {label: "Adsorbate-catalyst surface systems (OC20)", class: "Heterogeneous catalysis: adsorbates on inorganic surfaces"}
  oc22: {label: "Oxide electrocatalyst surfaces with adsorbates (OC22)", class: "Heterogeneous catalysis: oxide surfaces"}
  qm9: {label: "Small organic molecules (QM9)", class: "Small organic molecules (gas phase)"}
datasets:
  s2ef-2m: {label: "OC20 S2EF 2M training split", materials: [oc20], properties: [Energy, Forces], provenance: Published, n: {v: 2000000, loc: "Sec. 4.3 (2M examples)"}}
  s2ef-all: {label: "OC20 S2EF-All training split", materials: [oc20], properties: [Energy, Forces], provenance: Published}
  s2ef-allmd: {label: "OC20 S2EF-All+MD training split", materials: [oc20], properties: [Energy, Forces], provenance: Published}
  oc22: {label: "OC22 S2EF-Total training data", materials: [oc22], properties: [Energy, Forces], provenance: Published, comment: "OC22 energies are DFT total energies; about 8.4M structures (Sec. 4.2)."}
  qm9: {label: "QM9 training set (about 110k molecules)", materials: [qm9], properties: [Energy], provenance: Published}
hyperparameters:
  Lmax: {label: "Maximum degree Lmax of the equivariant irreps features", name: "Lmax", datatype: integer}
methods:
  EquiformerV2:
    hp: [cutoffRadius, numLayers, numRadialBasis, Lmax, learningRate, batchSize, numEpochs]
    loss: "Weighted sum of energy and force errors with energy coefficient lambda_E and force coefficient lambda_F"
    algorithm: "AdamW with cosine learning-rate schedule and linear warmup, model EMA"
    impl: {lib: {local: "equiformer_v2", comment: "https://github.com/atomicarchitects/equiformer_v2; relaxations with the Open Catalyst repository LBFGS"}}
    sims: [GeometryOptimization]
  Equiformer:
    hp: [Lmax]
runs:
  eqv2-2m-L6: {label: "EquiformerV2 base setting on OC20 S2EF-2M (Lmax 6, 12 blocks)", method: EquiformerV2, dataset: s2ef-2m, settings: {cutoffRadius: {v: 12, loc: "Table 7"}, numLayers: {v: 12, loc: "Table 7"}, numRadialBasis: {v: 600, loc: "Table 7"}, Lmax: {v: 6, loc: "Table 7"}, learningRate: {v: 0.0002, loc: "Table 7"}, batchSize: {v: 64, loc: "Table 7"}, numEpochs: {v: 12, loc: "Table 7"}}, model: "EquiformerV2 S2EF-2M base model (83.16M parameters)", gpuHours: {v: 1412, loc: "Table 8"}, trainingHardware: "16 NVIDIA V100 32GB GPUs"}
  eqv2-2m-L4: {label: "EquiformerV2 on OC20 S2EF-2M with Lmax 4", method: EquiformerV2, dataset: s2ef-2m, settings: {Lmax: {v: 4, loc: "Table 6"}}, model: "EquiformerV2 S2EF-2M model, Lmax 4 (44.83M parameters)", gpuHours: {v: 966, loc: "Table 6"}, trainingHardware: "16 NVIDIA V100 32GB GPUs"}
  eqv2-2m-L2: {label: "EquiformerV2 on OC20 S2EF-2M with Lmax 2", method: EquiformerV2, dataset: s2ef-2m, settings: {Lmax: {v: 2, loc: "Table 6"}}, model: "EquiformerV2 S2EF-2M model, Lmax 2", gpuHours: {v: 600, loc: "Table 6"}, trainingHardware: "NVIDIA V100 32GB GPUs"}
  equiformer-2m-L2: {label: "Equiformer trained by the authors on OC20 S2EF-2M with Lmax 2", method: Equiformer, dataset: s2ef-2m, settings: {Lmax: {v: 2, loc: "Table 6"}}, model: "Equiformer S2EF-2M model, Lmax 2", gpuHours: {v: 1365, loc: "Table 6"}, trainingHardware: "NVIDIA V100 32GB GPUs"}
  eqv2-all-153m: {label: "EquiformerV2 (lambda_E 2, 153M) on OC20 S2EF-All", method: EquiformerV2, dataset: s2ef-all, settings: {cutoffRadius: {v: 12, loc: "Table 7"}, numLayers: {v: 20, loc: "Table 7"}, numRadialBasis: {v: 600, loc: "Table 7"}, Lmax: {v: 6, loc: "Table 7"}, learningRate: {v: 0.0004, loc: "Table 7"}, batchSize: {v: 256, loc: "Table 7"}, numEpochs: {v: 1, loc: "Table 7"}}, model: "EquiformerV2 (lambda_E 2, 153M) trained on S2EF-All", gpuHours: {v: 20499, loc: "Table 8"}, trainingHardware: "64 NVIDIA V100 32GB GPUs"}
