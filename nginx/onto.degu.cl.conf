# onto.degu.cl — nginx vhost (TRACKED REFERENCE, not a deploy channel).
#
# The live vhost is Certbot-managed and edited in place on the host by
# Daniel; this file mirrors its current structure for reference/history.
# Do not treat it as copy-deployable (the TLS lines below are the live
# Certbot paths, kept as reference — no cert material is committed).
#
# STATUS (2026-06-19): TRANSITIONAL, REVERSIBLE.
#   w3id.org/mlips currently resolves here and we 302-redirect /mlips* to
#   the new concon on the TEMPORARY host kg.informatik.uni-stuttgart.de.
#   302 (not 301) keeps it fully reversible while concon is on a throwaway
#   host. The w3id .htaccess is untouched (it still points at onto.degu.cl);
#   the legacy onto-server still serves everything else via location / .
#
# FINAL-CUTOVER TODO (when the permanent concon host is fixed):
#   - bump the ontology redirects 302 -> 301 (permanent);
#   - switch the entity rule 302 -> 303 (See Other; slash IRIs are
#     non-information resources);
#   - point them at the FINAL host (never a throwaway);
#   - land the w3id .htaccess PR (edge rule set 1) so w3id redirects
#     straight to the final host and onto.degu.cl drops out of the path.
#   See concon/docs/edge-mapping.org (rule set 1 = end state; rule set 2
#   = this transitional onto.degu.cl step).

# HTTP -> HTTPS (Certbot-managed redirect block).
server {
    listen 80;
    listen [::]:80;
    server_name onto.degu.cl;
    return 301 https://$host$request_uri;
}

# HTTPS terminating proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name onto.degu.cl;

    # --- TLS (managed by Certbot; paths shown as reference) ---
    ssl_certificate     /etc/letsencrypt/live/onto.degu.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/onto.degu.cl/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;          # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                # managed by Certbot

    # --- Transitional /mlips redirects to the new concon (a4 rule set 2) ---
    # The entity regex must be matched before the /mlips/ prefix below; a
    # plain prefix location (not ^~) lets this regex win.
    location ~ "^/mlips/entity/(.+)$" {
        return 302 https://kg.informatik.uni-stuttgart.de/mlips/_ds/mlips/_entity/$1;
    }
    location = /mlips {
        return 302 https://kg.informatik.uni-stuttgart.de/mlips/_ds/mlips/;
    }
    location /mlips/ {
        return 302 https://kg.informatik.uni-stuttgart.de/mlips/_ds/mlips/;
    }

    # --- Everything else: the legacy onto-server ---
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
